function snapShape(raw){
  try{ return snapShapeImpl(raw); }catch(e){ console.warn('shape snap failed',e); return null; }
}
function snapShapeImpl(raw){
  const n0=raw.length; if(n0<6) return null;
  let L=0, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, ps=0;
  for(let i=0;i<n0;i++){
    const q=raw[i]; ps+=q.p;
    if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y;
    if(i) L+=dist(raw[i-1],q);
  }
  const D=Math.hypot(x1-x0,y1-y0), pAvg=ps/n0, A=raw[0], B=raw[n0-1], chord=dist(A,B);
  if(L<60||D<35) return null;

  /* LINE: nearly straight open stroke */
  if(chord>=50&&chord/L>0.9){
    const R=snapResample(raw,40,false);
    if(R){
      const dx=B.x-A.x, dy=B.y-A.y; let dev=0;
      for(const p of R) dev=Math.max(dev,Math.abs((p.x-A.x)*dy-(p.y-A.y)*dx)/chord);
      if(dev/chord<0.06){
        let th=Math.atan2(dy,dx); const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, snap=4*Math.PI/180;
        for(const t of [0,Math.PI/2,Math.PI,-Math.PI/2,-Math.PI]) if(Math.abs(th-t)<snap) th=t;
        const hx=Math.cos(th)*chord/2, hy=Math.sin(th)*chord/2;
        return snapDense([{x:mx-hx,y:my-hy},{x:mx+hx,y:my+hy}],false,pAvg);
      }
    }
    return null;
  }

  /* closed shapes only from here */
  if(chord>0.2*L) return null;
  const P=snapResample(raw,72,true); if(!P) return null;
  const H=snapHull(P); if(H.length<3) return null;
  const cands=[];

  // circle
  let cx=0, cy=0; for(const p of P){ cx+=p.x; cy+=p.y; } cx/=P.length; cy/=P.length;
  let r=0; for(const p of P) r+=Math.hypot(p.x-cx,p.y-cy); r/=P.length;
  let ce=0, cm=0; for(const p of P){ const d=Math.abs(Math.hypot(p.x-cx,p.y-cy)-r); ce+=d; if(d>cm) cm=d; }
  cands.push({k:'circle',err:ce/P.length/D,max:cm/D,ratio:L/(2*Math.PI*r),cx,cy,r});

  // rectangle / square
  const mr=snapMinRect(H);
  if(mr&&mr.w>5&&mr.h>5){
    const th0=Math.atan2(mr.uy,mr.ux), V=snapRectCorners(mr.cx,mr.cy,mr.w,mr.h,th0), e=snapPolyErr(P,V);
    cands.push({k:'rect',err:e.mean/D,max:e.max/D,ratio:L/snapPerim(V),mr});
  }

  // triangle
  const T=snapMaxTri(H);
  if(T){ const e=snapPolyErr(P,T); cands.push({k:'tri',err:e.mean/D,max:e.max/D,ratio:L/snapPerim(T),T}); }

  cands.sort((a,b)=>a.err-b.err);
  const c=cands[0];
  if(c.err>0.03||c.max>0.09||c.ratio<0.8||c.ratio>1.45) return null;

  // start where the user started, same direction
  let area=0; for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length]; area+=a.x*b.y-b.x*a.y; }
  if(c.k==='circle'){
    const a0=Math.atan2(A.y-c.cy,A.x-c.cx), dir=area>=0?1:-1, m=Math.max(48,Math.ceil(2*Math.PI*c.r/2.5)), out=[];
    for(let i=0;i<=m;i++){ const a=a0+dir*2*Math.PI*i/m; out.push({x:c.cx+c.r*Math.cos(a),y:c.cy+c.r*Math.sin(a),p:pAvg}); }
    return out;
  }
  let V;
  if(c.k==='rect'){
    let {w,h}=c.mr, th=Math.atan2(c.mr.uy,c.mr.ux);
    while(th>Math.PI/4){ th-=Math.PI/2; const t=w; w=h; h=t; }
    while(th<-Math.PI/4){ th+=Math.PI/2; const t=w; w=h; h=t; }
    if(Math.abs(th)<7*Math.PI/180) th=0;
    if(Math.abs(w-h)<0.12*Math.max(w,h)){ w=h=(w+h)/2; } // square
    V=snapRectCorners(c.mr.cx,c.mr.cy,w,h,th);
  }else V=c.T.map(p=>({x:p.x,y:p.y}));
  let s=0; for(let i=1;i<V.length;i++) if(dist(V[i],A)<dist(V[s],A)) s=i;
  V=V.slice(s).concat(V.slice(0,s));
  return snapDense(V,true,pAvg);
}

   If it touches nothing it stays as normal ink. Highlighter strokes are never erased this way.
   --------------------------------------------------------------- */

// number of direction reversals along one axis, ignoring wiggles smaller than h
function scribTurns(vals,h){
  let d=0, ex=vals[0], t=0;
  for(const v of vals){
    if(d===0){ if(Math.abs(v-ex)>=h){ d=v>ex?1:-1; ex=v; } }
    else if(d===1){ if(v>ex) ex=v; else if(ex-v>=h){ t++; d=-1; ex=v; } }
    else{ if(v<ex) ex=v; else if(v-ex>=h){ t++; d=1; ex=v; } }
  }
  return t;
}
// returns path length when the stroke looks like a scribble, else 0
function scribbleLen(raw){
  if(raw.length<12) return 0;
  let L=0, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<raw.length;i++){
    const q=raw[i]; if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y;
    if(i) L+=dist(raw[i-1],q);
  }
  const D=Math.hypot(x1-x0,y1-y0);
  if(L<120||D<40||L/D<3.5) return 0;
  const R=snapResample(raw,Math.max(24,Math.round(L/4)),false); if(!R) return 0;
  // zigzag: >=4 reversals along x, y or either diagonal
  let best=0;
  for(const [ax,ay] of [[1,0],[0,1],[0.7071,0.7071],[0.7071,-0.7071]]){
    const v=R.map(p=>p.x*ax+p.y*ay), ext=Math.max(...v)-Math.min(...v);
    best=Math.max(best,scribTurns(v,Math.max(12,0.5*ext)));
  }
  if(best>=5) return L;
  // looping scribble: three or more full turns packed into a small area
  let turn=0;
  for(let i=1;i<R.length-1;i++){
    const ax=R[i].x-R[i-1].x, ay=R[i].y-R[i-1].y, bx=R[i+1].x-R[i].x, by=R[i+1].y-R[i].y, la=Math.hypot(ax,ay), lb=Math.hypot(bx,by);
    if(la<1e-6||lb<1e-6) continue;
    turn+=Math.acos(Math.max(-1,Math.min(1,(ax*bx+ay*by)/(la*lb))));
  }
  return (turn>=7*Math.PI&&L/D>=5)?L:0;
}
function scribbleErase(raw){
  if(!gp) return false;
  const L=scribbleLen(raw); if(!L) return false;
  const S=snapResample(raw,Math.max(24,Math.ceil(L/3)),false); if(!S) return false;
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  for(const q of S){ if(q.x<bx0)bx0=q.x; if(q.x>bx1)bx1=q.x; if(q.y<by0)by0=q.y; if(q.y>by1)by1=q.y; }
  const removed=[];
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i]; if(sd.alpha) continue;
      if(sd.shape&&!eraseShapesOn) continue; // Erase shapes off: shapes are protected
      const P=sd.pts, r=5+sd.maxW/2; let hit=false, inside=0;
      for(const p of P) if(p.x>=bx0-6&&p.x<=bx1+6&&p.y>=by0-6&&p.y<=by1+6) inside++;
      if(inside<0.5*P.length) continue; // only strokes mostly under the scribble, not ones it merely crosses
      for(let k=(P.length>1?1:0);k<P.length&&!hit;k++){
        const a=P.length>1?P[k-1]:P[0], b=P[k];
        if(Math.max(a.x,b.x)<bx0-r||Math.min(a.x,b.x)>bx1+r||Math.max(a.y,b.y)<by0-r||Math.min(a.y,b.y)>by1+r) continue;
        for(const q of S) if(snapSegDist(q,a,b)<=r){ hit=true; break; }
      }
      if(hit){ layer.strokes.splice(i,1); removed.push({layer,sd,index:i}); }
    }
  }
  if(!removed.length) return false; // nothing underneath: keep it as ordinary ink
  gp.history.push({t:'erase',items:removed});
  cur=null; clearLive();
  for(const l of new Set(removed.map(x=>x.layer))) repaintLayer(l);
  return true;
}

  // click anywhere else closes the popups (capture: runs even when other handlers stop propagation)
  document.addEventListener('click',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu')||toggles.some(t=>t.contains(e.target)))) return;
    closeMenus();
  },true);
  // 'click' never fires for stylus strokes or finger scrolls on the canvas, so also close on pointerdown
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu')||toggles.some(t=>t.contains(e.target)))) return;
    const wasOpen=menus.some(m=>m.style.display==='block');
    closeMenus();
    // The press that closes a popup must not leave ink: stop it before the canvas handlers see it.
    // (Touch is left alone so a finger can still scroll/pinch; fingers never draw anyway.)
    if(wasOpen&&e.pointerType!=='touch'){
      if(e.pointerType==='pen') penDown=true; // released by the window pointerup listener
      e.stopPropagation(); e.preventDefault();
    }
  },true);

  // init
  setVal('erSize',S.er); ER=S.er; setVal('arSize',S.ar);
  loadSel();
})();
</script>
</body>
</html>
