/* ============================================================

   .stage holds the PDF base canvas (always first child, so always
   underneath), ink-layer SVGs and box elements as siblings,

/* ============================================================
   SECTION: BOX SHELL (shared by text boxes and image boxes)
   ============================================================ */
.tbox{position:absolute;box-sizing:border-box;border:calc(1px*var(--z,1)) solid transparent;border-radius:3px;pointer-events:none;touch-action:none}
.tbox.v2.editing{touch-action:auto}
.tbox.v2 .rendered.v2c.raw p{margin:0;white-space:pre-wrap}
.tbox.v2 .rendered.v2c.raw p:empty::before{content:'\00a0'}
.tbox.v2 .rendered.v2c.raw .ProseMirror{white-space:pre-wrap}
.tbox.v2.editing.v2rend .handle{display:block} /* s6f: rendered mode = live editor, resize handles stay (centre move button stays hidden so it never covers the text) */
.tbox.editing,.tbox.selected{pointer-events:auto}
[data-mode="text"][data-text-sub="edit"] .tbox.kind-text{pointer-events:auto}
[data-mode="image"] .tbox.kind-image{pointer-events:auto}
[data-mode="select"] .tbox{pointer-events:auto}
.tbox:hover{border-color:var(--bd)}
.tbox.editing{border-color:var(--ac)}
.tbox.selected{border-color:var(--ac)}

/* -- text box: editor / rendered view -- */
.tbox textarea{display:none;width:100%;height:100%;box-sizing:border-box;resize:none;border:none;outline:none;padding:calc(4px*var(--z,1));font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--fs,13px)*var(--z,1));line-height:1.4;background:transparent;color:var(--tc,#111);caret-color:var(--tc,#111)}
.tbox.editing textarea{display:block}
.tbox .rendered{display:block;width:100%;height:100%;overflow:hidden;padding:calc(4px*var(--z,1));box-sizing:border-box;font-size:calc(var(--fs,13px)*var(--z,1));line-height:1.4;color:var(--tc,#111);cursor:text}
.tbox.editing .rendered{display:none}
.tbox .rendered>*:first-child{margin-top:0}
.tbox .rendered>*:last-child{margin-bottom:0}
.tbox .rendered table{border-collapse:collapse;margin:calc(6px*var(--z,1)) 0;font-size:.92em}
.tbox .rendered th,.tbox .rendered td{border:calc(1px*var(--z,1)) solid #999;padding:calc(3px*var(--z,1)) calc(7px*var(--z,1));text-align:left}
.tbox .rendered ul,.tbox .rendered ol{padding-left:calc(40px*var(--z,1))}
.tbox .rendered blockquote{margin-left:calc(40px*var(--z,1));margin-right:calc(40px*var(--z,1))}
.tbox .rendered th{background:rgba(128,128,128,.22);font-weight:600}
/* -- floating toolbar for text boxes: shown while selected/editing (edit-existing sub-mode only) -- */
.tbox .fToolbar{display:none;position:absolute;top:-34px;left:0;background:#171717;border:1px solid #333;border-radius:6px;padding:3px;gap:3px;z-index:7;white-space:nowrap}
.tbox.selected .fToolbar,.tbox.editing .fToolbar{display:flex}
.tbox .fToolbar button{background:#262626;color:#f3f4f6;border:1px solid #3a3a3a;border-radius:4px;padding:3px 8px;font:12px/1 system-ui;cursor:pointer}
.tbox .fToolbar button:hover{background:#333}
.tbox .fToolbar .fDel{background:#dc2626;border-color:#dc2626}
.tbox .fToolbar .fDel:hover{background:#b91c1c}
.tbox .fToolbar .fEdit{display:none}
.tbox.selected .fToolbar .fEdit{display:inline-block}
.tbox .fToolbar .fRender{display:none}
.tbox.editing .fToolbar .fRender{display:inline-block}

/* -- reflow: text wraps to the box width; overflow at the bottom is clipped, spare height stays empty -- */
.tbox .rendered{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.tbox .rendered pre{white-space:pre-wrap;overflow-wrap:anywhere}
.tbox .rendered img{max-width:100%}
.tbox .rendered table{max-width:100%;table-layout:auto}
.tbox .rendered .katex-display{overflow:hidden}
.tbox .rendered .lnk{color:#2563eb;text-decoration:underline;cursor:default}
.tbox.tb-below .fToolbar{top:calc(100% + 10px)}
.tbox .rendered{font-family:var(--ff,inherit)}
.tbox .fToolbar .fFont{display:none;font:700 12px/1 system-ui;line-height:1}
.tbox.selected .fToolbar .fFont{display:inline-block}
.tbox .fToolbar .fPop{display:none;position:absolute;top:calc(100% + 6px);left:0;flex-direction:column;gap:8px;min-width:220px;padding:8px;background:#171717;border:1px solid #333;border-radius:8px;z-index:8}
.tbox.selected .fToolbar .fPop.open{display:flex}
.tbox .fToolbar .fPop .fp-row{display:flex;align-items:center;gap:6px}
.fPop .fp-cols{flex-wrap:wrap}
.fPop .fp-sw{flex:none;width:24px!important;height:24px!important;min-width:0!important;min-height:0!important;padding:0!important;border-radius:50%!important;border:2px solid rgba(128,128,128,.55)!important;cursor:pointer}
.fPop .fp-sw.on{outline:2px solid var(--ac);outline-offset:1px}
.fPop .fp-cc{flex:none;width:30px;height:26px;padding:0;border:0;background:none;cursor:pointer}
.fPop .fp-lbl{font:600 11px system-ui;opacity:.7;margin-bottom:-4px}
.tbox .fToolbar .fPop button{line-height:1.2;padding:6px 10px;font:13px system-ui;min-height:30px}
.tbox .fToolbar .fPop .fp-chip{flex:1}
.tbox .fToolbar .fPop .fp-sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.tbox .fToolbar .fPop .fp-serif{font-family:"Times New Roman",Times,Georgia,serif}
.tbox .fToolbar .fPop .fp-chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tbox .fToolbar .fPop .fp-pm{min-width:30px;padding:6px 0}
.tbox .fToolbar .fPop input[type=range]{flex:1;min-width:90px}
.tbox .fToolbar .fPop output{color:#f3f4f6;font:12px system-ui;min-width:44px;text-align:right}
/* -- touch-friendly: bigger hit areas (finger, pen, mouse all work) -- */
.tbox .handle::before{content:"";position:absolute;inset:-11px}
.tbox .fToolbar{top:-38px;gap:8px;padding:3px 5px}
.tbox .fToolbar button{min-height:0;min-width:0;padding:3px 6px;line-height:0}
.tbox .fToolbar .fMove{display:inline-block;cursor:move;touch-action:none}
.tbox .fToolbar button svg{width:14px;height:14px;display:block;pointer-events:none}
@media (pointer:coarse){
  .tbox .handle{width:16px;height:16px}
  .tbox .handle::before{inset:-16px}
  .tbox .moveHandle{width:40px;height:40px;font-size:20px}
}
/* -- box chrome shared by text + image: delete / resize / move handles -- */
.tbox .fToolbar .fRatio.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tbox .fToolbar .fApply,.tbox .fToolbar .fCancel{display:none}
.tbox .fToolbar .fApply{background:#16a34a;border-color:#16a34a}
.tbox.cropping{pointer-events:auto}
.tbox.cropping .fToolbar .fApply,.tbox.cropping .fToolbar .fCancel{display:inline-block}
.tbox.cropping .fToolbar .fMove,.tbox.cropping .fToolbar .fRatio,.tbox.cropping .fToolbar .fCrop,.tbox.cropping .fToolbar .fDel{display:none}
.tbox.cropping>.handle,.tbox.cropping>.moveHandle{display:none!important}
.cropUI{position:absolute;inset:0;pointer-events:none;z-index:6}
.cropDim{position:absolute;inset:0;overflow:hidden}
.cropHole{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.cropRect{position:absolute;box-sizing:border-box;border:1.5px solid #fff;outline:1px solid var(--ac);pointer-events:auto;cursor:move;touch-action:none}
.cropRect .chd{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--ac);border-radius:2px;touch-action:none}
.cropRect .chd::before{content:"";position:absolute;inset:-14px}
.tbox .handle{position:absolute;width:11px;height:11px;background:var(--ac);border:1.5px solid #fff;border-radius:2px;display:none;z-index:4;touch-action:none}
.tbox.selected .handle{display:block}
.tbox.editing .handle{display:none}
.tbox.v2.editing .handle{display:block} /* s6zo: resize handles stay visible while editing */
.h-nw{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.h-n{left:50%;top:0;transform:translate(-50%,-50%);cursor:ns-resize}
.h-ne{left:100%;top:0;transform:translate(-50%,-50%);cursor:nesw-resize}
.h-e{left:100%;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.h-se{left:100%;top:100%;transform:translate(-50%,-50%);cursor:nwse-resize}
.h-s{left:50%;top:100%;transform:translate(-50%,-50%);cursor:ns-resize}
.h-sw{left:0;top:100%;transform:translate(-50%,-50%);cursor:nesw-resize}
.h-w{left:0;top:50%;transform:translate(-50%,-50%);cursor:ew-resize}
.tbox .moveHandle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;display:none;align-items:center;justify-content:center;font-size:14px;cursor:move;z-index:4;touch-action:none}
.tbox.selected .moveHandle{display:flex}

/* ============================================================
   SECTION: DIALOG (in-page confirm; native confirm() is blocked in sandboxed pages)
   ============================================================ */
#dlg{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#dlg .box{background:var(--bar);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* V87: page list (docked on wide screens, drawer on narrow) */
#pgSide{position:fixed;left:0;top:calc(66px + env(safe-area-inset-top,0px));bottom:0;width:140px;z-index:45;background:var(--bar);color:var(--fg);border-right:1px solid var(--bd);overflow-y:auto;padding:6px;display:none;flex-direction:column;gap:2px;touch-action:pan-y;box-sizing:border-box}

body.pgClosing:not(.pgSideOn) #pgSide{display:flex;animation:pgOut .22s ease-in forwards}
@keyframes pgIn{from{transform:translateX(-100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes pgOut{from{transform:none;opacity:1}to{transform:translateX(-100%);opacity:.4}}
#olSide{position:fixed;right:0;top:calc(66px + env(safe-area-inset-top,0px));bottom:0;width:240px;z-index:45;background:var(--bar);color:var(--fg);border-left:1px solid var(--bd);box-shadow:-6px 0 24px rgba(0,0,0,.28);overflow-y:auto;padding:6px;display:none;flex-direction:column;gap:1px;box-sizing:border-box}
body.pgSideOn:not(.olHide) #olSide{display:flex;animation:olIn .28s cubic-bezier(.2,.8,.2,1)}
body.pgSideOn.olHide.olClosing #olSide{display:flex;animation:olOut .22s ease-in forwards}
body.pgClosing:not(.pgSideOn):not(.olHide) #olSide{display:flex;animation:olOut .22s ease-in forwards}
#olSide .olhd{display:flex;align-items:center;justify-content:space-between;gap:6px}
#olSide .olx{flex:none;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:none;color:var(--tb-mut);font-size:14px;line-height:1;cursor:pointer}
#olSide .olx:hover{background:var(--tb-hov)}
#olSide .olno{padding:10px 8px;font-size:13px;opacity:.6}
@keyframes olIn{from{transform:translateX(100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes olOut{from{transform:none;opacity:1}to{transform:translateX(100%);opacity:.4}}
#olSide .olh{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--tb-mut);padding:4px 8px}

#olSide .oli:hover{background:var(--tb-hov)}
#olSide .oli.nd{opacity:.5}
#olSide .olc[hidden]{display:none}
#pgSide .pgh{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--tb-mut);padding:4px 8px}
#pgSide button{background:none;color:var(--fg);border:0;border-radius:8px;text-align:left;padding:9px 10px;flex:none}
#pgSide button:hover{background:var(--tb-hov)}

#pgBack{display:none;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.4)}
@media(min-width:900px){ #pgSide{box-shadow:6px 0 24px rgba(0,0,0,.28)} }
@media(max-width:899px){ #olSide{top:0;width:min(280px,calc(100vw - min(220px,72vw) - 8px));z-index:70;padding-top:calc(10px + env(safe-area-inset-top,0px))} #pgSide{top:0;width:min(220px,72vw);z-index:70;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:6px 0 30px rgba(0,0,0,.4)} body.pgSideOn #pgBack{display:block} }
/* Library: expandable section list on a card */

/* ============================================================
   HUE COLOUR PICKER — exact copy of the Hue picker (wheel, disc, sliders, presets, readout, copy).
   Everything is scoped under #huePk so it cannot clash with the app.
   ============================================================ */
#huePk,#huePk *{box-sizing:border-box;margin:0;padding:0}
#huePk{
  --h:228;--s:82%;--l:60%;
  --color:hsl(var(--h) var(--s) var(--l));
  --bg:#0e0e13;--card:#17171e;--line:rgba(255,255,255,.08);--text:#f3f3f7;--muted:rgba(243,243,247,.5);--ease:cubic-bezier(.2,.8,.2,1);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:16px;
  /* dim backdrop + the same static ambient tint the Hue page has (tinted by the current colour) */
  background:linear-gradient(rgba(5,5,8,.7),rgba(5,5,8,.7)),radial-gradient(60vmax 60vmax at 50% 0%,hsl(var(--h) var(--s) var(--l) / .22),transparent 70%);
  opacity:0;visibility:hidden;
  transition:opacity .2s ease,visibility 0s linear .2s;
}
#huePk.open{opacity:1;visibility:visible;transition:opacity .2s ease}
#huePk button:focus-visible{outline:auto}

#huePk .card{
  width:min(340px,100%);padding:22px 22px 20px;
  background:var(--card);border:1px solid var(--line);border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  transform:translateY(14px) scale(.96);
  transition:transform .28s var(--ease);
}
#huePk.open .card{transform:none}

#huePk .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#huePk .title{font-size:15px;font-weight:600;letter-spacing:.01em}
#huePk .x{
  width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;color:var(--muted);
  background:rgba(255,255,255,.06);display:grid;place-items:center;transition:background .15s,color .15s;
}
#huePk .x:hover{background:rgba(255,255,255,.12);color:#fff}
#huePk .x svg{width:12px;height:12px}

/* ---------- Wheel ---------- */
#huePk .wheel{position:relative;width:100%;aspect-ratio:1;margin:0 auto 22px;touch-action:none;outline:none;cursor:pointer}
#huePk .wheel:focus-visible{box-shadow:none}
#huePk .ring{

$('undo').onclick=()=>{
  const pg=activePage; if(!pg) return;
  const h=pg.history.pop(); if(!h) return;
  clearLassoSel();
  pg.redo.push(h);
  if(h.t==='move'){
    for(const o of (h.bx||[])){ o.nx=o.b.xPct; o.ny=o.b.yPct; o.b.xPct=o.x; o.b.yPct=o.y; applyBoxRect(o.b); }
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:p.x-h.dx,y:p.y-h.dy}));
    inkReplaceItems(h.items);
  }else if(h.t==='rotate'){
    const t=-h.ang*Math.PI/180, c=Math.cos(t), sn=Math.sin(t);
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:h.cx+(p.x-h.cx)*c-(p.y-h.cy)*sn,y:h.cy+(p.x-h.cx)*sn+(p.y-h.cy)*c}));
    for(const o of h.boxes){ o.nx=o.b.xPct; o.ny=o.b.yPct; o.nrot=o.b.rot; o.b.xPct=o.x; o.b.yPct=o.y; o.b.rot=o.rot; applyBoxRect(o.b); }
    inkReplaceItems(h.items);
  }else if(h.t==='paste'){
    h.sers=(h.boxes||[]).map(boxSer);
    for(const b of (h.boxes||[])){ if(b.endCrop) b.endCrop(false); b.kind==='image'?removeImageBox(b):removeBox(b); }
    for(const {layer,sd} of h.items){ const i=layer.strokes.indexOf(sd); if(i>=0) layer.strokes.splice(i,1); }
    for(const {layer,sd} of h.items) inkRemove(layer,sd);
  }else if(h.t==='recolor'){
    for(const it of h.items){ it.nw=it.sd.color; it.sd.color=it.old; }
    inkReplaceItems(h.items);
  }else if(h.t==='arrowhead'){
    h.newPts=h.sd.pts; h.ri=h.layer.strokes.indexOf(h.sd);
    h.sd.pts=h.oldPts; const j=h.layer.strokes.indexOf(h.head); if(j>=0) h.layer.strokes.splice(j,1);
    inkRemove(h.layer,h.head); inkReplace(h.layer,h.sd);
  }else if(h.t==='add'){
    const i=h.layer.strokes.indexOf(h.sd); h.ri=i; if(i>=0) h.layer.strokes.splice(i,1);
    if(h.extra){ const j=h.layer.strokes.indexOf(h.extra); if(j>=0) h.layer.strokes.splice(j,1); }
    if(h.extra||i<0) repaintLayer(h.layer); else inkRemove(h.layer,h.sd);
  }else if(h.t==='erase'){
    h.made=(h.boxes||[]).map(o=>boxMake(pg,o));
    const byLayer=new Map();
    for(const it of h.items){ if(!byLayer.has(it.layer)) byLayer.set(it.layer,[]); byLayer.get(it.layer).push(it); }
    for(const [layer,items] of byLayer){
      items.sort((a,b)=>a.index-b.index);
      for(const it of items) layer.strokes.splice(it.index,0,it.sd);
      for(const it of items) inkAdd(layer,it.sd);
    }

    for(const c of h.changes) c.layer.strokes.splice(c.index,c.newStrokes.length,c.oldSd);
    inkAreaSwap(h.changes,false);
  }else if(h.t==='boxxf'){
    boxXfApply(h.b,h.from);
  }else if(h.t==='clr'){
    for(const s of h.snapshot){ s.cur=s.layer.strokes; s.layer.strokes=s.strokes; repaintLayer(s.layer); }
  }
  pgtDirty(pg);
};
$('redo').onclick=()=>{
  const pg=activePage; if(!pg||!pg.redo) return;
  const h=pg.redo.pop(); if(!h) return;
  clearLassoSel();
  Array.prototype.push.call(pg.history,h); // bypasses the override so the rest of the redo stack survives
  if(h.t==='move'){
    for(const o of (h.bx||[])){ o.b.xPct=o.nx; o.b.yPct=o.ny; applyBoxRect(o.b); }
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:p.x+h.dx,y:p.y+h.dy}));
    inkReplaceItems(h.items);
  }else if(h.t==='rotate'){
    const t=h.ang*Math.PI/180, c=Math.cos(t), sn=Math.sin(t);
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:h.cx+(p.x-h.cx)*c-(p.y-h.cy)*sn,y:h.cy+(p.x-h.cx)*sn+(p.y-h.cy)*c}));
    for(const o of h.boxes){ o.b.xPct=o.nx; o.b.yPct=o.ny; o.b.rot=o.nrot; applyBoxRect(o.b); }
    inkReplaceItems(h.items);
  }else if(h.t==='paste'){
    for(const {layer,sd} of h.items) layer.strokes.push(sd);
    h.boxes=(h.sers||[]).map(o=>boxMake(pg,o));
    for(const {layer,sd} of h.items) inkAdd(layer,sd);
  }else if(h.t==='recolor'){
    for(const it of h.items) it.sd.color=it.nw;
    inkReplaceItems(h.items);
  }else if(h.t==='arrowhead'){
    h.sd.pts=h.newPts; const i=h.layer.strokes.indexOf(h.sd); h.layer.strokes.splice(i<0?h.layer.strokes.length:i+1,0,h.head);
    inkReplace(h.layer,h.sd); inkAdd(h.layer,h.head);
  }else if(h.t==='add'){
    const ri=(h.ri>=0&&h.ri<=h.layer.strokes.length)?h.ri:h.layer.strokes.length;
    h.layer.strokes.splice(ri,0,h.sd);
    if(h.extra) h.layer.strokes.splice(ri+1,0,h.extra);
    if(h.extra) repaintLayer(h.layer); else inkAdd(h.layer,h.sd);
  }else if(h.t==='erase'){
    for(const b of (h.made||[])){ if(b.endCrop) b.endCrop(false); b.kind==='image'?removeImageBox(b):removeBox(b); }
    h.made=null;
    const byLayer=new Map();
    for(const it of h.items){ if(!byLayer.has(it.layer)) byLayer.set(it.layer,[]); byLayer.get(it.layer).push(it); }
    for(const [layer,items] of byLayer){
      items.sort((a,b)=>b.index-a.index);
      for(const it of items){ const i=layer.strokes.indexOf(it.sd); if(i>=0) layer.strokes.splice(i,1); }
      for(const it of items) inkRemove(layer,it.sd);
    }
  }else if(h.t==='areaErase'){
    for(let k=h.changes.length-1;k>=0;k--){ const c=h.changes[k]; c.layer.strokes.splice(c.index,1,...c.newStrokes); }
    inkAreaSwap(h.changes,true);
  }else if(h.t==='boxxf'){
    boxXfApply(h.b,h.to);
  }else if(h.t==='clr'){
    for(const s of h.snapshot){ s.layer.strokes=s.cur||[]; repaintLayer(s.layer); }
  }
  pgtDirty(pg);
};
$('clr').onclick=()=>{

function eraserPolys(pts,r,x0,y0,x1,y1){ // eraser path -> capsule polygons (circle per point + rectangle per segment) that can reach the box
  const out=[], N=20, P=[];
  for(let k=0;k<pts.length;k++){ const q=pts[k]; if(!P.length||k===pts.length-1||dist(q,P[P.length-1])>=r*0.5) P.push(q); } // thin dense points (speed)

    const b=P[k];
    if(hit(b.x,b.y,b.x,b.y)){ const ring=[]; for(let j=0;j<N;j++){ const t=j/N*2*Math.PI; ring.push([b.x+r*Math.cos(t),b.y+r*Math.sin(t)]); } out.push([ring]); }

      const a=P[k-1], dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
      if(L>1e-6&&hit(a.x,a.y,b.x,b.y)){ const nx=-dy/L*r, ny=dx/L*r; out.push([[[a.x+nx,a.y+ny],[b.x+nx,b.y+ny],[b.x-nx,b.y-ny],[a.x-nx,a.y-ny]]]); }

}
/* Area-erase a shape stroke. Fill: polygon-clipping difference (eraser capsules cut out of the fill polygon).
   Border: outline sampled every ~1.5px, points under the eraser dropped, the rest kept as open runs.
   A shape that still has fill becomes ONE 'fillpoly' stroke (fill rings + border runs, so the fill can still be masked out from under the border);
   a shape with no fill left becomes open 'polyline' strokes. Returns null if untouched, else the replacement strokes. */
function eraseShape(sd,nearPath,pathPts,radius){
  const fp=sd.shape==='fillpoly', mj=fp?(sd.mj?1:0):(SHP_MITER[sd.shape]?1:0);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,p:1});
  const toRun=(P,cl)=>cl?[mid(P[0],P[1]),...P.slice(1),P[0],mid(P[0],P[1])]:P; // closed outline -> run that starts/ends mid-edge (no corner at the seam)
  let rings=null, brd=null; // rings: fill rings [[x,y]..]; brd: border polylines [{P,closed}]
  if(fp){
    rings=[]; const runs=[];
    for(const q of sd.pts){
      if(q.p===2) rings.push([[q.x,q.y]]);
      else if(q.p===1){ if(rings.length) rings[rings.length-1].push([q.x,q.y]); }
      else if(q.p===3) runs.push([{x:q.x,y:q.y,p:1}]);
      else if(runs.length) runs[runs.length-1].push({x:q.x,y:q.y,p:1});
    }
    if(!sd.nb) brd=runs.map(P=>({P,closed:false}));
  }else{
    const V=shapeVerts(sd); if(V.length<2) return null;
    const cl=!SHP_OPEN[sd.shape];
    if(sd.fill&&cl&&V.length>2) rings=[V.map(q=>[q.x,q.y])];
    if(!sd.nb) brd=[{P:V,closed:cl}];
  }
  let fillRes=null; // null = fill untouched; array of rings (maybe empty) = fill changed
  if(rings&&rings.length&&rings[0].length>2){
    try{
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const r of rings) for(const q of r){ x0=Math.min(x0,q[0]); y0=Math.min(y0,q[1]); x1=Math.max(x1,q[0]); y1=Math.max(y1,q[1]); }
      const cut=eraserPolys(pathPts,radius,x0,y0,x1,y1);
      if(cut.length){
        const ar=r=>{ let a=0; for(let k=0;k<r.length;k++){ const p=r[k], q=r[(k+1)%r.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; };
        const area=mp=>mp.reduce((s,poly)=>s+poly.reduce((t,r,ri)=>t+(ri?-ar(r):ar(r)),0),0);
        const subject=rings.length===1?[rings]:polygonClipping.xor(...rings.map(r=>[r])); // evenodd rings -> proper outer/hole nesting
        const res=polygonClipping.difference(subject,...cut);
        if(Math.abs(area(subject)-area(res))>0.01){ fillRes=[]; for(const poly of res) for(const r of poly) fillRes.push(r.slice(0,-1)); }

  }

  if(brd){
    const out=[]; let touched=false;

      if(P.length<2) continue;
      const D=[], n=cl?P.length:P.length-1;
      for(let k=0;k<n;k++){ const a=P[k], b=P[(k+1)%P.length], m=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/1.5));
        for(let s=0;s<m;s++) D.push({x:a.x+(b.x-a.x)*s/m,y:a.y+(b.y-a.y)*s/m,p:1}); }
      if(!cl) D.push({x:P[P.length-1].x,y:P[P.length-1].y,p:1});
      let keep=D.map(q=>!nearPath(q)), E=D;
      if(keep.every(Boolean)){ out.push(toRun(P,cl)); continue; }
      touched=true;
      if(cl){ const f=keep.indexOf(false); E=D.slice(f).concat(D.slice(0,f)); keep=keep.slice(f).concat(keep.slice(0,f)); } // start on an erased point so runs never wrap
      let run=[];
      const flush=()=>{ if(run.length>=2){ const V2=shapeVerts({pts:run,shape:'polyline'}); if(V2.length>=2) out.push(V2); } run=[]; };
      for(let k=0;k<E.length;k++){ if(keep[k]) run.push(E[k]); else flush(); }
      flush();
    }
    if(touched) runsOut=out;
  }
  if(!fillRes&&!runsOut) return null;
  const fillRings=fillRes||rings, bruns=brd?(runsOut||brd.map(b=>toRun(b.P,b.closed))):[];
  const base={color:sd.color,maxW:sd.maxW,minW:sd.minW,op:sd.op,mj};
  if(!fillRings||!fillRings.length) // no fill left: just the border runs as open strokes
    return bruns.map(P=>({...base,shape:'polyline',fill:null,nb:false,pts:P.map(q=>({x:q.x,y:q.y,p:1}))}));
  const P=[];
  fillRings.forEach(r=>r.forEach((q,k)=>P.push({x:q[0],y:q[1],p:k?1:2})));
  bruns.forEach(run=>run.forEach((q,k)=>P.push({x:q.x,y:q.y,p:k?4:3})));
  return [{...base,shape:'fillpoly',fillOp:sd.fillOp,fill:sd.fill,nb:!bruns.length,pts:P}];
}
function applyAreaErase(pathPts,radius){
  const changes=[];
  const nearPath=pt=>{
    for(let k=0;k<pathPts.length;k++){
      if(k===0){ if(dist(pt,pathPts[0])<=radius) return true; continue; }
      const a=pathPts[k-1],b=pathPts[k],dx=b.x-a.x,dy=b.y-a.y;
      const t=dx||dy?Math.max(0,Math.min(1,((pt.x-a.x)*dx+(pt.y-a.y)*dy)/(dx*dx+dy*dy))):0;
      if(dist(pt,{x:a.x+t*dx,y:a.y+t*dy})<=radius) return true;
    }
    return false;
  };
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i], r=radius+sd.maxW/2;
      if(sd.shape){ // shapes: cut fill as a polygon, split the border (see eraseShape)
        if(!eraseShapesOn) continue; // Erase shapes off: shapes are protected
        const ns=eraseShape(sd,nearPath,pathPts,radius);
        if(ns){ changes.push({layer,index:i,oldSd:sd,newStrokes:ns}); layer.strokes.splice(i,1,...ns); }
        continue;
      }
      if(sd.arrow){ // arrowhead: any contact removes the whole head instead of cutting into its area
        if(arrowSamples(sd).some(nearPath)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); }
        continue;
      }
      const keep=sd.pts.map(pt=>!nearPath(pt));
      if(keep.every(Boolean)) continue;
      if(keep.every(v=>!v)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); continue; }
      const newStrokes=[]; let run=[];
      for(let k=0;k<sd.pts.length;k++){
        if(keep[k]) run.push(sd.pts[k]);
        else{ if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,ink:sd.ink,pts:run}); run=[]; }
      }
      if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,ink:sd.ink,pts:run});
      changes.push({layer,index:i,oldSd:sd,newStrokes});
      layer.strokes.splice(i,1,...newStrokes);
    }
  }
  if(changes.length){
    gp.history.push({t:'areaErase',changes});
    inkAreaSwap(changes,true);
  }
  clearLive();
}

function renderMarkdownWithMath(md){
  const math=[];
  const stash=(expr,display)=>{const i=math.length;math.push({expr,display});return '\u0000MATH'+i+'\u0000';};
  let text=md.replace(/\$\$([\s\S]+?)\$\$/g,(m,e)=>'\n\n'+stash(e.trim(),true)+'\n\n');
  text=text.replace(/\$([^\$\n]+?)\$/g,(m,e)=>stash(e.trim(),false));
  let html=marked.parse(text);
  html=html.replace(/\u0000MATH(\d+)\u0000/g,(m,i)=>{
    const b=math[+i];
    try{ return katex.renderToString(b.expr,{throwOnError:false,displayMode:b.display}); }
    catch(_){ return (b.display?'$$':'$')+b.expr+(b.display?'$$':'$'); }
  });
  return html;
}
function fillRendered(rd,md){

  const copied=new Array(jobs.length), info=new Array(jobs.length);
  for(const [d,idxs] of bySrc){
    for(const i of idxs){ const sp=d.getPage(jobs[i].n); info[i]={mb:sp.getMediaBox(),cb:sp.getCropBox(),rot:sp.getRotation().angle}; }
    const cp=await out.copyPages(d,idxs.map(i=>jobs[i].n));
    idxs.forEach((i,k)=>copied[i]=cp[k]);
  }
  for(let i=0;i<jobs.length;i++){
    const e=ovEmb[i], ow=e.width, oh=e.height;
    if(!jobs[i]){ const p=out.addPage([ow,oh]); p.drawPage(e,{x:0,y:0,width:ow,height:oh}); continue; }
    const p=copied[i], {mb,cb}=info[i], r=((Math.round(info[i].rot/90)*90)%360+360)%360;
    p.setMediaBox(mb.x,mb.y,mb.width,mb.height); p.setCropBox(cb.x,cb.y,cb.width,cb.height); p.setRotation(degrees(r));
    out.addPage(p);
    const cx=cb.x, cy=cb.y, cw=cb.width, ch=cb.height; let m;
    if(r===0)        m=[cw/ow,0,0,ch/oh,cx,cy];
    else if(r===90)  m=[0,ch/ow,-cw/oh,0,cx+cw,cy];
    else if(r===180) m=[-cw/ow,0,0,-ch/oh,cx+cw,cy+ch];
    else             m=[0,-ch/ow,cw/oh,0,cx,cy+ch];
    const key=PDFName.of('InkOverlay'+i);
    p.node.setXObject(key,e.ref);
    p.pushOperators(pushGraphicsState(),concatTransformationMatrix(m[0],m[1],m[2],m[3],m[4],m[5]),drawObject(key),popGraphicsState());

}
// Renders an imported PDF page to a JPEG data URL for the export (null for blank pages).
async function exportBaseUrl(pg){

    const bs=Math.min(2,BASE_MAXDIM/Math.max(pg.w,pg.h),Math.sqrt(BASE_MAXPX/(pg.w*pg.h)));

   13. PDF IMPORT — sizes (7b) + base picture (7c)
   7b: read every page's size, replace all pages with blank placeholders.
   7c: keep the pdf.js document open; draw pages near the viewport into a
       canvas that sits FIRST in each page's stage (under ink and boxes), and
       free the canvas again when the page scrolls far away.

const PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

// Loaded once, on first click. Worker script is loaded as a plain <script> so pdf.js runs it on the

// Opens the PDF and reads every page's size. The document stays OPEN and is returned for 7c rendering;
// the caller owns it (must destroy it if the import doesn't go through).
async function readPdfSizes(file){
  const lib=await loadPdfJs();

  const doc=await lib.getDocument({data}).promise;

/* -- 7c: base picture ------------------------------------------------------
   A page is "wanted" while it is within about one screen of the visible area (IntersectionObserver
   with a 100% margin above and below). Wanted pages are drawn one at a time, nearest to the middle
   of the screen first. When a page leaves the margin its canvas is released (size set to 0 so the
   browser frees the bitmap) and any render still in progress is cancelled.
   Resolution: canvas pixels = page size × screen density (max 3×), reduced when needed so no canvas
   exceeds BASE_MAXDIM on a side or BASE_MAXPX in total (big posters render softer instead of failing). */
/* v90c: smooth-scroll rendering. Nothing is drawn while the view is moving (scroll, momentum, pinch, zoom,
   pen). ~120 ms after it stops, a WINDOW is computed: visible pages + 1 before + 1 after are rendered
   (visible/nearest first, one at a time, cancelled the moment motion resumes). Canvases are kept for the window
   +1 more page each side (hysteresis, so scrolling back and forth doesn't thrash) and freed beyond that. A freed
   page leaves a small blurry thumbnail behind (LRU); a never-seen page is plain white until it renders.
   Resolution follows zoom (zoom x screen density, max 3x, <= BASE_MAXPX); re-rendered only when it gets coarse. */
const BASE_MAXDIM=8192, BASE_MAXPX=8e6, BASE_SETTLE=120, THUMB_SCALE=0.25, THUMB_MAX=80;

let basePumping=false, baseTimer=0, lastMove=0, curBase=null;

function baseIdle(){ return performance.now()-lastMove>=BASE_SETTLE&&!momRaf&&!pinchRaf&&!penDown&&activeId===null; }
function cancelInflight(){
  const pg=curBase; if(!pg) return;
  pg.baseGen++; if(pg.baseTask){ try{ pg.baseTask.cancel(); }catch(_){} pg.baseTask=null; }
  curBase=null;
}
let wheelEl=null, lastWheel=0;
function updateWheel(){ // one RGB wheel, centred in the visible part of the viewer, shown while a visible page is still blank
  lastWheel=performance.now();
  const wr=wrap.getBoundingClientRect(); let blank=false;
  for(const pg of pages){
    if(pg.dead) continue;
    if(!(pg.pend)&&(!pg.src||pg.baseEl||pg.thumbEl||pg.baseFail)) continue; // s6k: a visible not-yet-loaded project page also counts as blank
    const r=pg.el.getBoundingClientRect();
    if(r.bottom>wr.top&&r.top<wr.bottom&&r.right>wr.left&&r.left<wr.right){ blank=true; break; }
  }
  if(!blank){ if(wheelEl) wheelEl.style.display='none'; return; }
  if(!wheelEl){ wheelEl=document.createElement('div'); wheelEl.id='rgbWheel'; document.body.appendChild(wheelEl); }
  const t=Math.max(wr.top,0), b=Math.min(wr.bottom,innerHeight), l=Math.max(wr.left,0), rt=Math.min(wr.right,innerWidth);
  wheelEl.style.left=((l+rt)/2)+'px'; wheelEl.style.top=((t+b)/2)+'px'; wheelEl.style.display='block';
}
function noteMotion(){ // called on every scroll / zoom event
  lastMove=performance.now(); cancelInflight();
  if(wheelEl&&wheelEl.style.display!=='none') wheelEl.style.display='none'; // s6k: wheel only appears after motion stops
  clearTimeout(baseTimer); baseTimer=setTimeout(tickBase,BASE_SETTLE+10);
}
window.__nm=noteMotion;
wrap.addEventListener('scroll',noteMotion,{passive:true});
function wantScale(pg){
  const bs=Math.min(Math.max(zoom*dpr,0.75),3);
  return Math.min(bs,BASE_MAXDIM/Math.max(pg.w,pg.h),Math.sqrt(BASE_MAXPX/(pg.w*pg.h)));
}
function needsBase(pg){ return !pg.baseFail&&!pg.dead&&(!pg.baseEl||pg.baseScale<wantScale(pg)*0.7); }
function tickBase(){

  updateBaseWindow(); updateWheel(); pumpBase(); pumpProj();

function updateBaseWindow(){
  const n=pages.length; if(!n) return;

  for(let i=0;i<n;i++){
    const r=pages[i].el.getBoundingClientRect();

    const d=Math.abs((r.top+r.bottom)/2-mid); if(d<nd){ nd=d; near=i; }
  }
  if(f<0) f=l=near;

  for(let i=Math.max(0,f-1);i<=Math.min(n-1,l+1);i++) if(pages[i].src) baseWanted.add(pages[i]);
  const k0=Math.max(0,f-2), k1=Math.min(n-1,l+2);

function freeBase(pg){

  if(pg.baseEl){
    pg.baseEl.width=pg.baseEl.height=0; pg.baseEl.remove(); pg.baseEl=null;

function freeThumb(pg){ if(pg.thumbEl){ pg.thumbEl.width=pg.thumbEl.height=0; pg.thumbEl.remove(); pg.thumbEl=null; } }
async function pumpBase(){
  if(basePumping) return;
  basePumping=true;

    for(;;){
      if(!baseIdle()) break;
      const wr=wrap.getBoundingClientRect(), mid=wr.top+wr.height/2;
      let best=null, bd=Infinity;
      for(const pg of baseWanted){
        if(!needsBase(pg)) continue;

}
async function renderBase(pg){
  const gen=++pg.baseGen, s=pg.src; curBase=pg;

    const c=document.createElement('canvas'); c.className='base';
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    const task=page.render({canvasContext:c.getContext('2d'),viewport:vp,background:'#ffffff',annotationMode:0});
    pg.baseTask=task;
    await task.promise;
    if(stale()){ c.width=c.height=0; return; }
    const old=pg.baseEl;
    if(old){ old.replaceWith(c); old.width=old.height=0; }                        // sharper re-render: swap, no flash
    else pg.stage.insertBefore(c,pg.thumbEl?pg.thumbEl.nextSibling:pg.stage.firstChild); // above thumb, under ink and boxes

    if(pg.dead||(e&&e.name==='RenderingCancelledException')) return;

/* ---------------------------------------------------------------
   14. PROJECT SAVE / OPEN (.inkdown = zip)
   manifest.json            version, name, zoom, active page, pdf ref, pages:[{w,h,pdfPage,data}]
   pages/pNNN.json          that page's items in z-order: ink / text / image
   images/pN_K.<ext>        original image of each image box (crop stored in JSON)
   pdf/source.pdf           the imported PDF (if any)
   Open creates every page placeholder at once but only loads the active page +/- PROJ_WIN pages;
   the rest load as they scroll near. Loaded pages stay loaded (undo history / edits are kept).
   --------------------------------------------------------------- */
const PROJ_WIN=3;
let projZip=null, projName=null, projKey=null, projBusy=false;
const projHyd=new Set();
const MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'};
const EXT_BY_MIME={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'};
const r2=v=>Math.round(v*100)/100, r4=v=>Math.round(v*10000)/10000;
function setProjBtns(b){ $('saveProj').disabled=b; $('openProj').disabled=b; }

function cropUrl(orig,c){

/* ---- load (lazy per page) ---- */
async function buildPageItems(pg,data,zip){

  for(const it of (data.items||[])){

      layer.strokes=it.strokes.map(s=>{
        const {pts,...rest}=s, P=[];

        return {...rest,pts:P};

    }else if(it.t==='image'){
      const orig=await zipDataUrl(zip,it.file);
      const disp=it.crop?await cropUrl(orig,it.crop):orig;
      if(pg.dead) return;
      createImageBox(disp,it.ow,it.oh,{pg,props:{rot:it.rot||0,xPct:it.x,yPct:it.y,wPct:it.w,hPct:it.h,keepRatio:it.kr!==false,
        orig,origW:it.ow,origH:it.oh,crop:it.crop||null,origImg:Object.assign(new Image(),{src:orig}),

async function hydratePage(pg){

/* s6k: lazy project pages are only QUEUED while the view moves. About 120 ms after motion stops (same gate as the PDF

      if(!baseIdle()) break;
      const wr=wrap.getBoundingClientRect(), mid=wr.top+wr.height/2; let best=null, bd=Infinity;
      for(const pg of Array.from(projQ)){

      let k=0, data;
      const putImg=(mime,b64)=>{ const f='images/p'+(i+1)+'_'+(++k)+'.'+(EXT_BY_MIME[mime]||'png'); zip.file(f,b64,{base64:true,compression:'STORE'}); return f; };
      if(pg.pend){ // never loaded: copy from the opened zip (images renamed to this page's slot)
        data=JSON.parse(await pg.pend.zip.file(pg.pend.path).async('string'));
        for(const it of data.items||[]) if(it.t==='image'){
          const ext=(it.file.split('.').pop()||'png').toLowerCase();
          it.file=putImg(MIME_BY_EXT[ext]||'image/png',await pg.pend.zip.file(it.file).async('base64'));
        }

          const layer=elLayerMap.get(el);

            if(!layer.strokes.length) continue;
            items.push({t:'ink',strokes:layer.strokes.map(sd=>{

              for(const q of pts) flat.push(r2(q.x),r2(q.y),Math.round(q.p*1000)/1000);

          }else{
            items.push({t:'text',x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),rot:b.rot||0,
              ...engOf(b).serialize(b)});
          }
        }
        data={items,bg:pg.bg,bgc:pg.bgc,bgo:pg.bgo};
      }
      zip.file(pn,JSON.stringify(data));

    $('st').textContent='Compressing…';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6},mimeType:'application/octet-stream'});
    const a=document.createElement('a'), u=URL.createObjectURL(blob);
    a.href=u; a.download=name+'.inkdown'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),10000);
    $('st').textContent='Saved '+name+'.inkdown ('+(blob.size/1048576).toFixed(2)+' MB)';
  }catch(err){
    console.error(err); $('st').textContent='Save failed: '+(err&&err.message||err);
  }finally{ projBusy=false; setProjBtns(false); }
}

const AS_DB='inkdown-notes', AS_STROKES=30;

      const mk=(n,o)=>d.objectStoreNames.contains(n)?t.objectStore(n):d.createObjectStore(n,o);
      const ix=(s,n,k)=>{ if(!s.indexNames.contains(n)) s.createIndex(n,k); };
      mk('notebooks',{keyPath:'id'});

function asTx(names,mode,fn){

// Replace the old records of this section (pages or assets) by new ones, atomically inside one transaction.
function asSwap(store,del,recs){

function asZipFor(sec){
  const man={app:'inkdown',version:1,name:sec.name,zoom:sec.zoom,active:sec.active,
    pdf:sec.pdf?{file:'pdf/source.pdf',name:sec.pdf.name}:null,
    pages:sec.pages.map(p=>({w:p.w,h:p.h,pdfPage:p.pdfPage,data:'page:'+p.id}))};

    if(name==='pdf/source.pdf'&&!sec.pdf) return null;

async function asFlush(){

  if(cur||penDown||projBusy||importing||exporting){ asSchedule(800); return; }   // never while writing a stroke
  if(!asDirty.size&&!asReset&&!pages.some(p=>!p.id)) return;
  asBusy=true;
  const ep=asEpoch, reset=asReset; asReset=false;
  for(const pg of pages) if(!pg.id){ pg.id=asUid(); asDirty.add(pg); }
  const list=[...asDirty].filter(p=>pages.includes(p)); asDirty.clear();
  const assets=[], fresh=[], recs=[];

    for(const pg of list){

      if(ep!==asEpoch) return;                         // document was replaced meanwhile
      if(r) recs.push(r);

    if(asPdf&&!pdfId){ pdfId=asUid(); assets.push({id:pdfId,sectionId:AS_SEC,kind:'pdf',name:asPdf.file.name,blob:asPdf.file}); }
    const sec={id:AS_SEC,notebookId:AS_NB,name:asName||(asPdf?asPdf.file.name.replace(/\.pdf$/i,''):'Section 1'),order:0,
      pages:pages.map(p=>({id:p.id,w:p.w,h:p.h,pdfPage:p.src?p.src.pageNum:0})),
      pdf:asPdf?{id:pdfId,name:asPdf.file.name}:null,

      asSwap(pgS,reset,recs.map(({_pg,...r})=>({...r,sectionId:AS_SEC})));

          size:Object.values(pgSize).reduce((a,b)=>a+b,0)+assetBytes});

window.addEventListener('popstate',()=>{ if($('home').hidden) showLib(); });
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb=n=>(n/1048576).toFixed(n<1048576*10?1:0)+' MB';
const nbSecs=async nb=>((await asTx(['sections'],'readonly',s=>s.index('nb').getAll(nb)))||[]).sort((a,b)=>(a.order||0)-(b.order||0));
const asSecPatch=(id,p)=>asTx(['sections'],'readwrite',s=>{ const g=s.get(id); g.onsuccess=()=>{ if(g.result) s.put({...g.result,...p}); }; });
// make sure everything edited so far is on disk before the document is replaced
async function asSettle(){
  if(asHold||asDetached) return;
  for(let i=0;i<40;i++){
    if(asTimer){ clearTimeout(asTimer); asTimer=0; }
    await asFlushNow();
    if(!asBusy&&!asDirty.size&&!asReset&&!pages.some(p=>!p.id)) return;
    await new Promise(r=>setTimeout(r,100));
  }
}
async function asLoadSec(sec){
  asRestoring=true;
  try{ await openProjectFile({__asZip:asZipFor(sec),name:sec.name}); }finally{ asRestoring=false; }
  if(pages.length!==sec.pages.length) throw new Error('restore failed');
  pages.forEach((pg,i)=>{ pg.id=sec.pages[i].id; });
  const pf=pages.find(p=>p.src);
  asPdf=(sec.pdf&&pf)?{file:pf.src.file,id:sec.pdf.id}:null;

// switch the editor to another section (always: save first, then load)
async function asGo(nb,secId){
  if(asSwitching) return; asSwitching=true;
  try{
    await asSettle();
    asHold=true; AS_NB=nb; AS_SEC=secId; asDetached=false; asName=null; asPdf=null; asReset=false; asDirty.clear();
    const sec=await asTx(['sections'],'readonly',s=>s.get(secId));
    if(sec&&sec.pages&&sec.pages.length) await asLoadSec(sec); else replaceAllPages([{w:794,h:1123}],null,null);
    asHold=false; asSchedule(500);
    await asTx(['settings','notebooks'],'readwrite',(st,nbS)=>{
      st.put({key:'current',notebookId:nb,sectionId:secId});
      const g=nbS.get(nb); g.onsuccess=()=>{ if(g.result) nbS.put({...g.result,lastSec:secId}); };
    });
    hideLib();
  }catch(err){ console.error(err); $('st').textContent='Switch failed — autosave paused, saved data kept. Reload to retry.'; }
  finally{ asSwitching=false; asTabs(); }
}
async function asAddSec(name){
  await asSettle();

  await asTx(['sections'],'readwrite',s=>s.put({id,notebookId:AS_NB,name:name||'Section '+(n+1),order:n?(list[n-1].order||0)+1:0,
    color:NB_PAL[n%NB_PAL.length],created:now,updated:now,pageCount:0,size:0,pages:[],pdf:null,hasContent:false}));
  await asGo(AS_NB,id);
}
async function asNewNb(name){
  await asSettle();
  const id='n'+asUid(), sid='s'+asUid(), now=Date.now();
  const cnt=(await asTx(['notebooks'],'readonly',s=>s.count()))||0;
  await asTx(['notebooks','sections'],'readwrite',(nb,sc)=>{
    nb.put({id,name:name||'Notebook '+(cnt+1),created:now,color:NB_PAL[cnt%NB_PAL.length],updated:now,lastSec:sid});
    sc.put({id:sid,notebookId:id,name:'Section 1',order:0,color:NB_PAL[0],created:now,updated:now,pageCount:0,size:0,pages:[],pdf:null,hasContent:false});

function asWipe(ids,nbId){
  return asTx(['sections','pages','assets','notebooks','settings'],'readwrite',(sc,pg,as,nb,st)=>{
    for(const id of ids){ sc.delete(id); for(const s of [pg,as]){ const q=s.index('sec').getAllKeys(id); q.onsuccess=()=>q.result.forEach(k=>s.delete(k)); } }
    if(nbId){ nb.delete(nbId); if(nbId===AS_NB) st.delete('current'); }
  });
}

// ---- in-page dialogs (native confirm()/prompt() are blocked in sandboxed pages) ----
function asDlg(html,btns,input){
  return new Promise(res=>{
    const d=document.createElement('div'); d.id='dlg';
    d.innerHTML='<div class="box" style="width:min(340px,86vw)">'+html+(input!=null?'<input id="dlgIn" type="text" style="width:100%;box-sizing:border-box;margin-top:10px;padding:8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)">':'')+
      '<div class="row">'+btns.map(b=>'<button data-b="'+b.id+'"'+(b.on?' class="on"':'')+(b.red?' style="background:#dc2626;color:#fff;border-color:#dc2626"':'')+'>'+b.label+'</button>').join('')+'</div></div>';
    const inp=d.querySelector('#dlgIn'); if(inp) inp.value=input;
    const done=id=>{ const v=inp?inp.value:''; d.remove(); res({id,value:v}); };
    d.addEventListener('click',e=>{ const b=e.target.closest('[data-b]'); if(b) done(b.dataset.b); else if(e.target===d) done('cancel'); });
    if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') done('ok'); else if(e.key==='Escape') done('cancel'); });
    document.body.appendChild(d); if(inp){ inp.focus(); inp.select(); }
  });
}
async function asAskText(title,val){ const r=await asDlg('<div>'+esc(title)+'</div>',[{id:'cancel',label:'Cancel'},{id:'ok',label:'OK',on:1}],val); return r.id==='ok'?r.value.trim():null; }
function asBackupLine(nb,size){
  if(!size) return 'Nothing saved in it yet.';
  if(!nb||!nb.lastBackup) return '<b style="color:#dc2626">Never backed up.</b>';
  const d=new Date(nb.lastBackup).toLocaleString();
  return nb.lastBackup<(nb.updated||0)?'<b style="color:#d97706">Last backup '+d+' — newer changes are not in it.</b>':'Backed up '+d+'.';
}
async function asDelSec(id){
  const sec0=await asTx(['sections'],'readonly',s=>s.get(id)), nb0=await asTx(['notebooks'],'readonly',s=>s.get(AS_NB));
  const r0=await asDlg('<b>Delete section “'+esc(sec0?sec0.name:'')+'”?</b><div style="margin-top:6px">'+(sec0&&sec0.pageCount||0)+' page(s) · '+mb(sec0&&sec0.size||0)+'</div><div style="margin-top:6px">Notebook backup: '+asBackupLine(nb0,sec0&&sec0.size)+'</div><div style="margin-top:6px">This cannot be undone.</div>',
    [{id:'cancel',label:'Cancel'},...(sec0&&sec0.size?[{id:'exp',label:'Export notebook first'}]:[]),{id:'del',label:'Delete',red:1}]);
  if(r0.id==='exp'){ await asExportNb(AS_NB); return asDelSec(id); }
  if(r0.id!=='del') return;
  await asSettle();
  const list=await nbSecs(AS_NB), i=list.findIndex(s=>s.id===id), isCur=id===AS_SEC;
  if(isCur) asDetached=true;
  await asWipe([id]);
  if(!isCur){ asTabs(); return; }
  const nx=list[i+1]||list[i-1];
  if(nx) await asGo(AS_NB,nx.id); else await asAddSec('Section 1');
}
async function asDelNb(id){
  const nb0=await asTx(['notebooks'],'readonly',s=>s.get(id)), ss0=await nbSecs(id), sz0=ss0.reduce((a,x)=>a+(x.size||0),0);
  const r0=await asDlg('<b>Delete notebook “'+esc(nb0?nb0.name:'')+'”?</b><div style="margin-top:6px">'+ss0.length+' section'+(ss0.length===1?'':'s')+' · '+mb(sz0)+'</div><div style="margin-top:6px">'+asBackupLine(nb0,sz0)+'</div><div style="margin-top:6px">This cannot be undone.</div>',
    [{id:'cancel',label:'Cancel'},...(sz0?[{id:'exp',label:'Export first'}]:[]),{id:'del',label:'Delete',red:1}]);
  if(r0.id==='exp'){ await asExportNb(id); return asDelNb(id); }
  if(r0.id!=='del') return;
  if(id===AS_NB){ await asSettle(); asDetached=true; }
  await asWipe((await nbSecs(id)).map(s=>s.id),id);

}
async function asMove(id,d){
  const ids=(await nbSecs(AS_NB)).map(s=>s.id), i=ids.indexOf(id), j=i+d;
  if(i<0||j<0||j>=ids.length) return;

  await asTx(['sections'],'readwrite',s=>{ ids.forEach((x,k)=>{ const g=s.get(x); g.onsuccess=()=>{ s.put({...g.result,order:k}); }; }); });
}
// Open a .inkdown or PDF: it becomes its own section (an untouched blank section is reused)
async function asPrep(name){

  else await asAddSec(name);

async function asOpenAny(f){

  if(isNb){ $('home').hidden=true; return asImportNbZip(f); }

}
async function asTabs(){

function asTabMenu(id,x,y){

// ---- V88: storage limit, warnings, persistent storage ----
const CAPS=[250,500,1024,2048,5120].map(m=>m*1048576), CAP_DEFAULT=1024*1048576;
var asLvl=0, asChkAt=0;
async function asStorageInfo(){
  const set=(await asTx(['settings'],'readonly',s=>s.get('storage')))||{key:'storage'};
  const cap=set.cap||CAP_DEFAULT;
  const secs=(await asTx(['sections'],'readonly',s=>s.getAll()))||[];
  const used=secs.reduce((a,x)=>a+(x.size||0),0);
  let est=null, persisted=false;
  try{ est=await navigator.storage.estimate(); }catch(_){}
  try{ persisted=await navigator.storage.persisted(); }catch(_){}
  return {set,cap,used,pct:used/cap*100,quota:est?est.quota:0,usage:est?est.usage:0,persisted};
}
async function asPersist(){
  let ok=false;
  try{ if(navigator.storage&&navigator.storage.persist) ok=(await navigator.storage.persisted())||(await navigator.storage.persist()); }catch(_){}
  const set=(await asTx(['settings'],'readonly',s=>s.get('storage')))||{key:'storage'};
  await asTx(['settings'],'readwrite',s=>s.put({...set,key:'storage',persistAsked:true}));
  return ok;
}
const ST_MSG=['','Your notebooks are using over 80% of the space you chose. Open the bell in the Library for details.','Space is almost full. Back up and delete old notebooks, or choose more space (bell in the Library).','You reached the space you chose. Your work is still being saved — back up and free some space.'];
async function asAfterFlush(){   // after a successful save: ask the browser for persistent storage once, and warn about the limit
  try{
    const now=Date.now(); if(now-asChkAt<30000) return; asChkAt=now;
    const si=await asStorageInfo();
    if(!si.set.persistAsked) asPersist();
    const lvl=si.pct>=100?3:si.pct>=95?2:si.pct>=80?1:0;
    if(lvl>asLvl||lvl===3) $('st').textContent=ST_MSG[lvl];
    asLvl=lvl;
  }catch(_){}
}

// ---- V88: backup. A stored section -> .inkdown (same layout as Save project); a notebook -> one ZIP of its sections ----
const safeName=t=>String(t).replace(/[\\/:*?"<>|]+/g,'_').trim()||'notes';
function dlBlob(blob,name){ const a=document.createElement('a'), u=URL.createObjectURL(blob); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),10000); }
async function asSectionZip(sec){
  const zip=new JSZip(), man={app:'inkdown',version:1,name:safeName(sec.name),zoom:sec.zoom,active:sec.active,pdf:null,pages:[]};
  if(sec.pdf){ const a=await asTx(['assets'],'readonly',s=>s.get(sec.pdf.id)); if(a){ zip.file('pdf/source.pdf',a.blob,{compression:'STORE'}); man.pdf={file:'pdf/source.pdf',name:sec.pdf.name}; } }
  for(let i=0;i<sec.pages.length;i++){
    const p=sec.pages[i], r=await asTx(['pages'],'readonly',s=>s.get(p.id)); if(!r) throw new Error('Missing page in "'+sec.name+'"');
    const data=JSON.parse(r.json); let k=0;
    for(const it of data.items||[]) if(it.t==='image'){
      const ext=it.file.split('.').pop(), a=await asTx(['assets'],'readonly',s=>s.get(it.file.split('.')[0])); if(!a) throw new Error('Missing image in "'+sec.name+'"');
      const f='images/p'+(i+1)+'_'+(++k)+'.'+ext; zip.file(f,a.blob,{compression:'STORE'}); it.file=f;
    }
    const pn='pages/p'+String(i+1).padStart(3,'0')+'.json'; zip.file(pn,JSON.stringify(data));
    man.pages.push({w:p.w,h:p.h,pdfPage:p.pdfPage,data:pn});
  }
  zip.file('manifest.json',JSON.stringify(man)); return zip;
}
var asExporting=false;
async function asExportNb(id,cloud){
  if(asExporting) return;
  if(!window.JSZip){ $('st').textContent='Export failed: ZIP library not loaded (check internet).'; return; }
  asExporting=true;
  try{
    if(cloud){ await clCfg(); if(clActive()==='gd') await gdToken(); }   // sign-in popup must start straight from the click
    await asSettle();
    const nb=await asTx(['notebooks'],'readonly',s=>s.get(id)), list=await nbSecs(id), out=new JSZip(), meta=[];
    for(let i=0;i<list.length;i++){
      $('st').textContent='Exporting '+nb.name+' — section '+(i+1)+' / '+list.length+'…';
      const sec=await asTx(['sections'],'readonly',s=>s.get(list[i].id)); if(!sec||!sec.pages||!sec.pages.length) continue;
      const fn=String(meta.length+1).padStart(2,'0')+' '+safeName(sec.name)+'.inkdown';
      out.file(fn,await (await asSectionZip(sec)).generateAsync({type:'uint8array',compression:'DEFLATE',compressionOptions:{level:6}}),{compression:'STORE'});
      meta.push({file:fn,name:sec.name,color:sec.color});
    }
    if(!meta.length){ $('st').textContent='Nothing to export yet — this notebook has no saved pages.'; return; }
    out.file('notebook.json',JSON.stringify({app:'inkdown-notebook',version:1,name:nb.name,color:nb.color,sections:meta}));
    $('st').textContent='Compressing…';
    const blob=await out.generateAsync({type:'blob',compression:'STORE',mimeType:'application/octet-stream'});
    if(cloud) await clPutNb(id,nb,blob); else dlBlob(blob,safeName(nb.name)+'.inkdown');
    await asTx(['notebooks'],'readwrite',s=>{ const g=s.get(id); g.onsuccess=()=>{ s.put({...g.result,lastBackup:Date.now()}); }; });
    $('st').textContent=(cloud?'Uploaded to cloud: ':'Backup saved: ')+safeName(nb.name)+(cloud?' (':'.inkdown (')+mb(blob.size)+')';
  }catch(err){ console.error(err); $('st').textContent=(cloud?'Upload failed: ':'Export failed: ')+(cloud?clErrText(err):(err&&err.message||err)); }
  finally{ asExporting=false; if(!$('home').hidden) homeRender(); }
}
// restore a notebook ZIP made above: new notebook, one section per .inkdown
async function asImportNbZip(f){
  if(!window.JSZip){ $('st').textContent='Import failed: ZIP library not loaded (check internet).'; return; }
  try{
    const zip=await JSZip.loadAsync(f), mj=zip.file('notebook.json');
    if(!mj) throw new Error('not a notebook backup (notebook.json missing).');
    const m=JSON.parse(await mj.async('string'));
    await asNewNb(m.name||f.name.replace(/\.(zip|inkdown)$/i,''));
    let first=true;
    for(const e of m.sections||[]){
      const zf=zip.file(e.file); if(!zf) continue;
      $('st').textContent='Restoring '+e.name+'…';
      if(first){ await asPrep(e.name||'Section'); first=false; } else await asAddSec(e.name||'Section');   // after the first one always a fresh section, even if the previous was blank
      await openProjectFile(new File([await zf.async('uint8array')],e.file));
      await asSettle();
      if(e.color) await asSecPatch(AS_SEC,{color:e.color});
    }
    asTabSig=''; await asTabs(); $('st').textContent='Restored notebook "'+(m.name||'')+'".'; showLib();
  }catch(err){ console.error(err); $('st').textContent='Import failed: '+(err&&err.message||err); }
}

var homeOpen=new Set();   // notebooks whose section list is expanded on the Library
const LIC=(p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+v+'</svg>'])))({

  cands.push({k:'circle',err:ce/P.length/D,max:cm/D,ratio:L/(2*Math.PI*r),cx,cy,r});

  // rectangle / square
  const mr=snapMinRect(H);
  if(mr&&mr.w>5&&mr.h>5){
    const th0=Math.atan2(mr.uy,mr.ux), V=snapRectCorners(mr.cx,mr.cy,mr.w,mr.h,th0), e=snapPolyErr(P,V);
    cands.push({k:'rect',err:e.mean/D,max:e.max/D,ratio:L/snapPerim(V),mr});
  }

  // triangle
  const T=snapMaxTri(H);
  if(T){ const e=snapPolyErr(P,T); cands.push({k:'tri',err:e.mean/D,max:e.max/D,ratio:L/snapPerim(T),T}); }

  cands.sort((a,b)=>a.err-b.err);
  const c=cands[0];
  if(c.err>0.03||c.max>0.09||c.ratio<0.8||c.ratio>1.45) return null;

  // start where the user started, same direction
  let area=0; for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length]; area+=a.x*b.y-b.x*a.y; }
  if(c.k==='circle'){
    const a0=Math.atan2(A.y-c.cy,A.x-c.cx), dir=area>=0?1:-1, m=Math.max(48,Math.ceil(2*Math.PI*c.r/2.5)), out=[];
    for(let i=0;i<=m;i++){ const a=a0+dir*2*Math.PI*i/m; out.push({x:c.cx+c.r*Math.cos(a),y:c.cy+c.r*Math.sin(a),p:pAvg}); }
    return out;
  }
  let V;
  if(c.k==='rect'){
    let {w,h}=c.mr, th=Math.atan2(c.mr.uy,c.mr.ux);
    while(th>Math.PI/4){ th-=Math.PI/2; const t=w; w=h; h=t; }
    while(th<-Math.PI/4){ th+=Math.PI/2; const t=w; w=h; h=t; }
    if(Math.abs(th)<7*Math.PI/180) th=0;
    if(Math.abs(w-h)<0.12*Math.max(w,h)){ w=h=(w+h)/2; } // square
    V=snapRectCorners(c.mr.cx,c.mr.cy,w,h,th);
  }else V=c.T.map(p=>({x:p.x,y:p.y}));
  let s=0; for(let i=1;i<V.length;i++) if(dist(V[i],A)<dist(V[s],A)) s=i;
  V=V.slice(s).concat(V.slice(0,s));
  return snapDense(V,true,pAvg);
}

/* ---------------------------------------------------------------
   16. SCRIBBLE TO ERASE — a fast back-and-forth (or looping) scribble drawn over existing pen ink
   deletes every pen stroke it touches (one undo step). The scribble itself is not kept.
   If it touches nothing it stays as normal ink. Highlighter strokes are never erased this way.
   --------------------------------------------------------------- */
let scribOn=true;
try{ if(localStorage.getItem('inkdown.scrib')==='0') scribOn=false; }catch(_){}
function updScribUI(){ $('scribBtn').classList.toggle('on',scribOn); $('scribBtn').dataset.tip='Scribble to erase: '+(scribOn?'on':'off'); }
$('scribBtn').onclick=()=>{
  scribOn=!scribOn;
  try{ localStorage.setItem('inkdown.scrib',scribOn?'1':'0'); }catch(_){}
  updScribUI(); $('st').textContent='Scribble to erase '+(scribOn?'on':'off');
};
updScribUI();

// Erase shapes: when off, anything drawn with the Shapes tool (sd.shape, incl. area-erase leftovers)
// is skipped by the stroke eraser, area eraser and scribble-to-erase. Lasso still works on shapes.
let eraseShapesOn=true;
try{ if(localStorage.getItem('inkdown.eraseShapes')==='0') eraseShapesOn=false; }catch(_){}
function updEshUI(){ $('eshBtn').classList.toggle('on',eraseShapesOn); $('eshBtn').dataset.tip='Erase shapes: '+(eraseShapesOn?'on':'off'); }
$('eshBtn').onclick=()=>{
  eraseShapesOn=!eraseShapesOn;
  try{ localStorage.setItem('inkdown.eraseShapes',eraseShapesOn?'1':'0'); }catch(_){}
  updEshUI(); $('st').textContent='Erase shapes '+(eraseShapesOn?'on':'off');
};
updEshUI();

// number of direction reversals along one axis, ignoring wiggles smaller than h
function scribTurns(vals,h){
  let d=0, ex=vals[0], t=0;
  for(const v of vals){
    if(d===0){ if(Math.abs(v-ex)>=h){ d=v>ex?1:-1; ex=v; } }
    else if(d===1){ if(v>ex) ex=v; else if(ex-v>=h){ t++; d=-1; ex=v; } }
    else{ if(v<ex) ex=v; else if(v-ex>=h){ t++; d=1; ex=v; } }
  }
  return t;
}
// returns path length when the stroke looks like a scribble, else 0
function scribbleLen(raw){
  if(raw.length<12) return 0;
  let L=0, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<raw.length;i++){
    const q=raw[i]; if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y;
    if(i) L+=dist(raw[i-1],q);
  }
  const D=Math.hypot(x1-x0,y1-y0);
  if(L<120||D<40||L/D<3.5) return 0;
  const R=snapResample(raw,Math.max(24,Math.round(L/4)),false); if(!R) return 0;
  // zigzag: >=4 reversals along x, y or either diagonal
  let best=0;
  for(const [ax,ay] of [[1,0],[0,1],[0.7071,0.7071],[0.7071,-0.7071]]){
    const v=R.map(p=>p.x*ax+p.y*ay), ext=Math.max(...v)-Math.min(...v);
    best=Math.max(best,scribTurns(v,Math.max(12,0.5*ext)));
  }
  if(best>=5) return L;
  // looping scribble: three or more full turns packed into a small area
  let turn=0;
  for(let i=1;i<R.length-1;i++){
    const ax=R[i].x-R[i-1].x, ay=R[i].y-R[i-1].y, bx=R[i+1].x-R[i].x, by=R[i+1].y-R[i].y, la=Math.hypot(ax,ay), lb=Math.hypot(bx,by);
    if(la<1e-6||lb<1e-6) continue;
    turn+=Math.acos(Math.max(-1,Math.min(1,(ax*bx+ay*by)/(la*lb))));
  }
  return (turn>=7*Math.PI&&L/D>=5)?L:0;
}
function scribbleErase(raw){
  if(!gp) return false;
  const L=scribbleLen(raw); if(!L) return false;
  const S=snapResample(raw,Math.max(24,Math.ceil(L/3)),false); if(!S) return false;
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  for(const q of S){ if(q.x<bx0)bx0=q.x; if(q.x>bx1)bx1=q.x; if(q.y<by0)by0=q.y; if(q.y>by1)by1=q.y; }
  const removed=[];
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i]; if(sd.alpha) continue;
      if(sd.shape&&!eraseShapesOn) continue; // Erase shapes off: shapes are protected
      const P=sd.pts, r=5+sd.maxW/2; let hit=false, inside=0;
      for(const p of P) if(p.x>=bx0-6&&p.x<=bx1+6&&p.y>=by0-6&&p.y<=by1+6) inside++;
      if(inside<0.5*P.length) continue; // only strokes mostly under the scribble, not ones it merely crosses
      for(let k=(P.length>1?1:0);k<P.length&&!hit;k++){
        const a=P.length>1?P[k-1]:P[0], b=P[k];
        if(Math.max(a.x,b.x)<bx0-r||Math.min(a.x,b.x)>bx1+r||Math.max(a.y,b.y)<by0-r||Math.min(a.y,b.y)>by1+r) continue;
        for(const q of S) if(snapSegDist(q,a,b)<=r){ hit=true; break; }
      }
      if(hit){ layer.strokes.splice(i,1); removed.push({layer,sd,index:i}); }
    }
  }
  if(!removed.length) return false; // nothing underneath: keep it as ordinary ink
  gp.history.push({t:'erase',items:removed});
  cur=null; clearLive();
  for(const r of removed) inkRemove(r.layer,r.sd);
  return true;
}

   12. INIT
   --------------------------------------------------------------- */
createPage();
activePage=pages[0];
if(wrap.clientWidth>0){ zoom=fitZoom(); wrap.style.setProperty('--z',zoom); } // default: fit to width

/* ---------------------------------------------------------------
   14. TOOLBAR UI — hover tooltips (mouse + stylus hover) and slider fill / live readouts
   --------------------------------------------------------------- */
(function(){
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  let timer=0;
  const show=el=>{
    tip.textContent=el.dataset.tip;
    const r=el.getBoundingClientRect(), tw=tip.offsetWidth;
    const x=Math.max(6,Math.min(innerWidth-tw-6,r.left+r.width/2-tw/2));
    tip.style.left=x+'px'; tip.style.top=(r.bottom+8)+'px';
    tip.classList.add('show');
  };
  const hide=()=>{ clearTimeout(timer); tip.classList.remove('show'); };
  document.querySelectorAll('#bar [data-tip]').forEach(el=>{
    el.removeAttribute('title'); // custom tooltip replaces the native one
    el.addEventListener('pointerenter',e=>{
      if(e.pointerType==='touch') return;
      clearTimeout(timer); timer=setTimeout(()=>show(el),110);
    });
    el.addEventListener('pointerleave',hide);
    el.addEventListener('pointerdown',hide);
  });
  document.addEventListener('scroll',hide,true);
  window.addEventListener('blur',hide);
  // sliders: filled track + numeric readout
  const syncRange=i=>{
    const p=(i.value-i.min)/(i.max-i.min)*100;
    i.style.setProperty('--p',p+'%');
    const o=$(i.id+'V'); if(!o) return;
    const dec=(i.step.split('.')[1]||'').length;
    o.textContent=(+i.value).toFixed(dec);
  };
  document.querySelectorAll('#bar input[type=range]').forEach(i=>{
    syncRange(i); i.addEventListener('input',()=>syncRange(i));
  });
})();

/* ---------------------------------------------------------------
   15. THICKNESS PRESETS & ERASER POPUPS
   3 thickness dots, each with its own thickness / pressure / friction. The popup sliders keep
   their original ids (mx, sens, fric) so the drawing code reads them unchanged — selecting a dot
   just loads that dot's values into them. Eraser sizes: #erSize (stroke eraser -> ER) and
   #arSize (area eraser). Everything is remembered in localStorage (silently skipped if blocked).
   --------------------------------------------------------------- */
(function(){
  const KEY='stylusInk.toolbar.v1';
  const DEF={pen:{presets:[{w:1,sens:0.6,fric:0.82},{w:5,sens:0.6,fric:0.82},{w:10,sens:0.6,fric:0.82}],sel:0},
             hl:{presets:[{w:10,sens:0.6,fric:0.82},{w:16,sens:0.6,fric:0.82},{w:28,sens:0.6,fric:0.82}],sel:1},er:10,ar:18};
  const LIM={pen:[0.5,20,0.1],hl:[2,60,0.5]}; // thickness slider range / step per profile
  const P=()=>S[profile];
  const S=JSON.parse(JSON.stringify(DEF));
  const num=(v,min,max,d)=>(typeof v==='number'&&isFinite(v))?Math.max(min,Math.min(max,v)):d;
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){
      const loadP=(k,s)=>{
        if(!s) return;
        if(Array.isArray(s.presets)) for(let i=0;i<3;i++){
          const p=s.presets[i]||{}, d=DEF[k].presets[i];
          S[k].presets[i]={w:num(p.w,LIM[k][0],LIM[k][1],d.w),sens:num(p.sens,0,1.5,d.sens),fric:num(p.fric,0,0.95,d.fric)};
        }
        S[k].sel=Math.round(num(s.sel,0,2,DEF[k].sel));
      };
      loadP('pen',o.pen||o); loadP('hl',o.hl); // older saves (flat presets/sel) are the pen profile
      S.er=num(o.er,2,60,DEF.er); S.ar=num(o.ar,5,60,DEF.ar);
    }
  }catch(_){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(_){} };

  const dots=[...document.querySelectorAll('#dots .td')];
  const menus=[$('dotMenu'),$('penMenu'),$('erMenu'),$('arMenu'),$('smMenu'),$('viewMenu'),$('moreMenu'),$('shpMenu'),$('txtMenu'),$('imgMenu')];
  const popTrig=[['smBtn','smMenu'],['viewBtn','viewMenu'],['moreBtn','moreMenu']];
  const toggles=[...dots,$('mPen'),$('mEr'),$('mAr'),$('mShp'),$('mTxt'),$('mImg'),...popTrig.map(p=>$(p[0]))];
  const closeMenus=()=>menus.forEach(m=>m.style.display='none');
  let loading=false;
  const setVal=(id,v)=>{ const i=$(id); i.value=v; i.dispatchEvent(new Event('input')); };

  function paintDots(){
    dots.forEach((b,i)=>{
      const p=P().presets[i], d=Math.round(Math.min(20,4+p.w*(profile==='hl'?0.35:0.8)));
      b.classList.toggle('on',i===P().sel);
      b.firstElementChild.style.width=b.firstElementChild.style.height=d+'px';
      b.dataset.tip='Thickness '+(+p.w.toFixed(1))+' px';
    });
    $('dotTitle').textContent=(profile==='hl'?'Highlighter thickness ':'Thickness ')+(P().sel+1);
  }
  function loadSel(){
    const p=P().presets[P().sel]; loading=true;
    const mxEl=$('mx'); mxEl.min=LIM[profile][0]; mxEl.max=LIM[profile][1]; mxEl.step=LIM[profile][2];
    ['sens','fric'].forEach(id=>{ const r=$(id).closest('.prow'); if(r) r.style.display=profile==='hl'?'none':''; }); // highlighter has no pressure / friction
    setVal('mx',p.w); setVal('sens',p.sens); setVal('fric',p.fric);
    loading=false; paintDots();
  }
  // slider edits -> currently selected dot
  ['mx','sens','fric'].forEach(id=>$(id).addEventListener('input',()=>{
    if(loading) return;
    const p=P().presets[P().sel];
    p.w=+$('mx').value; p.sens=+$('sens').value; p.fric=+$('fric').value;
    paintDots(); save();
  }));
  $('erSize').addEventListener('input',()=>{ ER=+$('erSize').value; S.er=ER; save(); });
  $('arSize').addEventListener('input',()=>{ S.ar=+$('arSize').value; save(); });

  // − / + buttons
  document.querySelectorAll('#bar .pm').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const i=$(b.dataset.for);
    let v=Math.round(((+i.value)+(+b.dataset.step)*(+b.dataset.dir))*1000)/1000;
    v=Math.max(+i.min,Math.min(+i.max,v));
    i.value=v; i.dispatchEvent(new Event('input'));
  }));

  // thickness dots: click = select; click the selected dot again = settings popup
  dots.forEach((b,i)=>b.addEventListener('click',()=>{
    const erasing=(mode==='eraser'||mode==='areaEraser');
    if(i!==P().sel||erasing){
      closeMenus(); P().sel=i; loadSel(); save();
      if(erasing) setMode(profile);
      return;
    }
    const m=$('dotMenu'), wasOpen=m.style.display==='block';
    closeMenus();
    if(!wasOpen){ m.style.left=b.offsetLeft+'px'; m.style.display='block'; }
  }));

  // eraser tools: click = select; click again (already active) = size popup.
  // Capture phase so we read the state BEFORE the existing onclick switches the mode.
  [['mPen','pen','penMenu'],['mEr','eraser','erMenu'],['mAr','areaEraser','arMenu']].forEach(([btn,key,menu])=>{
    $(btn).addEventListener('click',()=>{
      const m=$(menu), wasOpen=m.style.display==='block', wasActive=(key==='pen'?(mode==='pen'||mode==='ink'||mode==='cal'):mode===key);
      closeMenus();
      if(wasActive&&!wasOpen) m.style.display='block';
    },true);
  });

  // auto-arrowhead: button opens/closes its popup; switch turns it on/off; slider sets the trigger displacement
  const paintArrow=()=>{
    $('arrBtn').classList.toggle('on',arrowOn);
    $('arrBtn').setAttribute('aria-pressed',arrowOn);
  };
  $('arrBtn').addEventListener('click',()=>{
    arrowOn=!arrowOn; paintArrow();
    try{ localStorage.setItem('inkdown.arrow',arrowOn?'1':'0'); }catch(_){}
  });

  // popup buttons (Smart ink / View / More): click toggles that popup; action rows (data-close) close it afterwards
  popTrig.forEach(([b,m])=>$(b).addEventListener('click',()=>{
    const el=$(m), wasOpen=el.style.display==='block';
    closeMenus(); if(!wasOpen) el.style.display='block';
  }));
  document.querySelectorAll('#bar .menu [data-close]').forEach(b=>b.addEventListener('click',()=>setTimeout(closeMenus,0)));
  $('arrMin').addEventListener('input',()=>{
    ARROW_MIN=+$('arrMin').value; $('arrMinV').textContent=ARROW_MIN;
    try{ localStorage.setItem('inkdown.arrowMin',ARROW_MIN); }catch(_){}
  });
  $('arrMin').value=ARROW_MIN; $('arrMinV').textContent=ARROW_MIN; paintArrow();
  $('arrSize').addEventListener('input',()=>{
    ARROW_SIZE=+$('arrSize').value;
    try{ localStorage.setItem('inkdown.arrowSize',ARROW_SIZE); }catch(_){}
  });
  $('arrSize').value=ARROW_SIZE; $('arrSize').dispatchEvent(new Event('input'));

  // the toolbar is one horizontally-scrolling row, so its popup menus are position:fixed (an absolute menu
  // would be clipped by the scroll area): drop each open menu just under its own button, kept on screen
  const placeMenus=()=>document.querySelectorAll('#bar .menu').forEach(m=>{
    if(getComputedStyle(m).display==='none') return;
    const a=m.parentElement.getBoundingClientRect(), w=m.offsetWidth;
    m.style.left=Math.max(4,Math.min(a.left,innerWidth-w-4))+'px';
    m.style.top=(a.bottom+8)+'px';
  });
  const syncOpen=()=>popTrig.forEach(([b,m])=>$(b).classList.toggle('open',$(m).style.display==='block'));
  const placeAll=()=>{ placeMenus(); syncOpen(); };
  const placeSoon=()=>requestAnimationFrame(placeAll);
  document.addEventListener('click',placeSoon,true);
  document.addEventListener('pointerup',placeSoon,true);
  $('bar').addEventListener('scroll',placeMenus,{passive:true});
  window.addEventListener('resize',placeMenus);

  // click anywhere else closes the popups (capture: runs even when other handlers stop propagation)
  document.addEventListener('click',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu,#txtMenu,#imgMenu,#huePk')||toggles.some(t=>t.contains(e.target)))) return;
    closeMenus();
  },true);
  // 'click' never fires for stylus strokes or finger scrolls on the canvas, so also close on pointerdown
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu,#txtMenu,#imgMenu,#huePk')||toggles.some(t=>t.contains(e.target)))) return;
    const wasOpen=menus.some(m=>m.style.display==='block');
    closeMenus();
    // The press that closes a popup must not leave ink: stop it before the canvas handlers see it.
    // (Touch is left alone so a finger can still scroll/pinch; fingers never draw anyway.)
    if(wasOpen&&e.pointerType!=='touch'){
      if(e.pointerType==='pen') penDown=true; // released by the window pointerup listener
      e.stopPropagation(); e.preventDefault();
    }
  },true);

  // init
  setVal('erSize',S.er); ER=S.er; setVal('arSize',S.ar);
  window.thickProfileSync=()=>{ closeMenus(); loadSel(); }; // pen <-> highlighter: load that profile's thickness presets
  loadSel();
})();

/* ---------------------------------------------------------------
   ERASER CURSOR — circle that shows the eraser size while hovering or touching with a stylus (or mouse).
   Stroke eraser = its radius (#erSize); area eraser = its brush radius (#arSize). Scales with zoom.
   --------------------------------------------------------------- */
(function(){
  const el=document.createElement('div'); el.id='erCur'; document.body.appendChild(el);
  let x=0,y=0,vis=false,raf=0,lastD=0;
  const radius=()=>(mode==='areaEraser'?+$('arSize').value:ER)*zoom; // page units -> screen px
  const paint=()=>{ // synchronous: no frame delay, so the circle sticks to the pen tip
    raf=0; if(!vis) return;
    const r=Math.max(2,radius()), d=r*2;
    if(d!==lastD){ el.style.width=el.style.height=d+'px'; lastD=d; }
    el.style.transform='translate3d('+(x-r)+'px,'+(y-r)+'px,0)';
  };
  const show=()=>{ if(!vis){ vis=true; el.style.display='block'; wrap.classList.add('er-cur'); } };
  const hide=()=>{ if(vis){ vis=false; el.style.display='none'; wrap.classList.remove('er-cur'); } };
  const upd=e=>{
    if((mode!=='eraser'&&mode!=='areaEraser')||e.pointerType==='touch'){ hide(); return; } // finger = scroll, no cursor
    const ce=e.getCoalescedEvents&&e.getCoalescedEvents(); const l=ce&&ce.length?ce[ce.length-1]:e;
    x=l.clientX; y=l.clientY; show(); paint();
  };
  ['pointerrawupdate','pointermove','pointerdown','pointerenter','pointerover'].forEach(t=>wrap.addEventListener(t,upd,{capture:true,passive:true}));
  wrap.addEventListener('pointerleave',hide,true);
  wrap.addEventListener('pointercancel',e=>{ if(e.pointerType!=='pen') hide(); },true);
  document.addEventListener('pointerdown',e=>{ if(!wrap.contains(e.target)) hide(); },true);
  window.addEventListener('blur',hide);
  ['erSize','arSize'].forEach(id=>$(id).addEventListener('input',()=>{ lastD=0; if(vis&&!raf) raf=requestAnimationFrame(paint); }));
  wrap.addEventListener('wheel',()=>{ lastD=0; if(vis&&!raf) raf=requestAnimationFrame(paint); },{passive:true});
})();
</script>
