<!DOCTYPE html>

<head>

<style>
/* ============================================================
   SECTION: THEME TOKENS
   ============================================================ */
:root{--bg:#f3f4f6;--bar:#ffffff;--fg:#111827;--bd:#d1d5db;--ac:#2563eb;--tb:#000000;
  --tb-bg:linear-gradient(180deg,#ffffff,#f3f4f7);--tb-solid:#f8f9fb;--tb-fg:#1f2937;--tb-mut:#6b7280;--tb-bd:#e3e6ec;
  --tb-hov:rgba(17,24,39,.07);--tb-pop:#ffffff;--tb-tip:#111827;--tb-tipfg:#f9fafb;--tb-track:#d3d7df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--bar:#1c1f27;--fg:#e5e7eb;--bd:#374151;--ac:#60a5fa;--tb:#000000;
  --tb-bg:linear-gradient(180deg,#1c1f27,#14161c);--tb-solid:#181b22;--tb-fg:#e5e7eb;--tb-mut:#9ca3af;--tb-bd:#2a2e39;
  --tb-hov:rgba(255,255,255,.08);--tb-pop:#1c1f27;--tb-tip:#f3f4f6;--tb-tipfg:#111827;--tb-track:#3a3f4d}}
:root[data-theme="dark"]{--bg:#111318;--bar:#1c1f27;--fg:#e5e7eb;--bd:#374151;--ac:#60a5fa;
  --tb-bg:linear-gradient(180deg,#1c1f27,#14161c);--tb-solid:#181b22;--tb-fg:#e5e7eb;--tb-mut:#9ca3af;--tb-bd:#2a2e39;
  --tb-hov:rgba(255,255,255,.08);--tb-pop:#1c1f27;--tb-tip:#f3f4f6;--tb-tipfg:#111827;--tb-track:#3a3f4d}

/* ============================================================
   SECTION: PAGE / LAYOUT SHELL
   ============================================================ */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;position:relative;overflow:auto;background:var(--bg);touch-action:none;overscroll-behavior:contain}
.page{position:relative;width:calc(var(--pw,794)*1px*var(--z,1));height:calc(var(--ph,1123)*1px*var(--z,1));margin:20px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
canvas{touch-action:none;user-select:none}

/* ============================================================
   SECTION: TOOLBAR (icon buttons, groups, sliders, swatches, status, tooltip)
   ============================================================ */
button,select{background:#171717;color:#f3f4f6;border:1px solid #333;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#262626}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
label{display:flex;align-items:center;gap:6px}

#bar{position:relative;z-index:50;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 2px;
  overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:var(--tb-bg);border-bottom:1px solid var(--tb-bd);box-shadow:0 6px 20px rgba(0,0,0,.14);color:var(--tb-fg);user-select:none;-webkit-user-select:none}
.grp{display:flex;align-items:center;gap:2px;flex:none;position:relative}
.vd{width:1px;height:22px;background:var(--tb-bd);margin:0 8px;flex:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;pointer-events:none;flex:none}

#bar .ib{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;min-width:36px;padding:0;
  background:transparent;border:1px solid transparent;border-radius:9px;color:var(--tb-fg);font:600 12px/1 system-ui;
  transition:background .15s,color .15s,box-shadow .15s,transform .1s}
#bar .ib:hover{background:var(--tb-hov)}
#bar .ib:active{transform:scale(.94)}
#bar .ib.on{background:var(--ac);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent)}
#bar .ib:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
#bar .ib.txt{width:auto;min-width:50px;padding:0 8px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
#bar #pgInd{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:0 4px;font:600 12px/1 system-ui;color:var(--tb-mut);text-align:center;font-variant-numeric:tabular-nums}
#bar #clr:hover{background:rgba(220,38,38,.14);color:#dc2626}
#bar #expPdf{background:var(--ac);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
#bar #expPdf:hover{filter:brightness(1.1);background:var(--ac)}

/* -- color swatches: fixed round size, never shrink -- */
#sws{display:flex;gap:8px;flex:none;align-items:center;padding:0 4px}
#bar .sw{flex:none;box-sizing:border-box;width:26px;height:26px;min-width:26px;min-height:26px;max-width:26px;max-height:26px;aspect-ratio:1/1;
  padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);
  transition:transform .12s,box-shadow .15s}
#bar .sw:hover{transform:scale(1.12)}
#bar .sw.on{border:1px solid rgba(0,0,0,.22);box-shadow:0 0 0 2px var(--tb-solid),0 0 0 4px var(--ac)}

/* -- sliders -- */
#bar .sl{display:flex;align-items:center;gap:7px;padding:0 8px;height:36px;border-radius:9px;color:var(--tb-mut);flex:none}
#bar .sl:hover{background:var(--tb-hov)}
#bar .sl output{min-width:26px;font:600 11px/1 system-ui;color:var(--tb-fg);font-variant-numeric:tabular-nums;text-align:right}
#bar input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:20px;margin:0;background:transparent;cursor:pointer}
#bar input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--p,50%),var(--tb-track) var(--p,50%))}
#bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#bar input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--tb-track)}
#bar input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--ac)}
#bar input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#bar input[type=range]:focus{outline:none}

/* -- dropdown menus -- */
#bar::-webkit-scrollbar{display:none}
#bar .menu{display:none;position:fixed;top:0;left:0;max-width:calc(100vw - 8px);background:var(--tb-pop);border:1px solid var(--tb-bd);border-radius:12px;padding:5px;z-index:1000;white-space:nowrap;
  box-shadow:0 12px 32px rgba(0,0,0,.28);animation:menuIn .14s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#bar .mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;background:transparent;border:none;border-radius:8px;color:var(--tb-fg);font:500 13px/1 system-ui;text-align:left}
#bar .mi:hover{background:var(--tb-hov)}
#bar .mi+.mi{margin-top:2px}

/* -- thickness dots + settings popups (dot / eraser / area eraser) -- */
#dots{gap:8px;padding:0 4px}
#bar .td{flex:none;box-sizing:border-box;width:26px;height:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;border-radius:50%;transition:box-shadow .15s,background .15s}
#bar .td:hover{background:var(--tb-hov)}
#bar .td .dot{display:block;border-radius:50%;background:var(--tb-fg);pointer-events:none}
#bar .td.on{box-shadow:0 0 0 2px var(--tb-solid),0 0 0 4px var(--ac)}
#bar .pmenu{padding:8px 10px;cursor:default}
#bar .ptitle{font:600 11px/1 system-ui;color:var(--tb-mut);text-transform:uppercase;letter-spacing:.4px;padding:2px 4px 6px}
#bar .prow{display:flex;align-items:center;gap:6px;height:36px}
#bar .pl{width:66px;font:500 12px/1 system-ui;color:var(--tb-fg)}
#bar .pm{flex:none;width:26px;height:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--tb-bd);border-radius:7px;color:var(--tb-fg);font:600 15px/1 system-ui}
#bar .pm:hover{background:var(--tb-hov)}
#bar .prow output{min-width:32px;font:600 11px/1 system-ui;color:var(--tb-fg);font-variant-numeric:tabular-nums;text-align:right}

#bar .tg{flex:none;position:relative;width:38px;height:22px;padding:0;border-radius:11px;border:1px solid var(--tb-bd);background:var(--tb-hov);transition:background .15s}
#bar .tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tb-fg);transition:transform .15s}
#bar .tg.on{background:var(--ac);border-color:var(--ac)}
#bar .tg.on::after{transform:translateX(16px);background:#fff}

/* -- status text hidden: toolbar shows tools only (element kept so JS can still write to it) -- */
#st{display:none}

/* ============================================================
   SECTION: GLASS TOOLBAR (v52) — floating frosted capsule + frosted popups.
   The blur lives on #barGlass (a sibling layer), NOT on #bar, so #bar's fixed-position
   popup menus keep positioning against the viewport.
   ============================================================ */
:root{--gl-a:rgba(255,255,255,.42);--gl-b:rgba(255,255,255,.14);--gl-bd:rgba(255,255,255,.7);--gl-in:rgba(255,255,255,.9);--gl-pop:rgba(255,255,255,.7);--gl-sh:rgba(31,41,80,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl-a:rgba(60,68,92,.42);--gl-b:rgba(18,20,32,.2);--gl-bd:rgba(255,255,255,.16);--gl-in:rgba(255,255,255,.16);--gl-pop:rgba(28,31,44,.7);--gl-sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--gl-a:rgba(60,68,92,.42);--gl-b:rgba(18,20,32,.2);--gl-bd:rgba(255,255,255,.16);--gl-in:rgba(255,255,255,.16);--gl-pop:rgba(28,31,44,.7);--gl-sh:rgba(0,0,0,.5)}
body{background:radial-gradient(640px 220px at 10% 20px,color-mix(in srgb,var(--ac) 55%,transparent),transparent 78%),radial-gradient(600px 220px at 90% 10px,rgba(168,85,247,.45),transparent 78%),radial-gradient(520px 200px at 50% 70px,rgba(20,184,166,.32),transparent 78%),radial-gradient(640px 220px at 90% 100%,color-mix(in srgb,var(--ac) 55%,transparent),transparent 78%),radial-gradient(600px 220px at 10% 100%,rgba(168,85,247,.45),transparent 78%),radial-gradient(520px 200px at 50% calc(100% - 50px),rgba(20,184,166,.32),transparent 78%),var(--bg)}
body{position:relative}
#wrap{background:transparent;padding-top:calc(66px + env(safe-area-inset-top,0px))}
#barShell{position:absolute;top:0;left:0;right:0;z-index:50;border-radius:22px;
  margin:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
#barGlass{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(135deg,var(--gl-a),var(--gl-b));
  -webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.04);backdrop-filter:blur(18px) saturate(200%) brightness(1.04);
  border:1px solid var(--gl-bd);box-shadow:0 14px 38px var(--gl-sh),inset 0 1px 0 var(--gl-in),inset 0 -1px 0 rgba(255,255,255,.08)}
#barGlass::after{content:'';position:absolute;inset:4px;border-radius:18px;pointer-events:none;
  border:1px solid var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-in),0 0 0 1px rgba(255,255,255,.06)}
#barGlass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14) 100%)}
#bar{background:transparent;border-bottom:0;box-shadow:none;border-radius:20px;padding:6px 10px}
#bar .ib.open{background:var(--tb-hov);box-shadow:inset 0 0 0 1px var(--gl-bd)}
#bar .menu{background:var(--gl-pop);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--gl-bd);border-radius:16px;box-shadow:0 18px 44px var(--gl-sh),inset 0 1px 0 var(--gl-in)}
#bar .pmenu{min-width:240px;padding:8px 10px}
#bar .mi{border-radius:10px}
#bar .mi.on{background:transparent;color:var(--tb-fg)}
#bar .mi.on:hover{background:var(--tb-hov)}
#bar .mi:disabled{opacity:.4;cursor:default;background:transparent}
#bar .mi .mt{margin-left:auto;position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--tb-hov);border:1px solid var(--tb-bd);transition:background .15s}
#bar .mi .mt::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tb-fg);transition:transform .15s}
#bar .mi.on .mt{background:var(--ac);border-color:var(--ac)}
#bar .mi.on .mt::after{transform:translateX(14px);background:#fff}
#bar .mi.danger:hover{background:rgba(220,38,38,.14);color:#dc2626}
#bar #expPdf.mi{background:transparent;color:var(--tb-fg);box-shadow:none}
#bar #expPdf.mi:hover{background:var(--tb-hov);filter:none}
#bar .msep{height:1px;background:var(--tb-bd);margin:6px 4px}
#bar .pmenu .prow{padding:0 2px}
#bar .shg{display:grid;grid-template-columns:repeat(4,40px);gap:4px;padding:2px}
#bar .shb{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--tb-fg)}
#bar .shb:hover{background:var(--tb-hov)}
#bar .shb.on{background:var(--ac);border-color:var(--ac);color:#fff}
#bar .shb .ic{width:22px;height:22px}
#bar .shst{display:flex;gap:4px;padding:2px}
#bar .shs{flex:1;height:30px;padding:0 10px;background:transparent;border:1px solid var(--tb-bd);border-radius:8px;color:var(--tb-fg);font:600 12px/1 system-ui}
#bar .shs:hover{background:var(--tb-hov)}
#bar .shs.on{background:var(--ac);border-color:var(--ac);color:#fff}
#bar .shst.dim{opacity:.45}
/* -- Shapes pop-up: glass panel, icon-style buttons, colour palettes, greyed-out groups -- */
#bar #shpMenu{min-width:288px;padding:10px;border-radius:22px;border:1px solid var(--gl-bd);overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 96px);
  background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.07) 55%,rgba(255,255,255,.16)),var(--gl-pop);
  -webkit-backdrop-filter:blur(40px) saturate(210%) brightness(1.05);backdrop-filter:blur(40px) saturate(210%) brightness(1.05);
  box-shadow:0 24px 56px var(--gl-sh),0 4px 14px rgba(0,0,0,.10),inset 0 1px 0 var(--pm-hi),inset 0 -1px 0 rgba(255,255,255,.08)}
#bar #shpMenu::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 72%,rgba(255,255,255,.14) 100%)}
#bar #shpMenu>*{position:relative}
#bar #shpMenu .shst{gap:6px;padding:2px 0 4px}

  background:var(--pm-well);border:1px solid var(--pm-well-bd);box-shadow:inset 0 1px 0 var(--pm-hi);color:var(--tb-fg);transition:background .15s,box-shadow .15s,transform .12s}
#bar #shpMenu .shs .ic{width:22px;height:22px}

#bar #shpMenu .shs:hover:not(:disabled){transform:translateY(-1px)}
#bar #shpMenu .shs.on{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 92%,#fff),var(--ac));border-color:transparent;color:#fff;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent),0 6px 16px var(--pm-glow),inset 0 1px 0 rgba(255,255,255,.45)}
#bar #shpMenu .shs:disabled{opacity:.45}
#bar #shpMenu .shg{padding:2px 0 6px;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
#bar #shpMenu .shb{border-radius:12px;width:auto}
#bar #shpMenu .shb:hover{background:var(--pm-well);border-color:var(--pm-well-bd)}
#bar #shpMenu .shb.on{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 92%,#fff),var(--ac));border-color:transparent;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent),0 6px 16px var(--pm-glow),inset 0 1px 0 rgba(255,255,255,.45)}
/* shape icons follow the chosen style (line / arrow have no inside, so they stay lines) */
#bar #shpMenu[data-style="fill"] .shb:not(.shl) .ic>*{fill:currentColor;stroke:none}
#bar #shpMenu[data-style="both"] .shb:not(.shl) .ic>*{fill:currentColor;fill-opacity:.28;stroke:currentColor}
#bar #shpMenu .shgrp{margin-top:8px;padding:8px 10px 6px;border-radius:16px;background:var(--pm-well);border:1px solid var(--pm-well-bd);
  box-shadow:inset 0 1px 0 var(--pm-hi),0 2px 8px rgba(15,23,42,.06);transition:opacity .2s,filter .2s}
#bar #shpMenu .shgrp .ptitle{padding:0 2px 6px}
#bar #shpMenu .shgrp.off{opacity:.38;filter:grayscale(1);pointer-events:none}
#bar #shpMenu .shpal{display:flex;gap:10px;padding:2px 2px 8px;align-items:center}
#bar #shpMenu .shpal .sw{flex:none;width:26px;height:26px;border-radius:50%;padding:0;border:1px solid rgba(0,0,0,.22);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);transition:transform .12s,box-shadow .15s}
#bar #shpMenu .shpal .sw:hover{transform:scale(1.12)}
#bar #shpMenu .shpal .sw.on{box-shadow:0 0 0 2px var(--gl-pop),0 0 0 4px var(--ac),inset 0 0 0 1.5px rgba(255,255,255,.28)}

/* ============================================================
   SECTION: PREMIUM POLISH (v70) — refined glass capsule, soft pill buttons,
   luminous active state, gradient dividers, polished sliders/swatches/popups.
   Pure CSS override; no markup or JS changes.
   ============================================================ */
:root{--pm-hi:rgba(255,255,255,.85);--pm-lo:rgba(15,23,42,.10);--pm-well:rgba(255,255,255,.34);--pm-well-bd:rgba(255,255,255,.55);--pm-glow:color-mix(in srgb,var(--ac) 55%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pm-hi:rgba(255,255,255,.22);--pm-lo:rgba(0,0,0,.45);--pm-well:rgba(255,255,255,.06);--pm-well-bd:rgba(255,255,255,.10)}}
:root[data-theme="dark"]{--pm-hi:rgba(255,255,255,.22);--pm-lo:rgba(0,0,0,.45);--pm-well:rgba(255,255,255,.06);--pm-well-bd:rgba(255,255,255,.10)}
#barShell{border-radius:26px}
#barGlass{border-radius:26px;
  background:
    radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.38),transparent 55%),
    radial-gradient(100% 120% at 100% 100%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%),

  border:1px solid transparent;
  box-shadow:0 1px 0 var(--pm-hi) inset,0 -1px 0 var(--pm-lo) inset,0 0 0 1px var(--gl-bd),0 18px 44px var(--gl-sh)}
#barGlass::after{inset:0;border-radius:inherit;border:0;box-shadow:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 46%);
  -webkit-mask:linear-gradient(#000,transparent 70%);mask:linear-gradient(#000,transparent 70%)}
#barGlass::before{border-radius:inherit;
  background:linear-gradient(100deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 72%,rgba(255,255,255,.18) 100%)}
#bar{border-radius:26px;padding:7px 12px;gap:6px 4px}
.grp{gap:3px}
.vd{width:1px;height:26px;margin:0 10px;border-radius:1px;background:linear-gradient(180deg,transparent,var(--tb-bd) 30%,var(--tb-bd) 70%,transparent);opacity:.9}

  transition:background .18s,color .18s,box-shadow .2s,transform .14s,border-color .18s}
#bar .ib:hover{background:var(--pm-well);border-color:var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset,0 4px 10px rgba(15,23,42,.08);transform:translateY(-1px)}

/* ============================================================
   SECTION: STAGE (base picture + ink layer canvases + box elements, z-order)
   .stage holds the PDF base canvas (always first child, so always
   underneath), ink-layer SVGs and box elements as siblings,
   appended in creation order. With no z-index set, later DOM
   siblings paint above earlier ones — so whichever was added
   most recently (ink, image, or text) sits on top.

.stage{position:absolute;inset:0;z-index:0;touch-action:none}
.page{scroll-margin-top:20px}

.dt-menu{position:fixed;display:none;width:0;height:0;z-index:9999;touch-action:manipulation}
.dt-menu::before{content:'';position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--ac);opacity:.55;pointer-events:none}
.dt-menu .dt-band{position:absolute;pointer-events:none;overflow:visible;opacity:0;transform:scale(.6);transition:opacity .18s,transform .24s cubic-bezier(.2,.9,.3,1.2);filter:drop-shadow(0 8px 16px var(--gl-sh))}

.dt-menu .dt-band .b1{stroke:var(--gl-pop);stroke-width:58}
.dt-menu .dt-b{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--gl-bd);outline:none;background:rgba(127,127,127,.16);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translate(0,0) scale(.3);transition:transform .28s cubic-bezier(.2,.9,.3,1.25) calc(var(--i,0)*28ms),opacity .16s calc(var(--i,0)*28ms)}
.dt-menu.open .dt-b{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) scale(1)}
.dt-menu.open .dt-b:active{transform:translate(var(--tx,0),var(--ty,0)) scale(.92);transition-delay:0s}
.dt-menu .dt-b.dim{opacity:.4!important}

.hold-ring{position:fixed;width:120px;height:120px;transform:translate(-50%,-50%);z-index:9998;pointer-events:none;opacity:.55;animation:hrIn .2s ease-out}
.hold-ring svg{position:relative;display:block;transform:rotate(-90deg)}

.hold-ring .hr-bg{stroke:rgba(127,127,127,.22)}
.hold-ring .hr-fg{stroke:var(--ac);stroke-dasharray:340;stroke-dashoffset:340;animation:hrFill var(--hold-ms,500ms) linear forwards}
.hold-ring .hr-w{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%);animation:hrWave 1s ease-out infinite}
.hold-ring .hr-w.w2{animation-delay:.5s}
.hold-ring.done{animation:hrDone .28s ease-out forwards}
.hold-ring.out{opacity:0;transition:opacity .18s}
@keyframes hrIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:.55;transform:translate(-50%,-50%) scale(1)}}

function shpPaint(){
  const open=!!SHP_OPEN[shapeKind]; // line / arrow: border only, no inside
  document.querySelectorAll('#shpMenu .shb').forEach(b=>b.classList.toggle('on',b.dataset.shape===shapeKind&&mode==='shape'));
  document.querySelectorAll('#shpStyle .shs').forEach(b=>{ b.classList.toggle('on',b.dataset.style===SHP.style); b.disabled=open; });
  $('shpMenu').dataset.style=SHP.style; // drives the icon look (outline / solid / outline + light fill)
  const off=(el,v)=>{ el.classList.toggle('off',v); el.setAttribute('aria-disabled',v); el.querySelectorAll('input,button').forEach(x=>x.disabled=v); };
  off($('shpBG'),!open&&SHP.style==='fill'); // fill-only: border group greyed out
  off($('shpFG'),open||SHP.style==='border'); // border-only (or line / arrow): fill group greyed out
  [['shpBPal','bc'],['shpFPal','fc']].forEach(([id,k])=>{
    const box=$(id), sel=SHP[k]||curColor;
    if(!box.children.length) COLORS.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.dataset.c=c;
      b.dataset.tip=COLOR_NAMES[i]; b.setAttribute('aria-label',COLOR_NAMES[i]);
      b.onclick=()=>{ SHP[k]=c; shpSave(); shpPaint(); };
      box.appendChild(b);
    });
    [...box.children].forEach(b=>b.classList.toggle('on',b.dataset.c===sel));
  });
}

function shapePts(kind,x0,y0,x1,y1,eq){
  let l=Math.min(x0,x1), r=Math.max(x0,x1), t=Math.min(y0,y1), b=Math.max(y0,y1);
  if(eq&&kind!=='line'&&kind!=='arrow'){ // Shift: equal width/height, anchored at the start corner
    const s=Math.max(r-l,b-t); l=x1>=x0?x0:x0-s; r=l+s; t=y1>=y0?y0:y0-s; b=t+s;
  }
  const w=r-l, h=b-t, cx=(l+r)/2, cy=(t+b)/2, rx=w/2, ry=h/2, PI=Math.PI, V=[];
  const poly=a=>a.map(p=>({x:p[0],y:p[1]}));
  const reg=(n,a0)=>{ for(let i=0;i<n;i++){ const a=a0+i*2*PI/n; V.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}); } };
  let closed=true, curve=false;
  switch(kind){
    case 'line': closed=false; V.push(...poly([[x0,y0],[x1,y1]])); break;
    case 'arrow':{
      closed=false; const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len, hl=Math.min(len*0.4,10+len*0.12), a=PI/7;
      const hx=(s)=>({x:x1-hl*(ux*Math.cos(s*a)-uy*Math.sin(s*a)),y:y1-hl*(ux*Math.sin(s*a)+uy*Math.cos(s*a))});
      V.push({x:x0,y:y0},{x:x1,y:y1},hx(1),{x:x1,y:y1},hx(-1)); break;
    }
    case 'rect': V.push(...poly([[l,t],[r,t],[r,b],[l,b]])); break;
    case 'round':{
      curve=true; const k=Math.min(w,h)*0.2, an=Math.max(8,Math.ceil(k*PI/2/3)); // corner radius = 20% of the short side; arc density grows with radius
      const arc=(ax,ay,a0)=>{ for(let i=0;i<=an;i++){ const a=a0+i*(PI/2)/an; V.push({x:ax+k*Math.cos(a),y:ay+k*Math.sin(a)}); } };
      arc(r-k,t+k,-PI/2); arc(r-k,b-k,0); arc(l+k,b-k,PI/2); arc(l+k,t+k,PI); break;
    }
    case 'ellipse':{ curve=true; const N=Math.max(64,Math.ceil((w+h)*0.4)); for(let i=0;i<N;i++){ const a=i*2*PI/N; V.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}); } break; }
    case 'triangle': V.push(...poly([[cx,t],[r,b],[l,b]])); break;
    case 'rtri': V.push(...poly([[l,t],[l,b],[r,b]])); break;
    case 'diamond': V.push(...poly([[cx,t],[r,cy],[cx,b],[l,cy]])); break;
    case 'pentagon': reg(5,-PI/2); break;
    case 'hexagon': reg(6,0); break;
    case 'star': for(let i=0;i<10;i++){ const a=-PI/2+i*PI/5, k=i%2?0.42:1; V.push({x:cx+rx*k*Math.cos(a),y:cy+ry*k*Math.sin(a)}); } break;
    case 'heart':{ curve=true; const N=Math.max(100,Math.ceil((w+h)*0.5)); // fills its drag box exactly (curve spans x ±16, y -11.92..17)
      for(let i=0;i<N;i++){ const a=i*2*PI/N, sx=16*Math.pow(Math.sin(a),3), sy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
        V.push({x:cx+sx/16*rx,y:t+(sy+11.923252)/28.923252*h}); } break; }
    default: return null;
  }
  if(closed&&!curve) V.push({...V[0]});
  else if(closed&&curve&&dist(V[0],V[V.length-1])>0.01) V.push({...V[0]});
  const out=[]; // resample so ink is dense enough to keep corners sharp after smoothing
  for(let i=0;i<V.length;i++){
    const a=V[i], c=V[i+1];
    if(!c){ out.push({x:a.x,y:a.y,p:1}); break; }
    const n=Math.max(1,Math.ceil(dist(a,c)/(curve?6:2.5)));
    for(let k=0;k<n;k++) out.push({x:a.x+(c.x-a.x)*k/n,y:a.y+(c.y-a.y)*k/n,p:1});
  }
  return out;
}

/* ---------------------------------------------------------------
   5. UNDO / CLEAR
   --------------------------------------------------------------- */
$('undo').onclick=()=>{
  const pg=activePage; if(!pg) return;
  const h=pg.history.pop(); if(!h) return;
  clearLassoSel();
  if(h.t==='move'){
    for(const o of (h.bx||[])){ o.b.xPct=o.x; o.b.yPct=o.y; applyBoxRect(o.b); }
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:p.x-h.dx,y:p.y-h.dy}));
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='rotate'){
    const t=-h.ang*Math.PI/180, c=Math.cos(t), sn=Math.sin(t);
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:h.cx+(p.x-h.cx)*c-(p.y-h.cy)*sn,y:h.cy+(p.x-h.cx)*sn+(p.y-h.cy)*c}));
    for(const o of h.boxes){ o.b.xPct=o.x; o.b.yPct=o.y; o.b.rot=o.rot; applyBoxRect(o.b); }
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='paste'){
    for(const b of (h.boxes||[])){ if(b.endCrop) b.endCrop(false); b.kind==='image'?removeImageBox(b):removeBox(b); }
    for(const {layer,sd} of h.items){ const i=layer.strokes.indexOf(sd); if(i>=0) layer.strokes.splice(i,1); }
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='recolor'){
    for(const it of h.items) it.sd.color=it.old;
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='arrowhead'){
    h.sd.pts=h.oldPts; const j=h.layer.strokes.indexOf(h.head); if(j>=0) h.layer.strokes.splice(j,1);
    repaintLayer(h.layer);
  }else if(h.t==='add'){
    const i=h.layer.strokes.indexOf(h.sd); if(i>=0) h.layer.strokes.splice(i,1);
    if(h.extra){ const j=h.layer.strokes.indexOf(h.extra); if(j>=0) h.layer.strokes.splice(j,1); }
    repaintLayer(h.layer);
  }else if(h.t==='erase'){
    for(const o of (h.boxes||[])) boxMake(pg,o);
    const byLayer=new Map();
    for(const it of h.items){ if(!byLayer.has(it.layer)) byLayer.set(it.layer,[]); byLayer.get(it.layer).push(it); }
    for(const [layer,items] of byLayer){
      items.sort((a,b)=>a.index-b.index);
      for(const it of items) layer.strokes.splice(it.index,0,it.sd);
      repaintLayer(layer);
    }
  }else if(h.t==='areaErase'){
    for(const c of h.changes) c.layer.strokes.splice(c.index,c.newStrokes.length,c.oldSd);
    const touched=new Set(h.changes.map(c=>c.layer));
    for(const layer of touched) repaintLayer(layer);
  }else if(h.t==='clr'){
    for(const s of h.snapshot){ s.layer.strokes=s.strokes; repaintLayer(s.layer); }
  }
};
$('clr').onclick=()=>{
  clearLassoSel();
  const pg=activePage; if(!pg) return;
  if(!pg.inkLayers.length || !pg.inkLayers.some(l=>l.strokes.length)) return;
  pg.history.push({t:'clr',snapshot:pg.inkLayers.map(l=>({layer:l,strokes:l.strokes.slice()}))});
  for(const l of pg.inkLayers){ l.strokes=[]; repaintLayer(l); }
};

/* ---------------------------------------------------------------
   6. POINTER INPUT (drives pen / eraser / area-eraser / text-drag)
   --------------------------------------------------------------- */
const pos=e=>{const r=gp.el.getBoundingClientRect();return {x:(e.clientX-r.left)*gp.w/r.width,y:(e.clientY-r.top)*gp.h/r.height};};
const rawP=e=>e.pointerType==='pen'?(e.pressure>0?e.pressure:0.5):0.5;
const pres=e=>Math.max(0,Math.min(1,0.5+(rawP(e)-0.5)*(+$('sens').value)*2));
let ER=10; // stroke-eraser radius (set by the Eraser popup slider, section 15)

function eraseAt(q){
  // an arrowhead under the eraser is removed as a whole object (never partially erased), and then
  // only the head goes in this call -- the line it sits on is left alone
  let arrowGone=false;
  for(const layer of gp.inkLayers){
    let hit=false;
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i]; if(!sd.arrow) continue;
      const P=sd.pts, r=ER;
      let h=P.length>=4&&inPoly(q,P);
      for(let k=0;k<P.length&&!h;k++) if(snapSegDist(q,P[k],P[(k+1)%P.length])<=r) h=true;
      if(h){ layer.strokes.splice(i,1); erRemoved.push({layer,sd,index:i}); hit=true; arrowGone=true; }
    }
    if(hit) repaintLayer(layer);
  }
  if(arrowGone) return;
  for(const layer of gp.inkLayers){
    let hit=false;
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i]; if(sd.shape&&!eraseShapesOn) continue;
      const r=ER+sd.maxW/2,P=sd.pts;
      let h=P.length===1?dist(P[0],q)<=r:false;
      for(let k=1;k<P.length&&!h;k++){
        const a=P[k-1],b=P[k],dx=b.x-a.x,dy=b.y-a.y;
        const t=dx||dy?Math.max(0,Math.min(1,((q.x-a.x)*dx+(q.y-a.y)*dy)/(dx*dx+dy*dy))):0;
        if(dist(q,{x:a.x+t*dx,y:a.y+t*dy})<=r) h=true;
      }
      if(h){layer.strokes.splice(i,1);erRemoved.push({layer,sd,index:i});hit=true;}
    }
    if(hit) repaintLayer(layer);
  }
}

let erRemoved=null, txDraft=null, arDraft=null;
// Friction: the pen tip drags behind the stylus (a low-pass filter on position and pressure),
// which is what gives strokes their natural weighted, slightly lagging feel instead of tracking
// the raw pointer exactly. Applied to every point after the first (the stroke's start point is
// always placed exactly where you touch down, unfiltered).
function addPt(q,p){
  const f=+$('fric').value, l=cur.pts[cur.pts.length-1], k=1-f;
  const np={x:l.x+(q.x-l.x)*k,y:l.y+(q.y-l.y)*k,p:l.p+(p-l.p)*Math.max(k,0.15)};
  if(Math.hypot(np.x-l.x,np.y-l.y)<0.05) return; // ignore sub-pixel jitter
  cur.pts.push(np);
}
function onDown(e){
  const pg=pageOf(e.target); if(!pg) return; // pointer landed outside every page
  if(activeId===null) setActivePage(pg);
  // If the pointerdown actually landed on an existing box (text or image), let that
  // box's own handle/move/click handlers deal with it — never start a new gesture here.
  if(mode==='select'&&e.pointerType!=='touch'&&activeId===null&&lsSel&&lsSel.kind!=='single'&&lsSel.pg===pg&&!(e.target.closest&&e.target.closest('.handle,.fToolbar,.moveHandle,.sel-bar'))){
    const q0=pagePos(e,pg), b0=lsSel.box, m0=8; // drag inside a rectangle selection = move it
    if(q0.x>=b0.x0-m0&&q0.x<=b0.x1+m0&&q0.y>=b0.y0-m0&&q0.y<=b0.y1+m0){ e.preventDefault(); beginGesture(e,pg); lsMove={sx:q0.x,sy:q0.y,dx:0,dy:0}; return; }
  }
  if(e.target && e.target.closest && e.target.closest('.tbox')) return;
  // Fingers only navigate (scroll / pinch, see TOUCH NAVIGATION); pen and mouse do the actual work.
  if(e.pointerType==='touch') return;
  if(mode==='text'&&textSubMode==='add'){
    if(activeId!==null) return;
    e.preventDefault();
    deselectAll();
    beginGesture(e,pg);
    const q=pos(e);
    txDraft={x0:q.x,y0:q.y,x1:q.x,y1:q.y};
    showDragRect();
    return;
  }
  if(mode==='image') return; // images are only added via the file picker, not by drawing on the page
  if(mode==='text') return; // edit-existing sub-mode: selection is handled by each box's own click handler
  if(activeId!==null) return;
  e.preventDefault();
  beginGesture(e,pg);
  const q=pos(e);
  live.style.opacity=mode==='hl'?0.4:1;
  if(mode==='eraser'){ erRemoved=[]; eraseAt(q); return; }
  if(mode==='areaEraser'){ arDraft={pts:[q]}; drawAreaPreview(); return; }
  if(mode==='laser'){
    live.style.opacity=1;
    laser={pg:gp,pts:[{x:q.x,y:q.y}],down:true,upAt:0};
    lasers.push(laser);
    if(!laserRaf) laserRaf=requestAnimationFrame(laserFrame); return;
  }
  if(mode==='select'){ // drag on empty space = rectangle selection (clicks on boxes are handled by the click handler)
    clearLassoSel(); deselectAll(); selDraft={x0:q.x,y0:q.y,x1:q.x,y1:q.y}; drawRectPreview(); return;
  }
  if(mode==='lasso'){
    if(lsSel&&lsSel.pg!==pg) clearLassoSel();
    const b=lsSel&&lsSel.box, m=8;
    if(b&&q.x>=b.x0-m&&q.x<=b.x1+m&&q.y>=b.y0-m&&q.y<=b.y1+m){ lsMove={sx:q.x,sy:q.y,dx:0,dy:0}; return; }
    clearLassoSel(); lsDraft={pts:[q]}; drawLassoPreview(); return;
  }
  if(mode==='shape'){
    const w=SHP.w, st=SHP_OPEN[shapeKind]?'border':SHP.style; // shapes have their own border thickness (picker slider)
    shpDraft={x0:q.x,y0:q.y,x1:q.x,y1:q.y,moved:false};
    const bcol=SHP.bc||curColor, fcol=SHP.fc||curColor;
    cur={color:st==='fill'?fcol:bcol,maxW:w,minW:w,shape:shapeKind,op:SHP.op/100,fillOp:SHP.fillOp/100,
      fill:st==='border'?null:{color:fcol}, // fill has its own colour (pop-up palette)
      nb:st==='fill', // fill only: no border drawn
      pts:[{x:q.x,y:q.y,p:1}]}; return;
  }
  if(mode==='hl'){ cur={color:curColor,maxW:16,minW:16,alpha:0.4,pts:[{x:q.x,y:q.y,p:0.5}]}; return; }
  cur={color:curColor,maxW:+$('mx').value,minW:+$('mx').value*0.3,pts:[{x:q.x,y:q.y,p:pres(e)}]};
  holdArm(e);
}
function onMove(e){
  if(e.pointerId!==activeId) return;
  e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(txDraft){ const q=pos(e); txDraft.x1=q.x; txDraft.y1=q.y; showDragRect(); return; }
  if(arDraft){ for(const ev of evs) arDraft.pts.push(pos(ev)); drawAreaPreview(); return; }
  if(selDraft){ const q=pos(e); selDraft.x1=q.x; selDraft.y1=q.y; drawRectPreview(); return; }
  if(lsMove){
    const q=pos(e); lsMove.dx=q.x-lsMove.sx; lsMove.dy=q.y-lsMove.sy;
    for(const {layer,sd} of lsSel.items){ const el=layer.pathEls.get(sd); if(el) el.setAttribute('transform','translate('+lsMove.dx+' '+lsMove.dy+')'); }
    if(lsSel.boxes.length){ if(!lsMove.bs) lsMove.bs=lsSel.boxes.map(b=>({b,x:b.xPct,y:b.yPct})); const pg=lsSel.pg;
      for(const o of lsMove.bs){ o.b.xPct=o.x+lsMove.dx/pg.w*100; o.b.yPct=o.y+lsMove.dy/pg.h*100; applyBoxRect(o.b); } }
    lsShowBox(lsMove.dx,lsMove.dy); return;
  }
  if(lsDraft){ for(const ev of evs) lsDraft.pts.push(pos(ev)); drawLassoPreview(); return; }
  if(erRemoved){ for(const ev of evs) eraseAt(pos(ev)); return; }
  if(laser&&laser.down){ for(const ev of evs){ const q=pos(ev), l=laser.pts[laser.pts.length-1]; if(Math.hypot(q.x-l.x,q.y-l.y)>=0.8) laser.pts.push({x:q.x,y:q.y}); } return; }
  if(shpDraft&&cur){
    const q=pos(e); shpDraft.x1=q.x; shpDraft.y1=q.y;
    if(Math.hypot(q.x-shpDraft.x0,q.y-shpDraft.y0)>=4) shpDraft.moved=true;
    if(!shpDraft.moved) return;
    const pts=shapePts(shapeKind,shpDraft.x0,shpDraft.y0,q.x,q.y,e.shiftKey);
    if(pts&&pts.length>1){ cur.pts=pts; clearLive(); liveXform(); drawShapeLive(lctx,cur); }
    return;
  }
  if(!cur) return;
  if(holdSnapped) return; // already snapped by hold: ignore further movement until the pen lifts
  for(const ev of evs) addPt(pos(ev),pres(ev));
  clearLive();
  liveXform();
  drawStroke(lctx,cur);
  holdTrack(e);
}
function onUp(e){
  if(e.pointerId!==activeId) return;

function lsDelete(){

      const sd=layer.strokes[i];

  wrap.addEventListener('pointercancel',e=>{ taps.delete(e.pointerId); if(hold&&hold.id===e.pointerId) holdCancel(); });

function drawAreaPreview(){

function eraserPolys(pts,r,x0,y0,x1,y1){ // eraser path -> capsule polygons (circle per point + rectangle per segment) that can reach the box
  const out=[], N=20, P=[];
  for(let k=0;k<pts.length;k++){ const q=pts[k]; if(!P.length||k===pts.length-1||dist(q,P[P.length-1])>=r*0.5) P.push(q); } // thin dense points (speed)
  const hit=(ax,ay,bx,by)=>Math.max(ax,bx)+r>=x0&&Math.min(ax,bx)-r<=x1&&Math.max(ay,by)+r>=y0&&Math.min(ay,by)-r<=y1;
  for(let k=0;k<P.length;k++){
    const b=P[k];
    if(hit(b.x,b.y,b.x,b.y)){ const ring=[]; for(let j=0;j<N;j++){ const t=j/N*2*Math.PI; ring.push([b.x+r*Math.cos(t),b.y+r*Math.sin(t)]); } out.push([ring]); }
    if(k){
      const a=P[k-1], dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
      if(L>1e-6&&hit(a.x,a.y,b.x,b.y)){ const nx=-dy/L*r, ny=dx/L*r; out.push([[[a.x+nx,a.y+ny],[b.x+nx,b.y+ny],[b.x-nx,b.y-ny],[a.x-nx,a.y-ny]]]); }
    }
  }
  return out;
}
/* Area-erase a shape stroke. Fill: polygon-clipping difference (eraser capsules cut out of the fill polygon).
   Border: outline sampled every ~1.5px, points under the eraser dropped, the rest kept as open runs.
   A shape that still has fill becomes ONE 'fillpoly' stroke (fill rings + border runs, so the fill can still be masked out from under the border);
   a shape with no fill left becomes open 'polyline' strokes. Returns null if untouched, else the replacement strokes. */
function eraseShape(sd,nearPath,pathPts,radius){
  const fp=sd.shape==='fillpoly', mj=fp?(sd.mj?1:0):(SHP_MITER[sd.shape]?1:0);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,p:1});
  const toRun=(P,cl)=>cl?[mid(P[0],P[1]),...P.slice(1),P[0],mid(P[0],P[1])]:P; // closed outline -> run that starts/ends mid-edge (no corner at the seam)
  let rings=null, brd=null; // rings: fill rings [[x,y]..]; brd: border polylines [{P,closed}]
  if(fp){
    rings=[]; const runs=[];
    for(const q of sd.pts){
      if(q.p===2) rings.push([[q.x,q.y]]);
      else if(q.p===1){ if(rings.length) rings[rings.length-1].push([q.x,q.y]); }
      else if(q.p===3) runs.push([{x:q.x,y:q.y,p:1}]);
      else if(runs.length) runs[runs.length-1].push({x:q.x,y:q.y,p:1});
    }
    if(!sd.nb) brd=runs.map(P=>({P,closed:false}));
  }else{
    const V=shapeVerts(sd); if(V.length<2) return null;
    const cl=!SHP_OPEN[sd.shape];
    if(sd.fill&&cl&&V.length>2) rings=[V.map(q=>[q.x,q.y])];
    if(!sd.nb) brd=[{P:V,closed:cl}];
  }
  let fillRes=null; // null = fill untouched; array of rings (maybe empty) = fill changed
  if(rings&&rings.length&&rings[0].length>2){
    try{
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const r of rings) for(const q of r){ x0=Math.min(x0,q[0]); y0=Math.min(y0,q[1]); x1=Math.max(x1,q[0]); y1=Math.max(y1,q[1]); }
      const cut=eraserPolys(pathPts,radius,x0,y0,x1,y1);
      if(cut.length){
        const ar=r=>{ let a=0; for(let k=0;k<r.length;k++){ const p=r[k], q=r[(k+1)%r.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; };
        const area=mp=>mp.reduce((s,poly)=>s+poly.reduce((t,r,ri)=>t+(ri?-ar(r):ar(r)),0),0);
        const subject=rings.length===1?[rings]:polygonClipping.xor(...rings.map(r=>[r])); // evenodd rings -> proper outer/hole nesting
        const res=polygonClipping.difference(subject,...cut);
        if(Math.abs(area(subject)-area(res))>0.01){ fillRes=[]; for(const poly of res) for(const r of poly) fillRes.push(r.slice(0,-1)); }
      }
    }catch(err){ console.warn('area erase: fill clip failed',err); }
  }
  let runsOut=null; // null = border untouched
  if(brd){
    const out=[]; let touched=false;
    for(const {P,closed:cl} of brd){
      if(P.length<2) continue;
      const D=[], n=cl?P.length:P.length-1;
      for(let k=0;k<n;k++){ const a=P[k], b=P[(k+1)%P.length], m=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/1.5));
        for(let s=0;s<m;s++) D.push({x:a.x+(b.x-a.x)*s/m,y:a.y+(b.y-a.y)*s/m,p:1}); }
      if(!cl) D.push({x:P[P.length-1].x,y:P[P.length-1].y,p:1});
      let keep=D.map(q=>!nearPath(q)), E=D;
      if(keep.every(Boolean)){ out.push(toRun(P,cl)); continue; }
      touched=true;
      if(cl){ const f=keep.indexOf(false); E=D.slice(f).concat(D.slice(0,f)); keep=keep.slice(f).concat(keep.slice(0,f)); } // start on an erased point so runs never wrap
      let run=[];
      const flush=()=>{ if(run.length>=2){ const V2=shapeVerts({pts:run,shape:'polyline'}); if(V2.length>=2) out.push(V2); } run=[]; };
      for(let k=0;k<E.length;k++){ if(keep[k]) run.push(E[k]); else flush(); }
      flush();
    }
    if(touched) runsOut=out;
  }
  if(!fillRes&&!runsOut) return null;
  const fillRings=fillRes||rings, bruns=brd?(runsOut||brd.map(b=>toRun(b.P,b.closed))):[];
  const base={color:sd.color,maxW:sd.maxW,minW:sd.minW,op:sd.op,mj};
  if(!fillRings||!fillRings.length) // no fill left: just the border runs as open strokes
    return bruns.map(P=>({...base,shape:'polyline',fill:null,nb:false,pts:P.map(q=>({x:q.x,y:q.y,p:1}))}));
  const P=[];
  fillRings.forEach(r=>r.forEach((q,k)=>P.push({x:q[0],y:q[1],p:k?1:2})));
  bruns.forEach(run=>run.forEach((q,k)=>P.push({x:q.x,y:q.y,p:k?4:3})));
  return [{...base,shape:'fillpoly',fillOp:sd.fillOp,fill:sd.fill,nb:!bruns.length,pts:P}];
}
function applyAreaErase(pathPts,radius){
  const changes=[];
  const nearPath=pt=>{
    for(let k=0;k<pathPts.length;k++){
      if(k===0){ if(dist(pt,pathPts[0])<=radius) return true; continue; }
      const a=pathPts[k-1],b=pathPts[k],dx=b.x-a.x,dy=b.y-a.y;
      const t=dx||dy?Math.max(0,Math.min(1,((pt.x-a.x)*dx+(pt.y-a.y)*dy)/(dx*dx+dy*dy))):0;
      if(dist(pt,{x:a.x+t*dx,y:a.y+t*dy})<=radius) return true;
    }
    return false;
  };
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i], r=radius+sd.maxW/2;
      if(sd.shape){ // shapes: cut fill as a polygon, split the border (see eraseShape)
        if(!eraseShapesOn) continue; // Erase shapes off: shapes are protected
        const ns=eraseShape(sd,nearPath,pathPts,radius);
        if(ns){ changes.push({layer,index:i,oldSd:sd,newStrokes:ns}); layer.strokes.splice(i,1,...ns); }
        continue;
      }
      if(sd.arrow){ // arrowhead: any contact removes the whole head instead of cutting into its area
        if(arrowSamples(sd).some(nearPath)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); }
        continue;
      }
      const keep=sd.pts.map(pt=>!nearPath(pt));
      if(keep.every(Boolean)) continue;
      if(keep.every(v=>!v)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); continue; }
      const newStrokes=[]; let run=[];
      for(let k=0;k<sd.pts.length;k++){
        if(keep[k]) run.push(sd.pts[k]);
        else{ if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,pts:run}); run=[]; }
      }
      if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,pts:run});
      changes.push({layer,index:i,oldSd:sd,newStrokes});
      layer.strokes.splice(i,1,...newStrokes);
    }
  }
  if(changes.length){
    gp.history.push({t:'areaErase',changes});
    const touched=new Set(changes.map(c=>c.layer));
    for(const layer of touched) repaintLayer(layer);
  }
  clearLive();
}

function addHandle(box,dir){
  const h=document.createElement('span'); h.className='handle h-'+dir; box.el.appendChild(h);
  h.addEventListener('pointerdown',ev=>{
    ev.stopPropagation();ev.preventDefault();h.setPointerCapture(ev.pointerId);
    const startX=box.xPct/100*box.page.w,startY=box.yPct/100*box.page.h,startW=box.wPct/100*box.page.w,startH=box.hPct/100*box.page.h;

    const th=(box.rot||0)*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th), cx0=startX+startW/2, cy0=startY+startH/2;

  });
}

function renderMarkdownWithMath(md){
  const math=[];
  const stash=(expr,display)=>{const i=math.length;math.push({expr,display});return '\u0000MATH'+i+'\u0000';};
  let text=md.replace(/\$\$([\s\S]+?)\$\$/g,(m,e)=>'\n\n'+stash(e.trim(),true)+'\n\n');
  text=text.replace(/\$([^\$\n]+?)\$/g,(m,e)=>stash(e.trim(),false));
  let html=marked.parse(text);
  html=html.replace(/\u0000MATH(\d+)\u0000/g,(m,i)=>{
    const b=math[+i];
    try{ return katex.renderToString(b.expr,{throwOnError:false,displayMode:b.display}); }
    catch(_){ return (b.display?'$$':'$')+b.expr+(b.display?'$$':'$'); }
  });
  return html;
}

async function renderBase(pg){
  const gen=++pg.baseGen, s=pg.src;
  const stale=()=>pg.dead||gen!==pg.baseGen||!baseWanted.has(pg);
  try{
    const page=await s.doc.getPage(s.pageNum);
    if(stale()){ page.cleanup(); return; }
    let bs=Math.min(Math.max(dpr,1),3);
    bs=Math.min(bs,BASE_MAXDIM/Math.max(pg.w,pg.h),Math.sqrt(BASE_MAXPX/(pg.w*pg.h)));
    const vp=page.getViewport({scale:pg.w*bs/s.ptW});
    const c=document.createElement('canvas'); c.className='base';
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    const task=page.render({canvasContext:c.getContext('2d'),viewport:vp,background:'#ffffff'});
    pg.baseTask=task;
    await task.promise;
    page.cleanup();
    if(stale()){ c.width=c.height=0; return; }
    pg.stage.insertBefore(c,pg.stage.firstChild); // first child = underneath all ink and boxes
    pg.baseEl=c;
  }catch(e){
    if(pg.dead||(e&&e.name==='RenderingCancelledException')) return;
    pg.baseFail=true; console.error(e);
    $('st').textContent='Could not draw page '+s.pageNum+': '+(e&&e.message||e);
  }finally{ if(pg.baseGen===gen) pg.baseTask=null; }
}

function replaceAllPages(specs,file,doc){
  deselectAll();
  cur=null; txDraft=null; arDraft=null; erRemoved=null; activeId=null; gp=null;
  cancelTouch(); clearLive();
  // stop everything belonging to the old document before it is destroyed
  if(baseIO) baseIO.disconnect();
  baseWanted.clear();
  for(const p of pages){ p.dead=true; freeBase(p); }
  if(pdfDoc&&pdfDoc!==doc){ try{ pdfDoc.destroy(); }catch(_){} }
  pdfDoc=doc||null;
  for(const p of pages) p.el.remove();
  pages.length=0; pageByStage.clear(); elBoxMap.clear(); elLayerMap.clear();
  activePage=null; selectedBox=null;
  for(const s of specs){
    const pg=createPage(s.w,s.h);
    if(s.pageNum) pg.src={file,doc,pageNum:s.pageNum,ptW:s.ptW,ptH:s.ptH,rotate:s.rotate}; // used by 7c–7e / Step 9 (blank project pages have none)
  }
  activePage=pages[0];
  updatePageUI();
  wrap.scrollTop=0; wrap.scrollLeft=0;
  if(!zoomLocked){ // fit the widest page to the screen width (zooms in or out); saved projects then apply their own zoom
    const widest=Math.max(...pages.map(p=>p.w));
    setZoom(Math.max(ZMIN,Math.min(ZMAX,(wrap.clientWidth-32)/widest)));
  }
  if(baseIO) for(const p of pages) baseIO.observe(p.el);
  asNewDoc(file);
}
async function importPdfFile(file){

/* ---------------------------------------------------------------
   14. PROJECT SAVE / OPEN (.inkdown = zip)
   manifest.json            version, name, zoom, active page, pdf ref, pages:[{w,h,pdfPage,data}]
   pages/pNNN.json          that page's items in z-order: ink / text / image
   images/pN_K.<ext>        original image of each image box (crop stored in JSON)
   pdf/source.pdf           the imported PDF (if any)
   Open creates every page placeholder at once but only loads the active page +/- PROJ_WIN pages;
   the rest load as they scroll near. Loaded pages stay loaded (undo history / edits are kept).
   --------------------------------------------------------------- */
const PROJ_WIN=3;
let projZip=null, projName=null, projKey=null, projBusy=false;
const projHyd=new Set();
const MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'};
const EXT_BY_MIME={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'};
const r2=v=>Math.round(v*100)/100, r4=v=>Math.round(v*10000)/10000;
function setProjBtns(b){ $('saveProj').disabled=b; $('openProj').disabled=b; }
function splitDataUrl(u){ const i=u.indexOf(','), m=/^data:([^;,]+)/.exec(u.slice(0,i)); return {mime:m?m[1]:'image/png',b64:u.slice(i+1)}; }
async function zipDataUrl(zip,path){
  const f=zip.file(path); if(!f) throw new Error('Missing '+path);
  const ext=(path.split('.').pop()||'').toLowerCase();
  return 'data:'+(MIME_BY_EXT[ext]||'image/png')+';base64,'+await f.async('base64');
}
function cropUrl(orig,c){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(c.w)); cv.height=Math.max(1,Math.round(c.h));
      cv.getContext('2d').drawImage(im,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);
      res(cv.toDataURL(/^data:image\/png/.test(orig)?'image/png':'image/jpeg',0.92));
    };
    im.onerror=()=>rej(new Error('Could not decode an image'));
    im.src=orig;
  });
}

/* ---- load (lazy per page) ---- */
async function buildPageItems(pg,data,zip){
  for(const it of (data.items||[])){
    if(pg.dead) return;
    if(it.t==='ink'){
      const layer=newInkLayer(pg);
      layer.strokes=it.strokes.map(s=>{
        const {pts,...rest}=s, P=[];
        for(let i=0;i+2<pts.length;i+=3) P.push({x:pts[i],y:pts[i+1],p:pts[i+2]});
        return {...rest,pts:P};
      });
      repaintLayer(layer);
    }else if(it.t==='text'){
      const b=createBox(pg,0,0,10,10,true);
      Object.assign(b,{rot:it.rot||0,xPct:it.x,yPct:it.y,wPct:it.w,hPct:it.h,md:it.md||'',fontSize:it.fs||13,fontFamily:it.ff||'sans'});
      b.ta.value=b.md; applyBoxFont(b); applyBoxRect(b); renderBoxContent(b);
    }else if(it.t==='image'){
      const orig=await zipDataUrl(zip,it.file);
      const disp=it.crop?await cropUrl(orig,it.crop):orig;
      if(pg.dead) return;
      createImageBox(disp,it.ow,it.oh,{pg,props:{rot:it.rot||0,xPct:it.x,yPct:it.y,wPct:it.w,hPct:it.h,keepRatio:it.kr!==false,
        orig,origW:it.ow,origH:it.oh,crop:it.crop||null,origImg:Object.assign(new Image(),{src:orig}),
        ...(zip.__as?{assetId:it.file.split('.')[0],asExt:it.file.split('.').pop()}:{})}});
    }
  }
}
async function hydratePage(pg){
  if(!pg||!pg.pend||pg.dead||projHyd.has(pg)) return;
  projHyd.add(pg);
  const {zip,path}=pg.pend;
  try{
    const data=JSON.parse(await zip.file(path).async('string'));
    if(pg.dead||zip!==projZip) return;
    await buildPageItems(pg,data,zip);
    if(pg.dead) return;
    pg.pend=null; pg.el.classList.remove('pending'); pg.asCnt=asStrokes(pg);
  }catch(e){
    console.error(e); $('st').textContent='Could not load page '+(pages.indexOf(pg)+1)+': '+(e&&e.message||e);
  }finally{ projHyd.delete(pg); }
}
async function hydrateAround(i){
  await hydratePage(pages[i]);
  for(let d=1;d<=PROJ_WIN;d++){ await hydratePage(pages[i+d]); await hydratePage(pages[i-d]); }
}
async function hydrateAll(){ for(const p of pages) if(p.pend) await hydratePage(p); }
const projIO=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  for(const en of es){
    if(!en.isIntersecting) continue;
    const pg=pages.find(p=>p.el===en.target);
    if(pg&&pg.pend) hydrateAround(pages.indexOf(pg));
  }
},{root:wrap,rootMargin:'50% 0px 50% 0px'}):null;

async function openProjectFile(file){
  projBusy=true; setProjBtns(true);
  $('st').textContent='Opening project…';
  let doc=null;
  try{
    if(!file.__asZip&&!window.JSZip) throw new Error('ZIP library not loaded (check internet).');
    const zip=file.__asZip||await JSZip.loadAsync(file);
    const mf=zip.file('manifest.json'); if(!mf) throw new Error('not a valid .inkdown file.');
    const man=JSON.parse(await mf.async('string'));
    if(man.app!=='inkdown'||!Array.isArray(man.pages)||!man.pages.length) throw new Error('not a valid .inkdown file.');
    if(man.version>1) throw new Error('saved by a newer version of this app.');
    let pdfObj=null, r=null;
    if(man.pdf&&zip.file(man.pdf.file)){
      const bytes=await zip.file(man.pdf.file).async('uint8array');
      pdfObj=new File([bytes],man.pdf.name||'source.pdf',{type:'application/pdf'});
      r=await readPdfSizes(pdfObj); doc=r.doc;
    }
    const specs=man.pages.map(p=>{
      const s={w:p.w,h:p.h,pageNum:null}, q=(r&&p.pdfPage>0)?r.specs[p.pdfPage-1]:null;
      if(q){ s.pageNum=q.pageNum; s.ptW=q.ptW; s.ptH=q.ptH; s.rotate=q.rotate; }
      return s;
    });
    if(projIO) projIO.disconnect();
    projHyd.clear();
    replaceAllPages(specs,pdfObj,doc); doc=null;
    projZip=zip; projKey=pdfObj; projName=man.name||file.name.replace(/\.inkdown$/i,'');
    pages.forEach((pg,i)=>{ pg.pend={zip,path:man.pages[i].data}; pg.el.classList.add('pending'); });
    const ai=Math.min(Math.max(0,man.active|0),pages.length-1);
    await hydrateAround(ai);
    if(!zoomLocked&&man.zoom) setZoom(man.zoom);
    navUntil=performance.now()+900;
    setActivePage(pages[ai]);
    pages[ai].el.scrollIntoView({block:'start'});
    updatePageUI();
    if(projIO){ for(const p of pages) if(p.pend) projIO.observe(p.el); }
    else await hydrateAll(); // no IntersectionObserver: load everything
    $('st').textContent='Opened “'+projName+'” — '+pages.length+' page'+(pages.length>1?'s':'');
  }catch(err){
    if(doc){ try{ doc.destroy(); }catch(_){} }
    console.error(err);
    const n=err&&err.name;
    $('st').textContent='Open failed: '+(n==='PasswordException'?'the PDF inside is password-protected.':(err&&err.message||err));
  }finally{ projBusy=false; setProjBtns(false); }
}

/* ---- save ---- */
async function saveProject(){
  if(projBusy||importing||exporting||activeId!==null) return;
  if(!window.JSZip){ $('st').textContent='Save failed: ZIP library not loaded (check internet).'; return; }
  projBusy=true; setProjBtns(true);
  try{
    deselectAll();
    const zip=new JSZip(), n=pages.length;
    let pdfFile=null;
    for(const p of pages) if(p.src&&p.src.file){ pdfFile=p.src.file; break; }
    const safe=s=>s.replace(/[\\/:*?"<>|]+/g,'_').trim()||'notes';
    const name=safe((projName&&projKey===pdfFile)?projName:(pdfFile?pdfFile.name.replace(/\.pdf$/i,''):'notes'));
    const man={app:'inkdown',version:1,name,zoom:r4(zoom),active:Math.max(0,pages.indexOf(activePage)),pdf:null,pages:[]};
    if(pdfFile){ zip.file('pdf/source.pdf',pdfFile,{compression:'STORE'}); man.pdf={file:'pdf/source.pdf',name:pdfFile.name}; }
    for(let i=0;i<n;i++){
      $('st').textContent='Saving… page '+(i+1)+' / '+n;
      const pg=pages[i], pn='pages/p'+String(i+1).padStart(3,'0')+'.json';
      let k=0, data;
      const putImg=(mime,b64)=>{ const f='images/p'+(i+1)+'_'+(++k)+'.'+(EXT_BY_MIME[mime]||'png'); zip.file(f,b64,{base64:true,compression:'STORE'}); return f; };
      if(pg.pend){ // never loaded: copy from the opened zip (images renamed to this page's slot)
        data=JSON.parse(await pg.pend.zip.file(pg.pend.path).async('string'));
        for(const it of data.items||[]) if(it.t==='image'){
          const ext=(it.file.split('.').pop()||'png').toLowerCase();
          it.file=putImg(MIME_BY_EXT[ext]||'image/png',await pg.pend.zip.file(it.file).async('base64'));
        }
      }else{
        const items=[];
        for(const el of pg.stage.children){
          const layer=elLayerMap.get(el);
          if(layer){
            if(!layer.strokes.length) continue;
            items.push({t:'ink',strokes:layer.strokes.map(sd=>{
              const {pts,...rest}=sd, flat=[];
              for(const q of pts) flat.push(r2(q.x),r2(q.y),Math.round(q.p*1000)/1000);
              return {...rest,pts:flat};
            })});
            continue;
          }
          const b=elBoxMap.get(el); if(!b||b.page!==pg) continue;
          if(b.kind==='image'){
            const {mime,b64}=splitDataUrl(b.orig);
            items.push({t:'image',file:putImg(mime,b64),x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),rot:b.rot||0,
              kr:!!b.keepRatio,ow:b.origW,oh:b.origH,crop:b.crop?{x:b.crop.x,y:b.crop.y,w:b.crop.w,h:b.crop.h}:null});
          }else{
            items.push({t:'text',x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),rot:b.rot||0,
              md:el.classList.contains('editing')?b.ta.value:b.md,fs:b.fontSize,ff:b.fontFamily});
          }
        }
        data={items};
      }
      zip.file(pn,JSON.stringify(data));
      man.pages.push({w:pg.w,h:pg.h,pdfPage:pg.src?pg.src.pageNum:0,data:pn});
    }
    zip.file('manifest.json',JSON.stringify(man));
    $('st').textContent='Compressing…';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6},mimeType:'application/octet-stream'});
    const a=document.createElement('a'), u=URL.createObjectURL(blob);
    a.href=u; a.download=name+'.inkdown'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),10000);
    $('st').textContent='Saved '+name+'.inkdown ('+(blob.size/1048576).toFixed(2)+' MB)';
  }catch(err){
    console.error(err); $('st').textContent='Save failed: '+(err&&err.message||err);
  }finally{ projBusy=false; setProjBtns(false); }
}
$('saveProj').onclick=()=>saveProject();

/* ---- autosave (IndexedDB) + refresh guard + restore ---- */
/* Structure: notebook (nb1) > section (sec1) > pages > assets (pdf / images).  One IndexedDB record per page,
   images + the source PDF are stored once as assets. Autosave rewrites ONLY the changed page records. */
const AS_DB='inkdown-notes', AS_STROKES=30;
const AS_COLOR='#2563eb';   // default notebook / section color until the palette (D4) is chosen
let AS_NB='nb1', AS_SEC='sec1';   // current notebook / section: reassigned when the user switches (always after asFlushNow())
let asDbP=null, asDirty=new Set(), asTimer=0, asDue=0, asBusy=false, asAgain=false;
let asReset=false, asEpoch=0, asPdf=null, asRestoring=false, asHold=true, asAllowUnload=false;
const asUid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const asIdle=f=>('requestIdleCallback' in window)?requestIdleCallback(()=>f(),{timeout:2000}):setTimeout(f,0);
function asOpen(){
  return asDbP||(asDbP=new Promise((res,rej)=>{
    const r=indexedDB.open(AS_DB,2);
    r.onupgradeneeded=()=>{ const d=r.result, t=r.transaction;   // v1 -> v2 keeps all data; v2 adds sections.nb index
      const mk=(n,o)=>d.objectStoreNames.contains(n)?t.objectStore(n):d.createObjectStore(n,o);
      const ix=(s,n,k)=>{ if(!s.indexNames.contains(n)) s.createIndex(n,k); };
      mk('notebooks',{keyPath:'id'});
      ix(mk('sections',{keyPath:'id'}),'nb','notebookId');
      ix(mk('pages',{keyPath:'id'}),'sec','sectionId');
      ix(mk('assets',{keyPath:'id'}),'sec','sectionId');
      mk('settings',{keyPath:'key'});
    };
    r.onsuccess=()=>{ const d=r.result; d.onversionchange=()=>{ d.close(); asDbP=null; }; res(d); };   // never block another tab's upgrade
    r.onerror=()=>{ asDbP=null; rej(r.error); };
  }));
}
function asTx(names,mode,fn){
  return asOpen().then(db=>new Promise((res,rej)=>{
    const t=db.transaction(names,mode); let out;
    try{ out=fn(...names.map(n=>t.objectStore(n))); }catch(e){ try{ t.abort(); }catch(_){} return rej(e); }
    t.oncomplete=()=>res(out&&'result' in out?out.result:out); t.onerror=t.onabort=()=>rej(t.error);
  }));
}
const asB64Blob=(b64,mime)=>{ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); };
const asBlobB64=b=>new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(String(f.result).split(',')[1]||''); f.onerror=()=>rej(f.error); f.readAsDataURL(b); });
const asStrokes=pg=>pg.inkLayers.reduce((n,l)=>n+l.strokes.length,0);
// Replace the old records of this section (pages or assets) by new ones, atomically inside one transaction.
function asSwap(store,del,recs){
  const put=()=>{ for(const r of recs) store.put(r); };
  if(!del){ put(); return; }
  const q=store.index('sec').getAllKeys(AS_SEC);
  q.onsuccess=()=>{ for(const k of q.result) store.delete(k); put(); };
}
// Read-only view of the stored section that looks like a JSZip, so openProjectFile / hydratePage load from IndexedDB unchanged.
function asZipFor(sec){
  const man={app:'inkdown',version:1,name:sec.name,zoom:sec.zoom,active:sec.active,
    pdf:sec.pdf?{file:'pdf/source.pdf',name:sec.pdf.name}:null,
    pages:sec.pages.map(p=>({w:p.w,h:p.h,pdfPage:p.pdfPage,data:'page:'+p.id}))};
  return {__as:true,file(name){
    if(name==='pdf/source.pdf'&&!sec.pdf) return null;
    return {async:async type=>{
      if(name==='manifest.json') return JSON.stringify(man);
      if(name.startsWith('page:')){
        const r=await asTx(['pages'],'readonly',s=>s.get(name.slice(5)));
        if(!r) throw new Error('Missing page'); return r.json;
      }
      const a=await asTx(['assets'],'readonly',s=>s.get(name==='pdf/source.pdf'?sec.pdf.id:name.split('.')[0]));
      if(!a) throw new Error('Missing asset');
      if(type==='base64') return asBlobB64(a.blob);
      return new Uint8Array(await a.blob.arrayBuffer());
    }};
  }};
}
// A whole new document (PDF import / project open): the stored section is replaced on the next flush.
function asNewDoc(file){
  if(asRestoring) return;
  asEpoch++; asReset=true; asDirty.clear();
  asPdf=file?{file,id:null}:null;
  for(const pg of pages){ pg.id=null; pg.asLast=null; pg.asCnt=0; asDirty.add(pg); }
  asSchedule(1500);
}
function asSchedule(ms){
  if(asTimer&&asDue<=Date.now()+ms) return;
  clearTimeout(asTimer); asDue=Date.now()+ms;
  asTimer=setTimeout(()=>{ asTimer=0; asIdle(asFlush); },ms);
}
function asMark(pg,soon){
  if(!pg||pg.pend||pg.dead) return;
  asDirty.add(pg); asSchedule(soon?400:5000);
}
// Serialise one page. Images are written once as assets and referenced by id.
async function asPageRec(pg,assets,fresh,force){
  let items=[];
  if(pg.pend){
    if(pg.pend.zip.__as) return null;                 // untouched page already stored under its own id
    const d=JSON.parse(await pg.pend.zip.file(pg.pend.path).async('string'));
    items=d.items||[];
    for(const it of items) if(it.t==='image'){
      const ext=(it.file.split('.').pop()||'png').toLowerCase(), id=asUid();
      assets.push({id,sectionId:AS_SEC,kind:'image',blob:new Blob([await pg.pend.zip.file(it.file).async('uint8array')],{type:MIME_BY_EXT[ext]||'image/png'})});
      it.file=id+'.'+ext;
    }
  }else{
    for(const el of pg.stage.children){
      const layer=elLayerMap.get(el);
      if(layer){
        if(!layer.strokes.length) continue;
        items.push({t:'ink',strokes:layer.strokes.map(sd=>{
          const {pts,...rest}=sd, flat=[];
          for(const q of pts) flat.push(r2(q.x),r2(q.y),Math.round(q.p*1000)/1000);
          return {...rest,pts:flat};
        })});
        continue;
      }
      const b=elBoxMap.get(el); if(!b||b.page!==pg) continue;
      if(b.kind==='image'){
        if(!b.assetId){
          const {mime,b64}=splitDataUrl(b.orig);
          b.assetId=asUid(); b.asExt=EXT_BY_MIME[mime]||'png'; fresh.push(b);
          assets.push({id:b.assetId,sectionId:AS_SEC,kind:'image',blob:asB64Blob(b64,mime)});
        }
        items.push({t:'image',file:b.assetId+'.'+b.asExt,x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),rot:b.rot||0,
          kr:!!b.keepRatio,ow:b.origW,oh:b.origH,crop:b.crop?{x:b.crop.x,y:b.crop.y,w:b.crop.w,h:b.crop.h}:null});
      }else{
        items.push({t:'text',x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),rot:b.rot||0,
          md:el.classList.contains('editing')?b.ta.value:b.md,fs:b.fontSize,ff:b.fontFamily});
      }
    }
  }
  const json=JSON.stringify({items});
  if(!force&&pg.asLast===json) return null;           // nothing changed on this page
  return {id:pg.id,sectionId:AS_SEC,json,updated:Date.now(),_pg:pg};
}
async function asFlush(){
  asTimer=0;
  if(asHold||asDetached) return;
  if(asBusy){ asAgain=true; return; }
  if(cur||penDown||projBusy||importing||exporting){ asSchedule(800); return; }   // never while writing a stroke
  if(!asDirty.size&&!asReset&&!pages.some(p=>!p.id)) return;
  asBusy=true;
  const ep=asEpoch, reset=asReset; asReset=false;
  for(const pg of pages) if(!pg.id){ pg.id=asUid(); asDirty.add(pg); }
  const list=[...asDirty].filter(p=>pages.includes(p)); asDirty.clear();
  const assets=[], fresh=[], recs=[];
  try{
    for(const pg of list){
      const r=await asPageRec(pg,assets,fresh,reset||pg.asLast==null);
      if(ep!==asEpoch) return;                         // document was replaced meanwhile
      if(r) recs.push(r);
    }
    let pdfId=asPdf&&asPdf.id;
    if(asPdf&&!pdfId){ pdfId=asUid(); assets.push({id:pdfId,sectionId:AS_SEC,kind:'pdf',name:asPdf.file.name,blob:asPdf.file}); }
    const sec={id:AS_SEC,notebookId:AS_NB,name:asName||(asPdf?asPdf.file.name.replace(/\.pdf$/i,''):'Section 1'),order:0,
      pages:pages.map(p=>({id:p.id,w:p.w,h:p.h,pdfPage:p.src?p.src.pageNum:0})),
      pdf:asPdf?{id:pdfId,name:asPdf.file.name}:null,
      zoom:r4(zoom),active:Math.max(0,pages.indexOf(activePage)),hasContent:docHasContent(),updated:Date.now()};
    await asTx(['notebooks','sections','pages','assets','settings'],'readwrite',(nbS,secS,pgS,asS,stS)=>{
      asSwap(pgS,reset,recs.map(({_pg,...r})=>({...r,sectionId:AS_SEC})));
      asSwap(asS,reset,assets);
      // created / color are kept from the stored record; size = per-page JSON bytes (kept in pgSize) + asset bytes (estimate)
      const gs=secS.get(AS_SEC), gn=nbS.get(AS_NB), newAs=assets.reduce((n,a)=>n+((a.blob&&a.blob.size)||0),0);
      gs.onsuccess=()=>{
        const o=gs.result||{}, prev=reset?{}:(o.pgSize||{}), pgSize={}, now=Date.now();
        for(const p of sec.pages) pgSize[p.id]=prev[p.id]||0;
        for(const r of recs) pgSize[r.id]=r.json.length;
        const assetBytes=(reset?0:(o.assetBytes||0))+newAs;
        secS.put({...sec,name:o.name||sec.name,order:o.order!=null?o.order:0,created:o.created||now,color:o.color||AS_COLOR,pageCount:sec.pages.length,pgSize,assetBytes,
          size:Object.values(pgSize).reduce((a,b)=>a+b,0)+assetBytes});
      };
      gn.onsuccess=()=>{ const o=gn.result||{};
        nbS.put({...o,id:AS_NB,name:o.name||'Notebook 1',created:o.created||Date.now(),color:o.color||AS_COLOR,lastSec:AS_SEC,updated:Date.now()}); };
      stS.put({key:'current',notebookId:AS_NB,sectionId:AS_SEC});
    });
    for(const r of recs){ r._pg.asLast=r.json; r._pg.asCnt=asStrokes(r._pg); }
    if(asPdf) asPdf.id=pdfId;
    asAfterFlush();
  }catch(err){
    console.error('Autosave failed',err);
    if(err&&err.name==='QuotaExceededError') $('st').textContent='Your device is out of space, so autosave failed. Back up your work and free some space.';
    for(const b of fresh){ b.assetId=null; }
    for(const pg of list) asDirty.add(pg);
    if(reset) asReset=true;
    asSchedule(5000);
  }finally{
    asBusy=false; asTabs();
    if(asAgain||asDirty.size){ asAgain=false; asSchedule(300); }
  }
}
async function asFlushNow(){
  for(let i=0;i<30&&asBusy;i++) await new Promise(r=>setTimeout(r,100));
  await asFlush();
}
// Triggers: every 30 new strokes (immediately), image / text box / page added (~0.4 s), any other edit (5 s), tab hidden / closed (now).
function asAfterInput(a,b){
  let soon=false;
  for(const pg of new Set([a,b])){
    if(!pg||pg.pend||pg.dead) continue;
    asDirty.add(pg);
    if(Math.abs(asStrokes(pg)-(pg.asCnt||0))>=AS_STROKES) soon=true;
  }
  asSchedule(soon?50:5000);
}

// V85 stored the whole note as one blob in 'inkdown-auto'; it is read once and migrated into the new structure.
function asLegacy(){
  return new Promise(res=>{
    let fresh=false; const r=indexedDB.open('inkdown-auto');
    r.onupgradeneeded=()=>{ fresh=true; };
    r.onerror=()=>res(null);
    r.onsuccess=()=>{
      const db=r.result;
      if(fresh||!db.objectStoreNames.contains('s')){ db.close(); indexedDB.deleteDatabase('inkdown-auto'); return res(null); }
      const g=db.transaction('s').objectStore('s').get('last');
      g.onsuccess=()=>{ db.close(); res(g.result&&g.result.blob?g.result:null); };
      g.onerror=()=>{ db.close(); res(null); };
    };
  });
}

function hideLib(){ const h=$('home');

  else { const a=h.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.04)'}],{duration:750,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}); h._hl=a;
    a.onfinish=()=>{ if(h._hl===a){ h.hidden=true; a.cancel(); h._hl=null; } }; }
  if(!(history.state&&history.state.ed)) history.pushState({ed:1},''); }   // entering the editor = one history step, so the system Back button returns to the Library
function showLib(){ return asSettle().then(()=>homeRender()).then(()=>{ const h=$('home'); if(h._hl){ h._hl.cancel(); h._hl=null; } h.hidden=false; }); }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// make sure everything edited so far is on disk before the document is replaced
async function asSettle(){
  if(asHold||asDetached) return;
  for(let i=0;i<40;i++){
    if(asTimer){ clearTimeout(asTimer); asTimer=0; }
    await asFlushNow();
    if(!asBusy&&!asDirty.size&&!asReset&&!pages.some(p=>!p.id)) return;
    await new Promise(r=>setTimeout(r,100));
  }
}
async function asLoadSec(sec){
  asRestoring=true;
  try{ await openProjectFile({__asZip:asZipFor(sec),name:sec.name}); }finally{ asRestoring=false; }
  if(pages.length!==sec.pages.length) throw new Error('restore failed');
  pages.forEach((pg,i)=>{ pg.id=sec.pages[i].id; });
  const pf=pages.find(p=>p.src);
  asPdf=(sec.pdf&&pf)?{file:pf.src.file,id:sec.pdf.id}:null;
}
// switch the editor to another section (always: save first, then load)
async function asGo(nb,secId){
  if(asSwitching) return; asSwitching=true;
  try{
    await asSettle();
    asHold=true; AS_NB=nb; AS_SEC=secId; asDetached=false; asName=null; asPdf=null; asReset=false; asDirty.clear();
    const sec=await asTx(['sections'],'readonly',s=>s.get(secId));
    if(sec&&sec.pages&&sec.pages.length) await asLoadSec(sec); else replaceAllPages([{w:794,h:1123}],null,null);
    asHold=false; asSchedule(500);
    await asTx(['settings','notebooks'],'readwrite',(st,nbS)=>{
      st.put({key:'current',notebookId:nb,sectionId:secId});
      const g=nbS.get(nb); g.onsuccess=()=>{ if(g.result) nbS.put({...g.result,lastSec:secId}); };
    });
    hideLib();
  }catch(err){ console.error(err); $('st').textContent='Switch failed — autosave paused, saved data kept. Reload to retry.'; }
  finally{ asSwitching=false; asTabs(); }
}

async function asNewNb(name){

function asWipe(ids,nbId){

  });
}

// ---- V88: storage limit, warnings, persistent storage ----
const CAPS=[250,500,1024,2048,5120].map(m=>m*1048576), CAP_DEFAULT=1024*1048576;
var asLvl=0, asChkAt=0;
async function asStorageInfo(){
  const set=(await asTx(['settings'],'readonly',s=>s.get('storage')))||{key:'storage'};
  const cap=set.cap||CAP_DEFAULT;
  const secs=(await asTx(['sections'],'readonly',s=>s.getAll()))||[];
  const used=secs.reduce((a,x)=>a+(x.size||0),0);
  let est=null, persisted=false;
  try{ est=await navigator.storage.estimate(); }catch(_){}
  try{ persisted=await navigator.storage.persisted(); }catch(_){}
  return {set,cap,used,pct:used/cap*100,quota:est?est.quota:0,usage:est?est.usage:0,persisted};
}
async function asPersist(){
  let ok=false;
  try{ if(navigator.storage&&navigator.storage.persist) ok=(await navigator.storage.persisted())||(await navigator.storage.persist()); }catch(_){}
  const set=(await asTx(['settings'],'readonly',s=>s.get('storage')))||{key:'storage'};
  await asTx(['settings'],'readwrite',s=>s.put({...set,key:'storage',persistAsked:true}));
  return ok;
}
const ST_MSG=['','Your notebooks are using over 80% of the space you chose. Open the bell in the Library for details.','Space is almost full. Back up and delete old notebooks, or choose more space (bell in the Library).','You reached the space you chose. Your work is still being saved — back up and free some space.'];
async function asAfterFlush(){   // after a successful save: ask the browser for persistent storage once, and warn about the limit
  try{
    const now=Date.now(); if(now-asChkAt<30000) return; asChkAt=now;
    const si=await asStorageInfo();
    if(!si.set.persistAsked) asPersist();
    const lvl=si.pct>=100?3:si.pct>=95?2:si.pct>=80?1:0;
    if(lvl>asLvl||lvl===3) $('st').textContent=ST_MSG[lvl];
    asLvl=lvl;
  }catch(_){}
}

// ---- V88: backup. A stored section -> .inkdown (same layout as Save project); a notebook -> one ZIP of its sections ----
const safeName=t=>String(t).replace(/[\\/:*?"<>|]+/g,'_').trim()||'notes';
function dlBlob(blob,name){ const a=document.createElement('a'), u=URL.createObjectURL(blob); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),10000); }
async function asSectionZip(sec){
  const zip=new JSZip(), man={app:'inkdown',version:1,name:safeName(sec.name),zoom:sec.zoom,active:sec.active,pdf:null,pages:[]};
  if(sec.pdf){ const a=await asTx(['assets'],'readonly',s=>s.get(sec.pdf.id)); if(a){ zip.file('pdf/source.pdf',a.blob,{compression:'STORE'}); man.pdf={file:'pdf/source.pdf',name:sec.pdf.name}; } }

   15. SHAPE SNAP — on pen lift, a rough stroke becomes a clean line / circle / rectangle / square / triangle.
   No library: resample the stroke, fit each model, take the lowest error, reject scribbles.
   The result is an ordinary stroke (dense points, corners repeated so smoothing keeps them sharp),
   so undo / eraser / lasso / save / PDF export need no special handling.

/* HOLD TO SNAP — draw a rough shape and keep the pen down and still at the end: after HOLD_MS the stroke
   snaps to the clean shape (no snap on plain pen lift). Stylus jitter is tolerated: the pen counts as
   "still" while it stays within HOLD_R screen px of the anchor; moving further re-anchors and restarts
   the timer. Once snapped, the rest of that stroke is ignored until the pen lifts. */

function holdClear(){ if(holdT){ clearTimeout(holdT); holdT=0; } holdAnchor=null; }
function holdArm(e){
  holdClear(); holdSnapped=false;
  if(!snapOn||!cur||cur.alpha) return;
  holdAnchor={x:e.clientX,y:e.clientY};
  holdT=setTimeout(holdFire,HOLD_MS);
}
function holdTrack(e){
  if(!holdAnchor||holdSnapped) return;
  if(Math.hypot(e.clientX-holdAnchor.x,e.clientY-holdAnchor.y)>HOLD_R){
    holdAnchor={x:e.clientX,y:e.clientY};
    if(holdT) clearTimeout(holdT);
    holdT=setTimeout(holdFire,HOLD_MS);
  }
}
function holdFire(){
  holdT=0;
  if(!snapOn||!cur||cur.alpha||holdSnapped||activeId===null||shpDraft||cur.pts.length<2) return;
  const sp=snapShape(cur.pts); if(!sp) return; // not a recognisable shape: keep drawing as normal ink
  cur.pts=sp; holdSnapped=true;

}

function snapSegDist(p,a,b){

    if(ul>1e-6&&vl>3&&(vx*ux+vy*uy)/(vl*ul)<Math.cos(60*Math.PI/180)) e=kb; }

  // TANGENT at the end point E: weighted sum of the unit segment directions over the last ~18 units of
  // path (nearest segments weigh most) -- the direction the curve is actually heading at its end
  let tx=0, ty=0, ta=0;
  for(let i=e;i>0&&ta<18;i--){
    const sx=P[i].x-P[i-1].x, sy=P[i].y-P[i-1].y, sl=Math.hypot(sx,sy); if(sl<1e-6) continue;
    const w=1+2*(1-Math.min(ta,18)/18);

  let d=Math.hypot(tx,ty);
  if(d<1e-6){ tx=ux; ty=uy; d=ul; }

  const hx=tx/d, hy=ty/d, px=-hy, py=hx; // hx,hy = tangent (head direction); px,py = its normal

  const p=P[Math.max(0,e-8)].p; // pressure from the clean body, not the (often faint) pen-lift end
  // the base CENTRE of the head (middle of the wing line) sits exactly on E (the detected point near the end),
  // aligned with the tangent: tip = E + tangent*hl. The body keeps running on to the notch of the head.
  const s=hl/AH_LEN, T={x:E.x+hx*hl,y:E.y+hy*hl,p};

  const N=loc(AH_NOTCH,AH_TIP.y);
  const out=P.slice(0,e+1);
  const m=Math.max(1,Math.round(dist(E,N)/3));
  for(let i=1;i<=m;i++) out.push({x:E.x+(N.x-E.x)*i/m,y:E.y+(N.y-E.y)*i/m,p});

  const head={color:sd.color,maxW:sd.maxW,minW:sd.minW,arrow:true,pts:[loc(AH_TIP.x,AH_TIP.y),loc(AH_WING,AH_WING_Y1),N,loc(AH_WING,AH_WING_Y0)]};

}
/* DOUBLE-TAP ARROWHEAD — turns the end point of the last pen stroke into an arrowhead (one undo step) */
function addArrowToLast(){
  const pg=gp||activePage; if(!pg) return;
  const say=m=>{ $('st').textContent=m; };
  if(!arrowOn){ say('Arrowhead is off (Smart ink menu)'); return; }
  let h=null;
  for(let k=pg.history.length-1;k>=0;k--){ if(pg.history[k].t==='add'){ h=pg.history[k]; break; } }
  if(!h||!h.sd){ say('No stroke to add an arrowhead to'); return; }
  const sd=h.sd, layer=h.layer, i=layer.strokes.indexOf(sd);
  if(i<0||sd.alpha||sd.shape||sd.arrow){ say('No stroke to add an arrowhead to'); return; }
  if(layer.strokes[i+1]&&layer.strokes[i+1].arrow){ say('Last stroke already has an arrowhead'); return; }
  const ah=autoArrowHead(sd,true); if(!ah){ say('Last stroke is too short for an arrowhead'); return; }
  pg.history.push({t:'arrowhead',layer,sd,oldPts:sd.pts,head:ah.head});
