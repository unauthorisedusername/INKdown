<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stylus Ink — Demo</title>
<style>
/* ============================================================
   SECTION: THEME TOKENS
   ============================================================ */
:root{--bg:#f3f4f6;--bar:#ffffff;--fg:#111827;--bd:#d1d5db;--ac:#2563eb;--tb:#000000;
  --tb-bg:linear-gradient(180deg,#ffffff,#f3f4f7);--tb-solid:#f8f9fb;--tb-fg:#1f2937;--tb-mut:#6b7280;--tb-bd:#e3e6ec;
  --tb-hov:rgba(17,24,39,.07);--tb-pop:#ffffff;--tb-tip:#111827;--tb-tipfg:#f9fafb;--tb-track:#d3d7df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--bar:#1c1f27;--fg:#e5e7eb;--bd:#374151;--ac:#60a5fa;--tb:#000000;
  --tb-bg:linear-gradient(180deg,#1c1f27,#14161c);--tb-solid:#181b22;--tb-fg:#e5e7eb;--tb-mut:#9ca3af;--tb-bd:#2a2e39;
  --tb-hov:rgba(255,255,255,.08);--tb-pop:#1c1f27;--tb-tip:#f3f4f6;--tb-tipfg:#111827;--tb-track:#3a3f4d}}
:root[data-theme="dark"]{--bg:#111318;--bar:#1c1f27;--fg:#e5e7eb;--bd:#374151;--ac:#60a5fa;
  --tb-bg:linear-gradient(180deg,#1c1f27,#14161c);--tb-solid:#181b22;--tb-fg:#e5e7eb;--tb-mut:#9ca3af;--tb-bd:#2a2e39;
  --tb-hov:rgba(255,255,255,.08);--tb-pop:#1c1f27;--tb-tip:#f3f4f6;--tb-tipfg:#111827;--tb-track:#3a3f4d}

/* ============================================================
   SECTION: PAGE / LAYOUT SHELL
   ============================================================ */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;position:relative;overflow:auto;background:var(--bg);touch-action:none;overscroll-behavior:contain}
.page{position:relative;width:calc(var(--pw,794)*1px*var(--z,1));height:calc(var(--ph,1123)*1px*var(--z,1));margin:20px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
canvas{touch-action:none;user-select:none}

/* ============================================================
   SECTION: TOOLBAR (icon buttons, groups, sliders, swatches, status, tooltip)
   ============================================================ */
button,select{background:#171717;color:#f3f4f6;border:1px solid #333;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#262626}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
label{display:flex;align-items:center;gap:6px}

#bar{position:relative;z-index:50;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 2px;
  overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:var(--tb-bg);border-bottom:1px solid var(--tb-bd);box-shadow:0 6px 20px rgba(0,0,0,.14);color:var(--tb-fg);user-select:none;-webkit-user-select:none}
.grp{display:flex;align-items:center;gap:2px;flex:none;position:relative}
.vd{width:1px;height:22px;background:var(--tb-bd);margin:0 8px;flex:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;pointer-events:none;flex:none}

#bar .ib{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;min-width:36px;padding:0;
  background:transparent;border:1px solid transparent;border-radius:9px;color:var(--tb-fg);font:600 12px/1 system-ui;
  transition:background .15s,color .15s,box-shadow .15s,transform .1s}
#bar .ib:hover{background:var(--tb-hov)}
#bar .ib:active{transform:scale(.94)}
#bar .ib.on{background:var(--ac);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent)}
#bar .ib:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
#bar .ib.txt{width:auto;min-width:50px;padding:0 8px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
#bar #pgInd{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:0 4px;font:600 12px/1 system-ui;color:var(--tb-mut);text-align:center;font-variant-numeric:tabular-nums}
#bar #clr:hover{background:rgba(220,38,38,.14);color:#dc2626}
#bar #expPdf{background:var(--ac);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
#bar #expPdf:hover{filter:brightness(1.1);background:var(--ac)}

/* -- color swatches: fixed round size, never shrink -- */
#sws{display:flex;gap:8px;flex:none;align-items:center;padding:0 4px}
#bar .sw{flex:none;box-sizing:border-box;width:26px;height:26px;min-width:26px;min-height:26px;max-width:26px;max-height:26px;aspect-ratio:1/1;
  padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);
  transition:transform .12s,box-shadow .15s}
#bar .sw:hover{transform:scale(1.12)}
#bar .sw.on{border:1px solid rgba(0,0,0,.22);box-shadow:0 0 0 2px var(--tb-solid),0 0 0 4px var(--ac)}

/* -- sliders -- */
#bar .sl{display:flex;align-items:center;gap:7px;padding:0 8px;height:36px;border-radius:9px;color:var(--tb-mut);flex:none}
#bar .sl:hover{background:var(--tb-hov)}
#bar .sl output{min-width:26px;font:600 11px/1 system-ui;color:var(--tb-fg);font-variant-numeric:tabular-nums;text-align:right}
#bar input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:20px;margin:0;background:transparent;cursor:pointer}
#bar input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--p,50%),var(--tb-track) var(--p,50%))}
#bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#bar input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--tb-track)}
#bar input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--ac)}
#bar input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.35)}
#bar input[type=range]:focus{outline:none}

/* -- dropdown menus -- */
#bar::-webkit-scrollbar{display:none}
#bar .menu{display:none;position:fixed;top:0;left:0;max-width:calc(100vw - 8px);background:var(--tb-pop);border:1px solid var(--tb-bd);border-radius:12px;padding:5px;z-index:1000;white-space:nowrap;
  box-shadow:0 12px 32px rgba(0,0,0,.28);animation:menuIn .14s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#bar .mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;background:transparent;border:none;border-radius:8px;color:var(--tb-fg);font:500 13px/1 system-ui;text-align:left}
#bar .mi:hover{background:var(--tb-hov)}
#bar .mi+.mi{margin-top:2px}

/* -- thickness dots + settings popups (dot / eraser / area eraser) -- */
#dots{gap:8px;padding:0 4px}
#bar .td{flex:none;box-sizing:border-box;width:26px;height:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;border-radius:50%;transition:box-shadow .15s,background .15s}
#bar .td:hover{background:var(--tb-hov)}
#bar .td .dot{display:block;border-radius:50%;background:var(--tb-fg);pointer-events:none}
#bar .td.on{box-shadow:0 0 0 2px var(--tb-solid),0 0 0 4px var(--ac)}
#bar .pmenu{padding:8px 10px;cursor:default}
#bar .ptitle{font:600 11px/1 system-ui;color:var(--tb-mut);text-transform:uppercase;letter-spacing:.4px;padding:2px 4px 6px}
#bar .prow{display:flex;align-items:center;gap:6px;height:36px}
#bar .pl{width:66px;font:500 12px/1 system-ui;color:var(--tb-fg)}
#bar .pm{flex:none;width:26px;height:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--tb-bd);border-radius:7px;color:var(--tb-fg);font:600 15px/1 system-ui}
#bar .pm:hover{background:var(--tb-hov)}
#bar .prow output{min-width:32px;font:600 11px/1 system-ui;color:var(--tb-fg);font-variant-numeric:tabular-nums;text-align:right}

#bar .tg{flex:none;position:relative;width:38px;height:22px;padding:0;border-radius:11px;border:1px solid var(--tb-bd);background:var(--tb-hov);transition:background .15s}
#bar .tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tb-fg);transition:transform .15s}
#bar .tg.on{background:var(--ac);border-color:var(--ac)}
#bar .tg.on::after{transform:translateX(16px);background:#fff}

/* -- status text hidden: toolbar shows tools only (element kept so JS can still write to it) -- */
#st{display:none}

/* ============================================================
   SECTION: GLASS TOOLBAR (v52) — floating frosted capsule + frosted popups.
   The blur lives on #barGlass (a sibling layer), NOT on #bar, so #bar's fixed-position
   popup menus keep positioning against the viewport.
   ============================================================ */
:root{--gl-a:rgba(255,255,255,.42);--gl-b:rgba(255,255,255,.14);--gl-bd:rgba(255,255,255,.7);--gl-in:rgba(255,255,255,.9);--gl-pop:rgba(255,255,255,.7);--gl-sh:rgba(31,41,80,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl-a:rgba(60,68,92,.42);--gl-b:rgba(18,20,32,.2);--gl-bd:rgba(255,255,255,.16);--gl-in:rgba(255,255,255,.16);--gl-pop:rgba(28,31,44,.7);--gl-sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--gl-a:rgba(60,68,92,.42);--gl-b:rgba(18,20,32,.2);--gl-bd:rgba(255,255,255,.16);--gl-in:rgba(255,255,255,.16);--gl-pop:rgba(28,31,44,.7);--gl-sh:rgba(0,0,0,.5)}
body{background:radial-gradient(640px 220px at 10% 20px,color-mix(in srgb,var(--ac) 55%,transparent),transparent 78%),radial-gradient(600px 220px at 90% 10px,rgba(168,85,247,.45),transparent 78%),radial-gradient(520px 200px at 50% 70px,rgba(20,184,166,.32),transparent 78%),radial-gradient(640px 220px at 90% 100%,color-mix(in srgb,var(--ac) 55%,transparent),transparent 78%),radial-gradient(600px 220px at 10% 100%,rgba(168,85,247,.45),transparent 78%),radial-gradient(520px 200px at 50% calc(100% - 50px),rgba(20,184,166,.32),transparent 78%),var(--bg)}
body{position:relative}
#wrap{background:transparent;padding-top:calc(66px + env(safe-area-inset-top,0px))}
#barShell{position:absolute;top:0;left:0;right:0;z-index:50;border-radius:22px;
  margin:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
#barGlass{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(135deg,var(--gl-a),var(--gl-b));
  -webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.04);backdrop-filter:blur(18px) saturate(200%) brightness(1.04);
  border:1px solid var(--gl-bd);box-shadow:0 14px 38px var(--gl-sh),inset 0 1px 0 var(--gl-in),inset 0 -1px 0 rgba(255,255,255,.08)}
#barGlass::after{content:'';position:absolute;inset:4px;border-radius:18px;pointer-events:none;
  border:1px solid var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-in),0 0 0 1px rgba(255,255,255,.06)}
#barGlass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14) 100%)}
#bar{background:transparent;border-bottom:0;box-shadow:none;border-radius:20px;padding:6px 10px}
#bar .ib.open{background:var(--tb-hov);box-shadow:inset 0 0 0 1px var(--gl-bd)}
#bar .menu{background:var(--gl-pop);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--gl-bd);border-radius:16px;box-shadow:0 18px 44px var(--gl-sh),inset 0 1px 0 var(--gl-in)}
#bar .pmenu{min-width:240px;padding:8px 10px}
#bar .mi{border-radius:10px}
#bar .mi.on{background:transparent;color:var(--tb-fg)}
#bar .mi.on:hover{background:var(--tb-hov)}
#bar .mi:disabled{opacity:.4;cursor:default;background:transparent}
#bar .mi .mt{margin-left:auto;position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--tb-hov);border:1px solid var(--tb-bd);transition:background .15s}
#bar .mi .mt::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tb-fg);transition:transform .15s}
#bar .mi.on .mt{background:var(--ac);border-color:var(--ac)}
#bar .mi.on .mt::after{transform:translateX(14px);background:#fff}
#bar .mi.danger:hover{background:rgba(220,38,38,.14);color:#dc2626}
#bar #expPdf.mi{background:transparent;color:var(--tb-fg);box-shadow:none}
#bar #expPdf.mi:hover{background:var(--tb-hov);filter:none}
#bar .msep{height:1px;background:var(--tb-bd);margin:6px 4px}
#bar .pmenu .prow{padding:0 2px}

/* ============================================================
   SECTION: PREMIUM POLISH (v70) — refined glass capsule, soft pill buttons,
   luminous active state, gradient dividers, polished sliders/swatches/popups.
   Pure CSS override; no markup or JS changes.
   ============================================================ */
:root{--pm-hi:rgba(255,255,255,.85);--pm-lo:rgba(15,23,42,.10);--pm-well:rgba(255,255,255,.34);--pm-well-bd:rgba(255,255,255,.55);--pm-glow:color-mix(in srgb,var(--ac) 55%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pm-hi:rgba(255,255,255,.22);--pm-lo:rgba(0,0,0,.45);--pm-well:rgba(255,255,255,.06);--pm-well-bd:rgba(255,255,255,.10)}}
:root[data-theme="dark"]{--pm-hi:rgba(255,255,255,.22);--pm-lo:rgba(0,0,0,.45);--pm-well:rgba(255,255,255,.06);--pm-well-bd:rgba(255,255,255,.10)}
#barShell{border-radius:26px}
#barGlass{border-radius:26px;
  background:
    radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.38),transparent 55%),
    radial-gradient(100% 120% at 100% 100%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%),
    linear-gradient(135deg,var(--gl-a),var(--gl-b));
  -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  border:1px solid transparent;
  box-shadow:0 1px 0 var(--pm-hi) inset,0 -1px 0 var(--pm-lo) inset,0 0 0 1px var(--gl-bd),0 18px 44px var(--gl-sh)}
#barGlass::after{inset:0;border-radius:inherit;border:0;box-shadow:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 46%);
  -webkit-mask:linear-gradient(#000,transparent 70%);mask:linear-gradient(#000,transparent 70%)}
#barGlass::before{border-radius:inherit;
  background:linear-gradient(100deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 72%,rgba(255,255,255,.18) 100%)}
#bar{border-radius:26px;padding:7px 12px;gap:6px 4px}
.grp{gap:3px}
.vd{width:1px;height:26px;margin:0 10px;border-radius:1px;background:linear-gradient(180deg,transparent,var(--tb-bd) 30%,var(--tb-bd) 70%,transparent);opacity:.9}
#bar .ib{width:38px;height:38px;min-width:38px;border-radius:13px;border:1px solid transparent;
  transition:background .18s,color .18s,box-shadow .2s,transform .14s,border-color .18s}
#bar .ib:hover{background:var(--pm-well);border-color:var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset,0 4px 10px rgba(15,23,42,.08);transform:translateY(-1px)}
#bar .ib:active{transform:translateY(0) scale(.94)}
#bar .ib.on{color:#fff;border-color:rgba(255,255,255,.28);
  background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac) 55%,color-mix(in srgb,var(--ac) 80%,#000));
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -1px 0 rgba(0,0,0,.18) inset,0 6px 16px var(--pm-glow),0 1px 3px rgba(0,0,0,.2);transform:none}
#bar .ib.open{background:var(--pm-well);border-color:var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset,0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
#bar .ib .ic{width:19px;height:19px;stroke-width:1.7}
#bar #expPdf{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac) 60%,color-mix(in srgb,var(--ac) 78%,#000));border-color:rgba(255,255,255,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 6px 16px var(--pm-glow)}
#bar #clr:hover{background:rgba(220,38,38,.13);border-color:rgba(220,38,38,.25);color:#dc2626;box-shadow:none}
#bar #pgInd{min-width:50px;height:28px;border-radius:999px;background:var(--pm-well);border:1px solid var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset;color:var(--tb-fg)}
#bar .sw{width:24px;height:24px;min-width:24px;min-height:24px;max-width:24px;max-height:24px;border:1px solid rgba(0,0,0,.18);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -2px 3px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.18);transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
#bar .sw:hover{transform:scale(1.18)}
#bar .sw.on{transform:scale(1.08);border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),0 0 0 2px var(--tb-solid),0 0 0 3.5px var(--ac),0 4px 12px var(--pm-glow)}
#bar .td{border-radius:50%}
#bar .td:hover{background:var(--pm-well)}
#bar .td.on{background:var(--pm-well);box-shadow:0 0 0 1.5px var(--ac),0 3px 10px var(--pm-glow)}
#bar .sl{height:38px;padding:0 12px;border-radius:13px;background:var(--pm-well);border:1px solid var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset}
#bar .sl:hover{background:var(--pm-well)}
#bar input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
#bar input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5.5px;border:0;
  background:radial-gradient(circle at 35% 30%,#fff,#eef0f6 70%);box-shadow:0 0 0 2px var(--ac),0 3px 8px rgba(0,0,0,.3);transition:transform .15s}
#bar input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
#bar input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;background:#fff;box-shadow:0 0 0 2px var(--ac),0 3px 8px rgba(0,0,0,.3)}
#bar .menu{border-radius:20px;padding:7px;border:1px solid transparent;
  background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 40%),var(--gl-pop);
  -webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);
  box-shadow:0 0 0 1px var(--gl-bd),0 1px 0 var(--pm-hi) inset,0 22px 50px var(--gl-sh),0 4px 12px rgba(0,0,0,.08);
  animation:menuIn .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
#bar .mi{border-radius:12px;transition:background .15s,transform .12s}
#bar .mi:hover{background:var(--pm-well);box-shadow:0 0 0 1px var(--pm-well-bd) inset}
#bar .mi:active{transform:scale(.98)}
#bar .msep{height:1px;margin:6px 8px;background:linear-gradient(90deg,transparent,var(--tb-bd),transparent)}
#bar .ptitle{letter-spacing:.8px;padding:4px 6px 8px}
#bar .pm{border-radius:9px;background:var(--pm-well);border-color:var(--pm-well-bd);box-shadow:0 1px 0 var(--pm-hi) inset}
#bar .tg,#bar .mi .mt{box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
#bar .tg.on,#bar .mi.on .mt{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));box-shadow:0 0 10px var(--pm-glow)}
#tip{border-radius:10px;padding:7px 11px;box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.08) inset}
@media (pointer:coarse){#bar .ib{width:42px;height:42px;min-width:42px;border-radius:14px}#bar .sl{height:42px}#bar .sw{width:32px;height:32px;min-width:32px;min-height:32px;max-width:32px;max-height:32px}}

/* v72: circular hover/selected highlight on tool buttons */

let lsSel=null, lsDraft=null, lsMove=null; // lasso state (selection / loop being drawn / drag-move)
let mode='pen', cur=null, activeId=null;
let textSubMode=null; // null | 'add' | 'edit' — which Text box menu choice is active
const COLORS=['#111111','#2563eb','#dc2626','#16a34a','#f59e0b'];
const COLOR_NAMES=['Black','Blue','Red','Green','Amber'];

function setMode(m){

/* ---------------------------------------------------------------
   5. UNDO / CLEAR
   --------------------------------------------------------------- */
$('undo').onclick=()=>{
  const pg=activePage; if(!pg) return;
  const h=pg.history.pop(); if(!h) return;
  clearLassoSel();
  if(h.t==='move'){
    for(const {sd} of h.items) sd.pts=sd.pts.map(p=>({...p,x:p.x-h.dx,y:p.y-h.dy}));
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='recolor'){
    for(const it of h.items) it.sd.color=it.old;
    for(const l of new Set(h.items.map(i=>i.layer))) repaintLayer(l);
  }else if(h.t==='add'){
    const i=h.layer.strokes.indexOf(h.sd); if(i>=0) h.layer.strokes.splice(i,1);
    if(h.extra){ const j=h.layer.strokes.indexOf(h.extra); if(j>=0) h.layer.strokes.splice(j,1); }
    repaintLayer(h.layer);
  }else if(h.t==='erase'){
    const byLayer=new Map();
    for(const it of h.items){ if(!byLayer.has(it.layer)) byLayer.set(it.layer,[]); byLayer.get(it.layer).push(it); }
    for(const [layer,items] of byLayer){
      items.sort((a,b)=>a.index-b.index);
      for(const it of items) layer.strokes.splice(it.index,0,it.sd);
      repaintLayer(layer);
    }
  }else if(h.t==='areaErase'){
    for(const c of h.changes) c.layer.strokes.splice(c.index,c.newStrokes.length,c.oldSd);
    const touched=new Set(h.changes.map(c=>c.layer));
    for(const layer of touched) repaintLayer(layer);
  }else if(h.t==='clr'){
    for(const s of h.snapshot){ s.layer.strokes=s.strokes; repaintLayer(s.layer); }
  }
};
$('clr').onclick=()=>{
  clearLassoSel();
  const pg=activePage; if(!pg) return;
  if(!pg.inkLayers.length || !pg.inkLayers.some(l=>l.strokes.length)) return;
  pg.history.push({t:'clr',snapshot:pg.inkLayers.map(l=>({layer:l,strokes:l.strokes.slice()}))});
  for(const l of pg.inkLayers){ l.strokes=[]; repaintLayer(l); }
};

/* ---------------------------------------------------------------
   6. POINTER INPUT (drives pen / eraser / area-eraser / text-drag)
   --------------------------------------------------------------- */
const pos=e=>{const r=gp.el.getBoundingClientRect();return {x:(e.clientX-r.left)*gp.w/r.width,y:(e.clientY-r.top)*gp.h/r.height};};
const rawP=e=>e.pointerType==='pen'?(e.pressure>0?e.pressure:0.5):0.5;
const pres=e=>Math.max(0,Math.min(1,0.5+(rawP(e)-0.5)*(+$('sens').value)*2));
let ER=10; // stroke-eraser radius (set by the Eraser popup slider, section 15)

function eraseAt(q){
  // an arrowhead under the eraser is removed as a whole object (never partially erased), and then
  // only the head goes in this call -- the line it sits on is left alone
  let arrowGone=false;
  for(const layer of gp.inkLayers){
    let hit=false;
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i]; if(!sd.arrow) continue;
      const P=sd.pts, r=ER;
      let h=P.length>=4&&inPoly(q,P);
      for(let k=0;k<P.length&&!h;k++) if(snapSegDist(q,P[k],P[(k+1)%P.length])<=r) h=true;
      if(h){ layer.strokes.splice(i,1); erRemoved.push({layer,sd,index:i}); hit=true; arrowGone=true; }
    }
    if(hit) repaintLayer(layer);
  }
  if(arrowGone) return;
  for(const layer of gp.inkLayers){
    let hit=false;
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i],r=ER+sd.maxW/2,P=sd.pts;
      let h=P.length===1?dist(P[0],q)<=r:false;
      for(let k=1;k<P.length&&!h;k++){
        const a=P[k-1],b=P[k],dx=b.x-a.x,dy=b.y-a.y;
        const t=dx||dy?Math.max(0,Math.min(1,((q.x-a.x)*dx+(q.y-a.y)*dy)/(dx*dx+dy*dy))):0;
        if(dist(q,{x:a.x+t*dx,y:a.y+t*dy})<=r) h=true;
      }
      if(h){layer.strokes.splice(i,1);erRemoved.push({layer,sd,index:i});hit=true;}
    }
    if(hit) repaintLayer(layer);
  }
}

let erRemoved=null, txDraft=null, arDraft=null;
// Friction: the pen tip drags behind the stylus (a low-pass filter on position and pressure),
// which is what gives strokes their natural weighted, slightly lagging feel instead of tracking
// the raw pointer exactly. Applied to every point after the first (the stroke's start point is
// always placed exactly where you touch down, unfiltered).
function addPt(q,p){
  const f=+$('fric').value, l=cur.pts[cur.pts.length-1], k=1-f;
  const np={x:l.x+(q.x-l.x)*k,y:l.y+(q.y-l.y)*k,p:l.p+(p-l.p)*Math.max(k,0.15)};
  if(Math.hypot(np.x-l.x,np.y-l.y)<0.05) return; // ignore sub-pixel jitter
  cur.pts.push(np);
}
function onDown(e){
  const pg=pageOf(e.target); if(!pg) return; // pointer landed outside every page
  if(activeId===null) setActivePage(pg);
  // If the pointerdown actually landed on an existing box (text or image), let that
  // box's own handle/move/click handlers deal with it — never start a new gesture here.
  if(e.target && e.target.closest && e.target.closest('.tbox')) return;
  // Fingers only navigate (scroll / pinch, see TOUCH NAVIGATION); pen and mouse do the actual work.
  if(e.pointerType==='touch') return;
  if(mode==='text'&&textSubMode==='add'){
    if(activeId!==null) return;
    e.preventDefault();
    deselectAll();
    beginGesture(e,pg);
    const q=pos(e);
    txDraft={x0:q.x,y0:q.y,x1:q.x,y1:q.y};
    showDragRect();
    return;
  }
  if(mode==='select') return; // select tool: boxes handle their own clicks, nothing to draw
  if(mode==='image') return; // images are only added via the file picker, not by drawing on the page
  if(mode==='text') return; // edit-existing sub-mode: selection is handled by each box's own click handler
  if(activeId!==null) return;
  e.preventDefault();
  beginGesture(e,pg);
  const q=pos(e);
  live.style.opacity=mode==='hl'?0.4:1;
  if(mode==='eraser'){ erRemoved=[]; eraseAt(q); return; }
  if(mode==='areaEraser'){ arDraft={pts:[q]}; drawAreaPreview(); return; }
  if(mode==='lasso'){
    if(lsSel&&lsSel.pg!==pg) clearLassoSel();
    const b=lsSel&&lsSel.box, m=8;
    if(b&&q.x>=b.x0-m&&q.x<=b.x1+m&&q.y>=b.y0-m&&q.y<=b.y1+m){ lsMove={sx:q.x,sy:q.y,dx:0,dy:0}; return; }
    clearLassoSel(); lsDraft={pts:[q]}; drawLassoPreview(); return;
  }
  if(mode==='hl'){ cur={color:curColor,maxW:16,minW:16,alpha:0.4,pts:[{x:q.x,y:q.y,p:0.5}]}; return; }
  cur={color:curColor,maxW:+$('mx').value,minW:+$('mx').value*0.3,pts:[{x:q.x,y:q.y,p:pres(e)}]};
}
function onMove(e){
  if(e.pointerId!==activeId) return;
  e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(txDraft){ const q=pos(e); txDraft.x1=q.x; txDraft.y1=q.y; showDragRect(); return; }
  if(arDraft){ for(const ev of evs) arDraft.pts.push(pos(ev)); drawAreaPreview(); return; }
  if(lsMove){
    const q=pos(e); lsMove.dx=q.x-lsMove.sx; lsMove.dy=q.y-lsMove.sy;
    for(const {layer,sd} of lsSel.items){ const el=layer.pathEls.get(sd); if(el) el.setAttribute('transform','translate('+lsMove.dx+' '+lsMove.dy+')'); }
    lsShowBox(lsMove.dx,lsMove.dy); return;
  }
  if(lsDraft){ for(const ev of evs) lsDraft.pts.push(pos(ev)); drawLassoPreview(); return; }
  if(erRemoved){ for(const ev of evs) eraseAt(pos(ev)); return; }
  if(!cur) return;
  for(const ev of evs) addPt(pos(ev),pres(ev));
  clearLive();
  liveXform();
  drawStroke(lctx,cur);
}
function onUp(e){
  if(e.pointerId!==activeId) return;
  activeId=null;
  if(txDraft){
    const d=txDraft, x0=Math.min(d.x0,d.x1),x1=Math.max(d.x0,d.x1),y0=Math.min(d.y0,d.y1),y1=Math.max(d.y0,d.y1);
    hideDragRect(); txDraft=null;
    if(x1-x0>10&&y1-y0>10) createBox(gp,x0,y0,x1-x0,y1-y0);
    return;
  }
  if(arDraft){ const r=+$('arSize').value, pts=arDraft.pts; arDraft=null; applyAreaErase(pts,r); return; }
  if(lsMove){
    const {dx,dy}=lsMove; lsMove=null;
    const touched=new Set(lsSel.items.map(i=>i.layer));
    if(Math.abs(dx)+Math.abs(dy)>=0.5){
      for(const {sd} of lsSel.items) sd.pts=sd.pts.map(p=>({...p,x:p.x+dx,y:p.y+dy}));
      gp.history.push({t:'move',items:lsSel.items.slice(),dx,dy});
      const b=lsSel.box; lsSel.box={x0:b.x0+dx,y0:b.y0+dy,x1:b.x1+dx,y1:b.y1+dy};
    }
    for(const l of touched) repaintLayer(l); // drops the temporary drag transform
    lsShowBox(); return;
  }
  if(lsDraft){ finishLasso(); return; }
  if(erRemoved){ if(erRemoved.length) gp.history.push({t:'erase',items:erRemoved}); erRemoved=null; return; }
  if(!cur) return;
  if(cur.pts.length<2) cur.pts.push({...cur.pts[0]});
  if(scribOn&&!cur.alpha&&scribbleErase(cur.pts)) return; // scribble over existing ink: erase it (undoable), scribble itself is dropped
  if(snapOn&&!cur.alpha){ const sp=snapShape(cur.pts); if(sp) cur.pts=sp; } // pen lift: rough line/circle/rect/square/triangle -> clean shape
  let headSd=null;
  if(!cur.alpha){ const ah=autoArrowHead(cur); if(ah){ cur.pts=ah.body; headSd=ah.head; } } // large start->end displacement = connector -> add arrowhead
  const layer=(cur.alpha&&gp.inkLayers.length)?gp.inkLayers[0]:topInkLayer(gp); // highlighter -> lowest ink layer
  layer.strokes.push(cur); if(headSd) layer.strokes.push(headSd);
  gp.history.push({t:'add',layer,sd:cur,extra:headSd});
  cur=null;
  clearLive(); repaintLayer(layer);
}
wrap.addEventListener('click',e=>{
  if(!pageOf(e.target)) return;
  if(mode==='text'&&textSubMode==='edit'&&!(e.target&&e.target.closest&&e.target.closest('.tbox'))) deselectAll();

// Tap/click outside any box (anywhere in the canvas area) unselects it. Uses pointerdown, because on
// touch screens the stage suppresses touchstart, which also suppresses the click event.
$('wrap').addEventListener('pointerdown',e=>{

},true);
wrap.addEventListener('pointerdown',onDown);
wrap.addEventListener('pointermove',onMove);
wrap.addEventListener('pointerup',onUp);
wrap.addEventListener('pointercancel',onUp);
['touchstart','touchmove'].forEach(t=>wrap.addEventListener(t,e=>{
  if(!pageOf(e.target)) return;
  // Never block touches on boxes/toolbars: preventDefault on touchstart cancels the synthesized
  // click, which is what killed Render/Edit/Delete and textarea focus on touch screens.
  if(e.target&&e.target.closest&&e.target.closest('.tbox')) return;
  e.preventDefault();
},{passive:false}));

/* ---------------------------------------------------------------
   7. AREA ERASER — grey preview only while dragging (cheap),
   real split-erase applied on release
   --------------------------------------------------------------- */
/* LASSO — select strokes by circling them; move / delete the selection */
function inPoly(p,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) c=!c;
  }
  return c;
}
function lsBounds(items){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const {sd} of items){ const h=sd.maxW/2; for(const p of sd.pts){ x0=Math.min(x0,p.x-h); y0=Math.min(y0,p.y-h); x1=Math.max(x1,p.x+h); y1=Math.max(y1,p.y+h); } }
  return {x0,y0,x1,y1};
}
function lsShowBox(dx=0,dy=0){
  const s=lsSel; if(!s) return;
  const pg=s.pg;
  if(!pg.lsBox){
    const d=document.createElement('div'); d.className='ls-box';
    const x=document.createElement('button'); x.className='ls-del'; x.textContent='✕'; x.setAttribute('aria-label','Delete selection');
    x.addEventListener('pointerdown',e=>e.stopPropagation());
    x.addEventListener('click',e=>{ e.stopPropagation(); lsDelete(); });
    d.appendChild(x); pg.el.appendChild(d); pg.lsBox=d;
  }
  const b=s.box, d=pg.lsBox;
  d.style.left=((b.x0+dx)/pg.w*100)+'%'; d.style.top=((b.y0+dy)/pg.h*100)+'%';
  d.style.width=((b.x1-b.x0)/pg.w*100)+'%'; d.style.height=((b.y1-b.y0)/pg.h*100)+'%';
  d.style.display='block';
}
function clearLassoSel(){
  if(lsSel&&lsSel.pg.lsBox) lsSel.pg.lsBox.style.display='none';
  lsSel=null; lsDraft=null; lsMove=null;
}
function drawLassoPreview(){
  clearLive(); liveXform();
  const k=gp.el.getBoundingClientRect().width/gp.w, pts=lsDraft.pts;
  lctx.strokeStyle='#2563eb'; lctx.fillStyle='rgba(37,99,235,.08)';
  lctx.lineWidth=1.5/k; lctx.setLineDash([6/k,4/k]); lctx.lineJoin='round';
  lctx.beginPath(); lctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) lctx.lineTo(pts[i].x,pts[i].y);
  lctx.fill(); lctx.stroke();
}
function finishLasso(){
  const poly=lsDraft.pts; lsDraft=null; clearLive();
  if(poly.length<3) return;
  const items=[];
  for(const layer of gp.inkLayers) for(const sd of layer.strokes){
    let n=0; for(const p of sd.pts) if(inPoly(p,poly)) n++;
    if(n>=sd.pts.length*0.5) items.push({layer,sd});
  }
  if(!items.length) return;
  lsSel={pg:gp,items,box:lsBounds(items)};
  lsShowBox();
}
function lsDelete(){
  if(!lsSel) return;
  const keep=new Set(lsSel.items.map(i=>i.sd)), removed=[], touched=new Set(lsSel.items.map(i=>i.layer)), pg=lsSel.pg;
  for(const layer of touched){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i];
      if(keep.has(sd)){ layer.strokes.splice(i,1); removed.push({layer,sd,index:i}); }
    }
  }
  if(removed.length) pg.history.push({t:'erase',items:removed});
  for(const l of touched) repaintLayer(l);
  clearLassoSel();
}
window.addEventListener('keydown',e=>{
  if(!lsSel||mode!=='lasso') return;
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='Escape'){ clearLassoSel(); return; }
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); lsDelete(); }
});

/* DOUBLE-TAP QUICK MENU — a single-finger double tap opens Undo / Eraser / Pen next to the finger */
(function(){
  const menu=document.createElement('div'); menu.className='dt-menu';
  const mk=(id,icon,label)=>{ const b=document.createElement('button'); b.className='dt-b'; b.id=id; b.setAttribute('aria-label',label);
    b.innerHTML='<svg class="ic"><use href="#'+icon+'"/></svg>'; menu.appendChild(b); return b; };
  const bUndo=mk('dtUndo','i-undo','Undo'), bEr=mk('dtEr','i-eraser','Eraser'), bPen=mk('dtPen','i-pen','Pen'),
        bSel=mk('dtSel','i-sel','Select'), bLs=mk('dtLs','i-lasso','Lasso');
  document.body.appendChild(menu);
  const hide=()=>{ menu.style.display='none'; };
  const sync=()=>{ bEr.classList.toggle('on',mode==='eraser'); bPen.classList.toggle('on',mode==='pen');
    bSel.classList.toggle('on',mode==='select'); bLs.classList.toggle('on',mode==='lasso'); };
  const DT_GAP=90, DT_ANGLE=135; // px from the tap to the popup's nearest edge; degrees (0=right, 90=straight up, 135=up-left)
  const show=(x,y)=>{
    sync(); menu.style.display='flex';
    const w=menu.offsetWidth, h=menu.offsetHeight, a=DT_ANGLE*Math.PI/180;
    const cx=x+Math.cos(a)*(DT_GAP+w/2), cy=y-Math.sin(a)*(DT_GAP+h/2);
    menu.style.left=Math.max(8,Math.min(innerWidth-w-8,cx-w/2))+'px';
    menu.style.top=Math.max(8,Math.min(innerHeight-h-8,cy-h/2))+'px';
  };
  bUndo.onclick=()=>$('undo').click();                  // stays open so you can undo several times
  bEr.onclick=()=>{ setMode('eraser'); hide(); };
  bPen.onclick=()=>{ setMode('pen'); hide(); };
  bSel.onclick=()=>{ setMode('select'); hide(); };
  bLs.onclick=()=>{ setMode('lasso'); hide(); };
  document.addEventListener('pointerdown',e=>{ if(!menu.contains(e.target)) hide(); },true);
  const taps=new Map(); // pointerId -> {t,x,y,bad}; every finger is tracked on its own, so a resting palm can't block a tap
  let lastTap=null;
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const palm=Math.max(e.width||0,e.height||0)>45; // very large contact = palm, never a tap
    const bad=palm||activeId!==null||!!(e.target.closest&&e.target.closest('.tbox'));
    taps.set(e.pointerId,{t:performance.now(),x:e.clientX,y:e.clientY,bad});
  });
  wrap.addEventListener('pointermove',e=>{
    if(e.pointerType==='pen'&&e.buttons===0&&activeId===null){ penDown=false; return; } // hovering, not touching
    const s=taps.get(e.pointerId);
    if(s&&Math.hypot(e.clientX-s.x,e.clientY-s.y)>10) s.bad=true;
  });
  wrap.addEventListener('pointerup',e=>{
    if(e.pointerType!=='touch') return;
    const s=taps.get(e.pointerId); taps.delete(e.pointerId);
    if(!s) return;
    if(s.bad||performance.now()-s.t>300){ return; }
    const now=performance.now();
    if(lastTap&&now-lastTap.t<350&&Math.hypot(s.x-lastTap.x,s.y-lastTap.y)<60){ lastTap=null; show(s.x,s.y); }
    else lastTap={t:now,x:s.x,y:s.y};
  });
  wrap.addEventListener('pointercancel',e=>{ taps.delete(e.pointerId); });
})();

function drawAreaPreview(){
  clearLive();
  liveXform();
  const pts=arDraft.pts, r=+$('arSize').value;
  lctx.strokeStyle='rgba(120,120,120,0.45)';
  lctx.fillStyle='rgba(120,120,120,0.45)';
  lctx.lineCap='round'; lctx.lineJoin='round'; lctx.lineWidth=r*2;
  if(pts.length<2){
    lctx.beginPath(); lctx.arc(pts[0].x,pts[0].y,r,0,Math.PI*2); lctx.fill(); return;
  }
  lctx.beginPath(); lctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) lctx.lineTo(pts[i].x,pts[i].y);
  lctx.stroke();
}
function applyAreaErase(pathPts,radius){
  const changes=[];
  const nearPath=pt=>{
    for(let k=0;k<pathPts.length;k++){
      if(k===0){ if(dist(pt,pathPts[0])<=radius) return true; continue; }
      const a=pathPts[k-1],b=pathPts[k],dx=b.x-a.x,dy=b.y-a.y;
      const t=dx||dy?Math.max(0,Math.min(1,((pt.x-a.x)*dx+(pt.y-a.y)*dy)/(dx*dx+dy*dy))):0;
      if(dist(pt,{x:a.x+t*dx,y:a.y+t*dy})<=radius) return true;
    }
    return false;
  };
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){
      const sd=layer.strokes[i], r=radius+sd.maxW/2;
      if(sd.arrow){ // arrowhead: any contact removes the whole head instead of cutting into its area
        if(arrowSamples(sd).some(nearPath)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); }
        continue;
      }
      const keep=sd.pts.map(pt=>!nearPath(pt));
      if(keep.every(Boolean)) continue;
      if(keep.every(v=>!v)){ changes.push({layer,index:i,oldSd:sd,newStrokes:[]}); layer.strokes.splice(i,1); continue; }
      const newStrokes=[]; let run=[];
      for(let k=0;k<sd.pts.length;k++){
        if(keep[k]) run.push(sd.pts[k]);
        else{ if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,pts:run}); run=[]; }
      }
      if(run.length>=2) newStrokes.push({color:sd.color,maxW:sd.maxW,minW:sd.minW,alpha:sd.alpha,pts:run});
      changes.push({layer,index:i,oldSd:sd,newStrokes});
      layer.strokes.splice(i,1,...newStrokes);
    }
  }
  if(changes.length){
    gp.history.push({t:'areaErase',changes});
    const touched=new Set(changes.map(c=>c.layer));
    for(const layer of touched) repaintLayer(layer);
  }
  clearLive();
}

function addHandle(box,dir){
  const h=document.createElement('span'); h.className='handle h-'+dir; box.el.appendChild(h);
  h.addEventListener('pointerdown',ev=>{
    ev.stopPropagation();ev.preventDefault();h.setPointerCapture(ev.pointerId);
    const startX=box.xPct/100*box.page.w,startY=box.yPct/100*box.page.h,startW=box.wPct/100*box.page.w,startH=box.hPct/100*box.page.h;
    const p0=pagePos(ev,box.page), MIN=20;
    const onM=e2=>{
      const p=pagePos(e2,box.page), dx=p.x-p0.x, dy=p.y-p0.y;
      let nx=startX,ny=startY,nw=startW,nh=startH;
      if(dir.includes('w')){nx=startX+dx;nw=startW-dx;}
      if(dir.includes('e')){nw=startW+dx;}
      if(dir.includes('n')){ny=startY+dy;nh=startH-dy;}
      if(dir.includes('s')){nh=startH+dy;}
      if(box.kind==='image'&&box.keepRatio&&dir.length===2){ // ratio lock: corners scale uniformly, edges still stretch
        let s=(nw/startW+nh/startH)/2;
        s=Math.max(s,MIN/startW,MIN/startH);
        nw=startW*s; nh=startH*s;
        nx=dir.includes('w')?startX+startW-nw:startX;
        ny=dir.includes('n')?startY+startH-nh:startY;
      }
      if(nw<MIN){if(dir.includes('w')) nx=startX+startW-MIN; nw=MIN;}
      if(nh<MIN){if(dir.includes('n')) ny=startY+startH-MIN; nh=MIN;}
      box.xPct=nx/box.page.w*100;box.yPct=ny/box.page.h*100;box.wPct=nw/box.page.w*100;box.hPct=nh/box.page.h*100;
      applyBoxRect(box);
    };
    const onU=()=>{h.removeEventListener('pointermove',onM);h.removeEventListener('pointerup',onU);h.removeEventListener('pointercancel',onU);};
    h.addEventListener('pointermove',onM);h.addEventListener('pointerup',onU);h.addEventListener('pointercancel',onU);
  });
}
function addMoveHandle(box){
  const m=document.createElement('span'); m.className='moveHandle'; m.textContent='✥'; box.el.appendChild(m);
  m.addEventListener('pointerdown',ev=>{
    ev.stopPropagation();ev.preventDefault();m.setPointerCapture(ev.pointerId);
    const startX=box.xPct/100*box.page.w,startY=box.yPct/100*box.page.h, p0=pagePos(ev,box.page);
    const onM=e2=>{const p=pagePos(e2,box.page);box.xPct=(startX+p.x-p0.x)/box.page.w*100;box.yPct=(startY+p.y-p0.y)/box.page.h*100;applyBoxRect(box);};
    const onU=()=>{m.removeEventListener('pointermove',onM);m.removeEventListener('pointerup',onU);m.removeEventListener('pointercancel',onU);};
    m.addEventListener('pointermove',onM);m.addEventListener('pointerup',onU);m.addEventListener('pointercancel',onU);
  });
}

function renderMarkdownWithMath(md){
  const math=[];
  const stash=(expr,display)=>{const i=math.length;math.push({expr,display});return '\u0000MATH'+i+'\u0000';};
  let text=md.replace(/\$\$([\s\S]+?)\$\$/g,(m,e)=>'\n\n'+stash(e.trim(),true)+'\n\n');
  text=text.replace(/\$([^\$\n]+?)\$/g,(m,e)=>stash(e.trim(),false));
  let html=marked.parse(text);
  html=html.replace(/\u0000MATH(\d+)\u0000/g,(m,i)=>{
    const b=math[+i];
    try{ return katex.renderToString(b.expr,{throwOnError:false,displayMode:b.display}); }
    catch(_){ return (b.display?'$$':'$')+b.expr+(b.display?'$$':'$'); }
  });
  return html;
}
function fillRendered(rd,md){
  try{ rd.innerHTML=renderMarkdownWithMath(md); }
  catch(_){ rd.textContent=md; }
  // links are display-only: swap every <a> for a plain span so nothing can navigate away
  rd.querySelectorAll('a').forEach(a=>{
    const sp=document.createElement('span'); sp.className='lnk'; sp.innerHTML=a.innerHTML; a.replaceWith(sp);
  });
}
function renderBoxContent(box){

function createBox(pg,x,y,w,h,noEdit){

  const ratioBtn=mk('fRatio on',TB_ICON.ratio,'Keep aspect ratio when dragging corners');

  cancelBtn.addEventListener('click',ev=>{ ev.stopPropagation(); ev.preventDefault(); if(box.endCrop) box.endCrop(false); });

/* CROP — shows the full original dimmed with a draggable crop rectangle; Apply bakes the region into box.dataUrl

  const dim=document.createElement('div'); dim.className='cropDim';

  const cr=document.createElement('div'); cr.className='cropRect';
  ui.append(dim,cr); el.appendChild(ui);
  const paint=()=>{ for(const e of [hole,cr]){ e.style.left=c.x/W*100+'%'; e.style.top=c.y/H*100+'%'; e.style.width=c.w/W*100+'%'; e.style.height=c.h/H*100+'%'; } };

    target.addEventListener('pointerdown',ev=>{
      ev.stopPropagation(); ev.preventDefault(); target.setPointerCapture(ev.pointerId);

  paint();

    box.endCrop=null; ui.remove(); el.classList.remove('cropping');
    if(apply){
      if(c.x<=0.5&&c.y<=0.5&&c.w>=W-0.5&&c.h>=H-0.5){ box.crop=null; box.dataUrl=box.orig; }
      else{
        const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(c.w)); cv.height=Math.max(1,Math.round(c.h));

        box.crop={...c}; box.dataUrl=cv.toDataURL(/^data:image\/png/.test(box.orig)?'image/png':'image/jpeg',0.92);
      }
      box.xPct+=c.x*s/pg.w*100; box.yPct+=c.y*s/pg.h*100; box.wPct=c.w*s/pg.w*100; box.hPct=c.h*s/pg.h*100;
    }else Object.assign(box,saved);
    img.src=box.dataUrl; applyBoxRect(box);
  };
}
function removeImageBox(box){

function loadAndAddImage(file){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight, outUrl=reader.result;
      const MAXD=1600;
      if(w>MAXD||h>MAXD){
        const scale=MAXD/Math.max(w,h);
        const nw=Math.round(w*scale), nh=Math.round(h*scale);
        const c=document.createElement('canvas'); c.width=nw; c.height=nh;

      svg=await buildPageSVG(pg,await exportBaseUrl(pg));

/* -- 7c: base picture ------------------------------------------------------
   A page is "wanted" while it is within about one screen of the visible area (IntersectionObserver
   with a 100% margin above and below). Wanted pages are drawn one at a time, nearest to the middle
   of the screen first. When a page leaves the margin its canvas is released (size set to 0 so the
   browser frees the bitmap) and any render still in progress is cancelled.
   Resolution: canvas pixels = page size × screen density (max 3×), reduced when needed so no canvas
   exceeds BASE_MAXDIM on a side or BASE_MAXPX in total (big posters render softer instead of failing). */
const BASE_MAXDIM=8192, BASE_MAXPX=16e6;
const baseWanted=new Set();
let basePumping=false;
const baseIO=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{
  for(const en of entries){
    const pg=pages.find(p=>p.el===en.target); if(!pg||!pg.src) continue;
    if(en.isIntersecting) baseWanted.add(pg);
    else{ baseWanted.delete(pg); freeBase(pg); }
  }
  pumpBase();
},{root:wrap,rootMargin:'100% 0px 100% 0px'}):null;
function freeBase(pg){
  pg.baseGen++;                                   // any render in flight for this page becomes stale
  if(pg.baseTask){ try{ pg.baseTask.cancel(); }catch(_){} pg.baseTask=null; }
  if(pg.baseEl){ pg.baseEl.width=pg.baseEl.height=0; pg.baseEl.remove(); pg.baseEl=null; }
  pg.baseFail=false;
}
async function pumpBase(){
  if(basePumping) return;
  basePumping=true;
  try{
    for(;;){
      const wr=wrap.getBoundingClientRect(), mid=wr.top+wr.height/2;
      let best=null, bd=Infinity;
      for(const pg of baseWanted){
        if(pg.baseEl||pg.baseFail||pg.dead) continue;
        const r=pg.el.getBoundingClientRect(), d=Math.abs((r.top+r.bottom)/2-mid);
        if(d<bd){ bd=d; best=pg; }
      }
      if(!best) break;
      await renderBase(best);
    }
  }finally{ basePumping=false; }
}
async function renderBase(pg){
  const gen=++pg.baseGen, s=pg.src;
  const stale=()=>pg.dead||gen!==pg.baseGen||!baseWanted.has(pg);
  try{
    const page=await s.doc.getPage(s.pageNum);
    if(stale()){ page.cleanup(); return; }
    let bs=Math.min(Math.max(dpr,1),3);
    bs=Math.min(bs,BASE_MAXDIM/Math.max(pg.w,pg.h),Math.sqrt(BASE_MAXPX/(pg.w*pg.h)));
    const vp=page.getViewport({scale:pg.w*bs/s.ptW});
    const c=document.createElement('canvas'); c.className='base';
    c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
    const task=page.render({canvasContext:c.getContext('2d'),viewport:vp,background:'#ffffff'});
    pg.baseTask=task;
    await task.promise;
    page.cleanup();
    if(stale()){ c.width=c.height=0; return; }
    pg.stage.insertBefore(c,pg.stage.firstChild); // first child = underneath all ink and boxes
    pg.baseEl=c;
  }catch(e){
    if(pg.dead||(e&&e.name==='RenderingCancelledException')) return;
    pg.baseFail=true; console.error(e);
    $('st').textContent='Could not draw page '+s.pageNum+': '+(e&&e.message||e);
  }finally{ if(pg.baseGen===gen) pg.baseTask=null; }
}

function replaceAllPages(specs,file,doc){
  deselectAll();
  cur=null; txDraft=null; arDraft=null; erRemoved=null; activeId=null; gp=null;
  cancelTouch(); clearLive();
  // stop everything belonging to the old document before it is destroyed
  if(baseIO) baseIO.disconnect();
  baseWanted.clear();
  for(const p of pages){ p.dead=true; freeBase(p); }
  if(pdfDoc&&pdfDoc!==doc){ try{ pdfDoc.destroy(); }catch(_){} }
  pdfDoc=doc||null;
  for(const p of pages) p.el.remove();
  pages.length=0; pageByStage.clear(); elBoxMap.clear(); elLayerMap.clear();
  activePage=null; selectedBox=null;
  for(const s of specs){
    const pg=createPage(s.w,s.h);
    if(s.pageNum) pg.src={file,doc,pageNum:s.pageNum,ptW:s.ptW,ptH:s.ptH,rotate:s.rotate}; // used by 7c–7e / Step 9 (blank project pages have none)
  }

  if(!zoomLocked){ // make sure the widest page fits; never zoom in automatically
    const widest=Math.max(...pages.map(p=>p.w));

/* ---------------------------------------------------------------
   14. PROJECT SAVE / OPEN (.inkdown = zip)
   manifest.json            version, name, zoom, active page, pdf ref, pages:[{w,h,pdfPage,data}]
   pages/pNNN.json          that page's items in z-order: ink / text / image
   images/pN_K.<ext>        original image of each image box (crop stored in JSON)
   pdf/source.pdf           the imported PDF (if any)
   Open creates every page placeholder at once but only loads the active page +/- PROJ_WIN pages;
   the rest load as they scroll near. Loaded pages stay loaded (undo history / edits are kept).
   --------------------------------------------------------------- */
const PROJ_WIN=3;
let projZip=null, projName=null, projKey=null, projBusy=false;
const projHyd=new Set();
const MIME_BY_EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'};
const EXT_BY_MIME={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'};
const r2=v=>Math.round(v*100)/100, r4=v=>Math.round(v*10000)/10000;
function setProjBtns(b){ $('saveProj').disabled=b; $('openProj').disabled=b; }

async function zipDataUrl(zip,path){
  const f=zip.file(path); if(!f) throw new Error('Missing '+path);

function cropUrl(orig,c){

    im.onload=()=>{
      const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(c.w)); cv.height=Math.max(1,Math.round(c.h));
      cv.getContext('2d').drawImage(im,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);
      res(cv.toDataURL(/^data:image\/png/.test(orig)?'image/png':'image/jpeg',0.92));

/* ---- load (lazy per page) ---- */
async function buildPageItems(pg,data,zip){
  for(const it of (data.items||[])){
    if(pg.dead) return;
    if(it.t==='ink'){
      const layer=newInkLayer(pg);
      layer.strokes=it.strokes.map(s=>{
        const {pts,...rest}=s, P=[];
        for(let i=0;i+2<pts.length;i+=3) P.push({x:pts[i],y:pts[i+1],p:pts[i+2]});
        return {...rest,pts:P};
      });
      repaintLayer(layer);
    }else if(it.t==='text'){
      const b=createBox(pg,0,0,10,10,true);
      Object.assign(b,{xPct:it.x,yPct:it.y,wPct:it.w,hPct:it.h,md:it.md||'',fontSize:it.fs||13,fontFamily:it.ff||'sans'});
      b.ta.value=b.md; applyBoxFont(b); applyBoxRect(b); renderBoxContent(b);
    }else if(it.t==='image'){
      const orig=await zipDataUrl(zip,it.file);
      const disp=it.crop?await cropUrl(orig,it.crop):orig;
      if(pg.dead) return;
      createImageBox(disp,it.ow,it.oh,{pg,props:{xPct:it.x,yPct:it.y,wPct:it.w,hPct:it.h,keepRatio:it.kr!==false,
        orig,origW:it.ow,origH:it.oh,crop:it.crop||null,origImg:Object.assign(new Image(),{src:orig})}});

}
async function hydratePage(pg){

  projHyd.add(pg);
  const {zip,path}=pg.pend;
  try{
    const data=JSON.parse(await zip.file(path).async('string'));
    if(pg.dead||zip!==projZip) return;
    await buildPageItems(pg,data,zip);
    if(pg.dead) return;
    pg.pend=null; pg.el.classList.remove('pending');
  }catch(e){
    console.error(e); $('st').textContent='Could not load page '+(pages.indexOf(pg)+1)+': '+(e&&e.message||e);
  }finally{ projHyd.delete(pg); }
}
async function hydrateAround(i){

async function hydrateAll(){ for(const p of pages) if(p.pend) await hydratePage(p); }
const projIO=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  for(const en of es){
    if(!en.isIntersecting) continue;

},{root:wrap,rootMargin:'50% 0px 50% 0px'}):null;

async function openProjectFile(file){
  projBusy=true; setProjBtns(true);
  $('st').textContent='Opening project…';
  let doc=null;
  try{
    if(!window.JSZip) throw new Error('ZIP library not loaded (check internet).');
    const zip=await JSZip.loadAsync(file);
    const mf=zip.file('manifest.json'); if(!mf) throw new Error('not a valid .inkdown file.');
    const man=JSON.parse(await mf.async('string'));
    if(man.app!=='inkdown'||!Array.isArray(man.pages)||!man.pages.length) throw new Error('not a valid .inkdown file.');
    if(man.version>1) throw new Error('saved by a newer version of this app.');
    let pdfObj=null, r=null;
    if(man.pdf&&zip.file(man.pdf.file)){
      const bytes=await zip.file(man.pdf.file).async('uint8array');
      pdfObj=new File([bytes],man.pdf.name||'source.pdf',{type:'application/pdf'});
      r=await readPdfSizes(pdfObj); doc=r.doc;
    }
    const specs=man.pages.map(p=>{
      const s={w:p.w,h:p.h,pageNum:null}, q=(r&&p.pdfPage>0)?r.specs[p.pdfPage-1]:null;
      if(q){ s.pageNum=q.pageNum; s.ptW=q.ptW; s.ptH=q.ptH; s.rotate=q.rotate; }
      return s;
    });
    if(projIO) projIO.disconnect();
    projHyd.clear();
    replaceAllPages(specs,pdfObj,doc); doc=null;
    projZip=zip; projKey=pdfObj; projName=man.name||file.name.replace(/\.inkdown$/i,'');
    pages.forEach((pg,i)=>{ pg.pend={zip,path:man.pages[i].data}; pg.el.classList.add('pending'); });
    const ai=Math.min(Math.max(0,man.active|0),pages.length-1);
    await hydrateAround(ai);
    if(!zoomLocked&&man.zoom) setZoom(man.zoom);
    navUntil=performance.now()+900;
    setActivePage(pages[ai]);
    pages[ai].el.scrollIntoView({block:'start'});
    updatePageUI();
    if(projIO){ for(const p of pages) if(p.pend) projIO.observe(p.el); }
    else await hydrateAll(); // no IntersectionObserver: load everything
    $('st').textContent='Opened “'+projName+'” — '+pages.length+' page'+(pages.length>1?'s':'');
  }catch(err){
    if(doc){ try{ doc.destroy(); }catch(_){} }
    console.error(err);
    const n=err&&err.name;
    $('st').textContent='Open failed: '+(n==='PasswordException'?'the PDF inside is password-protected.':(err&&err.message||err));
  }finally{ projBusy=false; setProjBtns(false); }
}

/* ---- save ---- */
async function saveProject(){
  if(projBusy||importing||exporting||activeId!==null) return;
  if(!window.JSZip){ $('st').textContent='Save failed: ZIP library not loaded (check internet).'; return; }
  projBusy=true; setProjBtns(true);
  try{
    deselectAll();
    const zip=new JSZip(), n=pages.length;
    let pdfFile=null;
    for(const p of pages) if(p.src&&p.src.file){ pdfFile=p.src.file; break; }
    const safe=s=>s.replace(/[\\/:*?"<>|]+/g,'_').trim()||'notes';
    const name=safe((projName&&projKey===pdfFile)?projName:(pdfFile?pdfFile.name.replace(/\.pdf$/i,''):'notes'));
    const man={app:'inkdown',version:1,name,zoom:r4(zoom),active:Math.max(0,pages.indexOf(activePage)),pdf:null,pages:[]};
    if(pdfFile){ zip.file('pdf/source.pdf',pdfFile,{compression:'STORE'}); man.pdf={file:'pdf/source.pdf',name:pdfFile.name}; }
    for(let i=0;i<n;i++){
      $('st').textContent='Saving… page '+(i+1)+' / '+n;
      const pg=pages[i], pn='pages/p'+String(i+1).padStart(3,'0')+'.json';
      let k=0, data;
      const putImg=(mime,b64)=>{ const f='images/p'+(i+1)+'_'+(++k)+'.'+(EXT_BY_MIME[mime]||'png'); zip.file(f,b64,{base64:true,compression:'STORE'}); return f; };
      if(pg.pend){ // never loaded: copy from the opened zip (images renamed to this page's slot)
        data=JSON.parse(await pg.pend.zip.file(pg.pend.path).async('string'));
        for(const it of data.items||[]) if(it.t==='image'){
          const ext=(it.file.split('.').pop()||'png').toLowerCase();
          it.file=putImg(MIME_BY_EXT[ext]||'image/png',await pg.pend.zip.file(it.file).async('base64'));
        }
      }else{
        const items=[];
        for(const el of pg.stage.children){
          const layer=elLayerMap.get(el);
          if(layer){
            if(!layer.strokes.length) continue;
            items.push({t:'ink',strokes:layer.strokes.map(sd=>{
              const {pts,...rest}=sd, flat=[];
              for(const q of pts) flat.push(r2(q.x),r2(q.y),Math.round(q.p*1000)/1000);
              return {...rest,pts:flat};
            })});
            continue;
          }
          const b=elBoxMap.get(el); if(!b||b.page!==pg) continue;
          if(b.kind==='image'){
            const {mime,b64}=splitDataUrl(b.orig);
            items.push({t:'image',file:putImg(mime,b64),x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),
              kr:!!b.keepRatio,ow:b.origW,oh:b.origH,crop:b.crop?{x:b.crop.x,y:b.crop.y,w:b.crop.w,h:b.crop.h}:null});
          }else{
            items.push({t:'text',x:r4(b.xPct),y:r4(b.yPct),w:r4(b.wPct),h:r4(b.hPct),
              md:el.classList.contains('editing')?b.ta.value:b.md,fs:b.fontSize,ff:b.fontFamily});
          }
        }
        data={items};
      }
      zip.file(pn,JSON.stringify(data));
      man.pages.push({w:pg.w,h:pg.h,pdfPage:pg.src?pg.src.pageNum:0,data:pn});
    }
    zip.file('manifest.json',JSON.stringify(man));
    $('st').textContent='Compressing…';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6},mimeType:'application/octet-stream'});
    const a=document.createElement('a'), u=URL.createObjectURL(blob);
    a.href=u; a.download=name+'.inkdown'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),10000);
    $('st').textContent='Saved '+name+'.inkdown ('+(blob.size/1048576).toFixed(2)+' MB)';
  }catch(err){
    console.error(err); $('st').textContent='Save failed: '+(err&&err.message||err);
  }finally{ projBusy=false; setProjBtns(false); }
}

/* ---------------------------------------------------------------
   15. SHAPE SNAP — on pen lift, a rough stroke becomes a clean line / circle / rectangle / square / triangle.
   No library: resample the stroke, fit each model, take the lowest error, reject scribbles.
   The result is an ordinary stroke (dense points, corners repeated so smoothing keeps them sharp),
   so undo / eraser / lasso / save / PDF export need no special handling.
   --------------------------------------------------------------- */
let snapOn=true;
try{ if(localStorage.getItem('inkdown.snap')==='0') snapOn=false; }catch(_){}
function updSnapUI(){ $('snapBtn').classList.toggle('on',snapOn); $('snapBtn').dataset.tip='Shape snap: '+(snapOn?'on':'off'); }
$('snapBtn').onclick=()=>{
  snapOn=!snapOn;
  try{ localStorage.setItem('inkdown.snap',snapOn?'1':'0'); }catch(_){}
  updSnapUI(); $('st').textContent='Shape snap '+(snapOn?'on':'off');

updSnapUI();

function snapSegDist(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  let t=l2?((p.x-a.x)*dx+(p.y-a.y)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));

function snapResample(pts,N,closed){
  const Q=closed?pts.concat([pts[0]]):pts, cum=[0];
  for(let i=1;i<Q.length;i++) cum.push(cum[i-1]+dist(Q[i-1],Q[i]));
  const T=cum[cum.length-1]; if(T<1e-6) return null;
  const out=[]; let j=1;
  for(let k=0;k<N;k++){
    const t=closed?k*T/N:k*T/(N-1);
    while(j<Q.length-1&&cum[j]<t) j++;
    const seg=cum[j]-cum[j-1], f=seg>1e-9?(t-cum[j-1])/seg:0;
    out.push({x:Q[j-1].x+(Q[j].x-Q[j-1].x)*f,y:Q[j-1].y+(Q[j].y-Q[j-1].y)*f});
  }

}
function snapHull(P){

  const lo=[], up=[];
  for(const p of S){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=S.length-1;i>=0;i--){ const p=S[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
function snapMinRect(H){
  let best=null;

    const a=H[i], b=H[(i+1)%H.length]; let ux=b.x-a.x, uy=b.y-a.y; const l=Math.hypot(ux,uy);
    if(l<1e-6) continue; ux/=l; uy/=l; const vx=-uy, vy=ux;
    let mnU=1e9,mxU=-1e9,mnV=1e9,mxV=-1e9;
    for(const q of H){ const du=q.x*ux+q.y*uy, dv=q.x*vx+q.y*vy; if(du<mnU)mnU=du; if(du>mxU)mxU=du; if(dv<mnV)mnV=dv; if(dv>mxV)mxV=dv; }
    const w=mxU-mnU, h=mxV-mnV;
    if(!best||w*h<best.area) best={area:w*h,ux,uy,vx,vy,w,h,cx:ux*(mnU+mxU)/2+vx*(mnV+mxV)/2,cy:uy*(mnU+mxU)/2+vy*(mnV+mxV)/2};

}

}
function snapMaxTri(H){
  const n=H.length; if(n<3) return null;

  for(let i=0;i<n-2;i++) for(let j=i+1;j<n-1;j++) for(let k=j+1;k<n;k++){
    const a=Math.abs((H[j].x-H[i].x)*(H[k].y-H[i].y)-(H[k].x-H[i].x)*(H[j].y-H[i].y));
    if(a>bA){ bA=a; best=[H[i],H[j],H[k]]; }
  }

}
function snapPolyErr(P,V){

let scribOn=true;

// number of direction reversals along one axis, ignoring wiggles smaller than h
function scribTurns(vals,h){
  let d=0, ex=vals[0], t=0;
  for(const v of vals){
    if(d===0){ if(Math.abs(v-ex)>=h){ d=v>ex?1:-1; ex=v; } }
    else if(d===1){ if(v>ex) ex=v; else if(ex-v>=h){ t++; d=-1; ex=v; } }
    else{ if(v<ex) ex=v; else if(v-ex>=h){ t++; d=1; ex=v; } }
  }

}
// returns path length when the stroke looks like a scribble, else 0
function scribbleLen(raw){
  if(raw.length<12) return 0;
  let L=0, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

    const q=raw[i]; if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y;

  if(!gp) return false;

  const S=snapResample(raw,Math.max(24,Math.ceil(L/3)),false); if(!S) return false;
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;

  const removed=[];
  for(const layer of gp.inkLayers){
    for(let i=layer.strokes.length-1;i>=0;i--){

      const P=sd.pts, r=5+sd.maxW/2; let hit=false, inside=0;

  // eraser tools: click = select; click again (already active) = size popup.
  // Capture phase so we read the state BEFORE the existing onclick switches the mode.
  [['mEr','eraser','erMenu'],['mAr','areaEraser','arMenu']].forEach(([btn,key,menu])=>{
    $(btn).addEventListener('click',()=>{
      const m=$(menu), wasOpen=m.style.display==='block', wasActive=(mode===key);
      closeMenus();
      if(wasActive&&!wasOpen) m.style.display='block';
    },true);
  });

  // auto-arrowhead: button opens/closes its popup; switch turns it on/off; slider sets the trigger displacement
  const paintArrow=()=>{
    $('arrBtn').classList.toggle('on',arrowOn);
    $('arrBtn').setAttribute('aria-pressed',arrowOn);
  };
  $('arrBtn').addEventListener('click',()=>{
    arrowOn=!arrowOn; paintArrow();
    try{ localStorage.setItem('inkdown.arrow',arrowOn?'1':'0'); }catch(_){}
  });

  // popup buttons (Smart ink / View / More): click toggles that popup; action rows (data-close) close it afterwards
  popTrig.forEach(([b,m])=>$(b).addEventListener('click',()=>{
    const el=$(m), wasOpen=el.style.display==='block';
    closeMenus(); if(!wasOpen) el.style.display='block';
  }));
  document.querySelectorAll('#bar .menu [data-close]').forEach(b=>b.addEventListener('click',()=>setTimeout(closeMenus,0)));
  $('arrMin').addEventListener('input',()=>{
    ARROW_MIN=+$('arrMin').value; $('arrMinV').textContent=ARROW_MIN;
    try{ localStorage.setItem('inkdown.arrowMin',ARROW_MIN); }catch(_){}
  });
  $('arrMin').value=ARROW_MIN; $('arrMinV').textContent=ARROW_MIN; paintArrow();
  $('arrSize').addEventListener('input',()=>{
    ARROW_SIZE=+$('arrSize').value;
    try{ localStorage.setItem('inkdown.arrowSize',ARROW_SIZE); }catch(_){}
  });
  $('arrSize').value=ARROW_SIZE; $('arrSize').dispatchEvent(new Event('input'));

  // the toolbar is one horizontally-scrolling row, so its popup menus are position:fixed (an absolute menu
  // would be clipped by the scroll area): drop each open menu just under its own button, kept on screen
  const placeMenus=()=>document.querySelectorAll('#bar .menu').forEach(m=>{
    if(getComputedStyle(m).display==='none') return;
    const a=m.parentElement.getBoundingClientRect(), w=m.offsetWidth;
    m.style.left=Math.max(4,Math.min(a.left,innerWidth-w-4))+'px';
    m.style.top=(a.bottom+8)+'px';
  });
  const syncOpen=()=>popTrig.forEach(([b,m])=>$(b).classList.toggle('open',$(m).style.display==='block'));
  const placeAll=()=>{ placeMenus(); syncOpen(); };
  const placeSoon=()=>requestAnimationFrame(placeAll);
  document.addEventListener('click',placeSoon,true);
  document.addEventListener('pointerup',placeSoon,true);
  $('bar').addEventListener('scroll',placeMenus,{passive:true});
  window.addEventListener('resize',placeMenus);

  // click anywhere else closes the popups (capture: runs even when other handlers stop propagation)
  document.addEventListener('click',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu')||toggles.some(t=>t.contains(e.target)))) return;
    closeMenus();
  },true);
  // 'click' never fires for stylus strokes or finger scrolls on the canvas, so also close on pointerdown
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest&&(e.target.closest('.pmenu')||toggles.some(t=>t.contains(e.target)))) return;
    const wasOpen=menus.some(m=>m.style.display==='block');
    closeMenus();
    // The press that closes a popup must not leave ink: stop it before the canvas handlers see it.
    // (Touch is left alone so a finger can still scroll/pinch; fingers never draw anyway.)
    if(wasOpen&&e.pointerType!=='touch'){
      if(e.pointerType==='pen') penDown=true; // released by the window pointerup listener
      e.stopPropagation(); e.preventDefault();
    }
  },true);

  // init
  setVal('erSize',S.er); ER=S.er; setVal('arSize',S.ar);
  loadSel();
})();
</script>
</body>
</html>
